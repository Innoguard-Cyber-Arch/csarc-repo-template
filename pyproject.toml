[project]
name = "csarc-repo-template"
version = "0.1.0"
description = "Cyber-Arch repository template source"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "copier>=9.17,<10",
  "coverage[toml]>=7.10,<8",
  "diff-cover>=9.7,<11",
  "mypy>=1.17,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "zizmor==1.29.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 80
target-version = "py314"
extend-exclude = ["template/src", "template/tests/test_smoke.py.jinja"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "S", "C901", "UP", "SIM", "RUF", "ANN", "D", "T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]
"template/tests/**" = ["D", "S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["template/scripts", "template/tests/test_spec_to_issue.py"]
exclude = [".*\\.jinja$"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["template/tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["template/scripts"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
