[project]
name = "csarc-repo-cli"
version = "0.11.0"
description = "Prompt-ready lifecycle CLI for the CSARC repository template"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "copier>=9.17,<10",
    "pyyaml>=6.0.3,<7",
    "reportlab>=4.4,<5",
]

[project.scripts]
csarc = "csarc_cli.cli:entrypoint"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csarc_cli"]

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "diff-cover>=9.7,<11",
  "mypy>=1.17,<3",
  "pypdf>=6,<7",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "zizmor==1.29.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 80
target-version = "py314"
extend-exclude = ["template/src", "template/tests/test_smoke.py.jinja"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "S", "C901", "UP", "SIM", "RUF", "ANN", "D", "T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["csarc_cli", "scripts"]

[tool.ruff.lint.per-file-ignores]
"src/csarc_cli/cli.py" = ["T20"]
"scripts/render_release_prompt.py" = ["RUF001"]
"tests/test_release_prompt.py" = ["D", "S101", "RUF001"]
"tests/**" = ["D", "S101"]
"template/tests/**" = ["D", "S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/csarc_cli", "scripts", "tests/test_spec_to_issue.py"]
exclude = [".*\\.jinja$"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["src/csarc_cli"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
