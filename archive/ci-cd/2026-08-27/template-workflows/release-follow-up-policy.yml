name: Release follow-up policy

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] the workflow never checks out or executes pull-request code
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]

concurrency:
  group: release-follow-up-${{ github.repository }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: release-follow-up
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Accept the already-validated merge queue candidate
        if: ${{ github.event_name == 'merge_group' }}
        run: echo "The trusted release follow-up policy was validated before merge queue entry."
      - if: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate from the trusted default branch
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pull_request="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          [[ "$(jq -r .state <<<"$pull_request")" == open ]] || {
            echo "Release follow-up pull request is not open." >&2
            exit 1
          }
          base_ref="$(jq -r '.base.ref // empty' <<<"$pull_request")"
          head_ref="$(jq -r '.head.ref // empty' <<<"$pull_request")"
          [[ "$base_ref" == main && "$head_ref" == release-please--* ]] || {
            echo "Trusted release follow-up policy is not applicable."
            exit 0
          }

          encoded_base="$(jq -rn --arg value "$base_ref" '$value | @uri')"
          repository_id="$(gh api "repos/$GITHUB_REPOSITORY" --jq .id)"
          [[ "$repository_id" =~ ^[0-9]+$ ]] || {
            echo "Repository identity is unavailable." >&2
            exit 1
          }
          rules="$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/$encoded_base")" || {
            echo "Cannot verify that the trusted release-follow-up workflow is required." >&2
            exit 1
          }
          jq -e --argjson repository_id "$repository_id" '
            any(
              .[];
              .type == "workflows" and
              any(
                .parameters.workflows[]?;
                .path == ".github/workflows/release-follow-up-policy.yml" and
                .ref == "refs/heads/main" and
                .repository_id == $repository_id
              )
            )
          ' <<<"$rules" >/dev/null || {
            echo "Direct-main release follow-ups require this exact default-branch workflow." >&2
            exit 1
          }

          live_base_before="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded_base" \
              --jq '.object.sha // empty'
          )"
          head_sha="$(jq -r '.head.sha // empty' <<<"$pull_request")"
          [[ "$live_base_before" =~ ^[0-9a-f]{40}$ && "$head_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Release follow-up refs are unavailable." >&2
            exit 1
          }
          git fetch --no-tags origin "$live_base_before" "$head_sha"
          git merge-base --is-ancestor "$live_base_before" "$head_sha" || {
            echo "Release follow-up is behind the live destination branch." >&2
            exit 1
          }

          expected_file_count="$(jq -r '.changed_files // empty' <<<"$pull_request")"
          [[ "$expected_file_count" =~ ^[0-9]+$ ]] || {
            echo "Release follow-up changed-file count is unavailable." >&2
            exit 1
          }
          files_json="$RUNNER_TEMP/release-follow-up-files.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            > "$files_json"
          [[ "$(jq '[.[][]] | length' "$files_json")" == "$expected_file_count" ]] || {
            echo "Release follow-up file list is incomplete." >&2
            exit 1
          }
          jq -r '.[][] | .filename, (.previous_filename // empty)' \
            "$files_json" > "$RUNNER_TEMP/release-follow-up-files"
          commits_json="$RUNNER_TEMP/release-follow-up-commits.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" \
            > "$commits_json"

          actor="$(jq -r '.user.login // empty' <<<"$pull_request")"
          actor_permission=""
          if [[ "$actor" != "github-actions[bot]" ]]; then
            encoded_actor="$(jq -rn --arg value "$actor" '$value | @uri')"
            actor_permission="$(
              gh api "repos/$GITHUB_REPOSITORY/collaborators/$encoded_actor/permission" \
                --jq '.permission // empty'
            )"
          fi
          trusted_root="$(mktemp -d "$RUNNER_TEMP/release-follow-up-policy.XXXXXX")"
          git archive "$live_base_before" | tar -x -C "$trusted_root"
          python3 "$trusted_root/scripts/release_policy.py" verify-release-follow-up \
            --repo "$GITHUB_REPOSITORY" \
            --head "$head_ref" \
            --head-repo "$(jq -r '.head.repo.full_name // empty' <<<"$pull_request")" \
            --head-sha "$head_sha" \
            --actor "$actor" \
            --actor-permission "$actor_permission" \
            --changed-files "$RUNNER_TEMP/release-follow-up-files" \
            --commits "$commits_json" \
            --root "$trusted_root"

          live_base_after="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded_base" \
              --jq '.object.sha // empty'
          )"
          [[ "$live_base_after" == "$live_base_before" ]] || {
            echo "Destination branch moved during release follow-up validation." >&2
            exit 1
          }
