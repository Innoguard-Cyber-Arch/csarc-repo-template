{{- $assetPrefix := "" -}}
{{- if eq .Lang "en" }}{{ $assetPrefix = "../" }}{{ end -}}
<!doctype html>
<html lang="{{ .Language.LanguageCode }}" data-detail-level="simple">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:,">
  <title>{{ .Title }}</title>
  <script>
    try {
      const savedDetailLevel = localStorage.getItem("csarc-detail-level");
      if (savedDetailLevel === "technical") document.documentElement.dataset.detailLevel = savedDetailLevel;
    } catch {}
  </script>
  <link rel="stylesheet" href="{{ $assetPrefix }}styles.css">
  <link rel="stylesheet" href="{{ $assetPrefix }}detail-toggle.css">
</head>
<body>
  <div class="reading-controls">
    <nav class="language-control" aria-label="{{ .Params.controls.language }}">
      {{- range .AllTranslations }}
      <a href="{{ if eq .Lang "en" }}index.en.html{{ else }}index.html{{ end }}"
         lang="{{ .Language.LanguageCode }}"{{ if eq $.Lang .Lang }} aria-current="page"{{ end }}>{{ .Language.LanguageName }}</a>
      {{- end }}
    </nav>
    <div class="detail-level-control" role="group" aria-label="{{ .Params.controls.detail }}" hidden>
      <button type="button" data-detail-level="simple" aria-pressed="true">{{ .Params.controls.simple }}</button>
      <button type="button" data-detail-level="technical" aria-pressed="false">{{ .Params.controls.technical }}</button>
    </div>
  </div>
  <main class="deck" aria-live="polite">{{ .Content }}</main>
  <nav class="controls" aria-label="{{ .Params.controls.slides }}" hidden>
    <button id="previous" type="button" aria-label="{{ .Params.controls.previous }}">←</button>
    <span class="counter" id="counter">1 / 1</span>
    <button id="next" type="button" aria-label="{{ .Params.controls.next }}">→</button>
  </nav>
  <nav class="view-controls" aria-label="{{ .Params.controls.zoom }}" hidden>
    <button id="zoom-out" type="button" aria-label="{{ .Params.controls.zoom_out }}">−</button>
    <button id="zoom-reset" type="button" aria-label="{{ .Params.controls.zoom_reset }}">{{ .Params.controls.fit }}</button>
    <span class="zoom-level" id="zoom-level" aria-live="polite">100%</span>
    <button id="zoom-in" type="button" aria-label="{{ .Params.controls.zoom_in }}">＋</button>
  </nav>
  <div class="progress" aria-hidden="true" hidden><span id="bar"></span></div>
  <script src="{{ $assetPrefix }}deck.js"></script>
  {{- if eq .Lang "zh-tw" }}
  <script src="{{ $assetPrefix }}legacy-components.js"></script>
  {{- end }}
  <script src="{{ $assetPrefix }}detail-toggle.js"></script>
</body>
</html>
