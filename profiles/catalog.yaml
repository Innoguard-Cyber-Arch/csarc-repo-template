schema_version: 1

version_policy:
  default_mode: latest_reviewed_stable
  compatibility_override: explicit_minimum_version
  stable_release_observation_days: 30
  release_source: https://www.python.org/api/v2/downloads/release/
  update_method: scheduled_verified_pull_request
  merge_after_full_verification: automatic
  future_profiles_must_define_their_own_stable_channel: true

template_release_policy:
  version_source: version.txt
  strategy: single_semver_for_all_compositions
  release_tool: release-please
  tag_format: vX.Y.Z
  breaking_change_in_any_beta_composition_bumps_major: true

branching_policy:
  default: main
  dev_mode_requires_shared_test_environment: true
  work_branch_format: type/<issue-number>-short-slug
  pull_request_must_close_matching_issue: true
  automation_branches_may_omit_issue: true

# Evaluated per Issues #74 and #110. Dependabot remains the native PR identity;
# pnpm also enforces the observation window during local and CI resolution.
# The other controls below have separate responsibilities.
dependency_version_policy:
  new_version_observation_window:
    mechanisms: [dependabot_cooldown, pnpm_minimum_release_age]
    automation: github_dependabot
    consolidation_status: native_tools_retained
    decision: >-
      Keep Dependabot so dependency pull requests trigger the existing
      required checks without a third-party App or long-lived credential.
      Keep pnpm minimumReleaseAge because it also protects local and CI
      resolution outside automated dependency pull requests.
      Keep every update independently reviewable by default. Add grouping only
      for an explicit security-reviewed allowlist with a shared rollback unit.
    decision_recorded_in: docs/index.html (supply track)
    reconsider_when: >-
      Dependabot cannot express a demonstrated cross-repository policy and
      a sustainable non-GITHUB_TOKEN automation identity already exists.
  publisher_trust_downgrade:
    mechanism: pnpm_trust_policy_no_downgrade
    stays_independent_of_renovate: true
  known_vulnerability_scanning:
    mechanism: osv_scanner
    stays_independent_of_version_cooldown: true
  resolver_bound_check:
    mechanism: report_dependency_ceiling.py
    scope: resolver_lower_and_upper_bound_only
  shipped_artifact_inventory:
    mechanism: pinned_syft_spdx_2_3

shared:
  stage: beta
  evidence: https://github.com/Innoguard-Cyber-Arch/ai-guardrail/issues/1
  applies_to: every_repository
  source: template
  update_method: copier
  includes:
    - issue_and_spec_workflow
    - pull_request_and_codeowners
    - github_rulesets_and_action_permissions
    - secret_and_action_security_checks
    - dependency_and_release_evidence

profiles:
  python:
    stage: alpha
    latest_reviewed_stable: "3.14"
    default_support_mode: latest
    support_modes:
      latest:
        requires_python: ">=3.14,<3.15"
        development_runtime: "3.14"
      minimum:
        selectable_minimums:
          - "3.12"
          - "3.13"
          - "3.14"
        development_runtime: "3.14"
        minimum_patch_policy: first_patch
        ci_tests_exact_minimum_and_every_feature_release: true
    style_guide:
      name: Google Python Style Guide
      url: https://google.github.io/styleguide/pyguide.html
      line_length: 80
    package_manager: uv
    configuration: pyproject.toml
    lockfile: uv.lock
    source_directory: src/<package_name>
    test_directory: tests
    verification: ./scripts/verify

  typescript:
    stage: alpha
    latest_reviewed_active_lts: "24"
    stable_channel: node_active_lts
    stable_release_observation_days: 30
    support_mode: active_lts_floor
    engines: ">=24"
    package_manager: pnpm
    package_manager_version: "11.22.0"
    configuration:
      - package.json
      - tsconfig.json
      - biome.json
      - vitest.config.ts
    lockfile: pnpm-lock.yaml
    source_directory: typescript/src
    test_directory: typescript/tests
    verification: ./scripts/verify
    tools:
      format_and_lint: biome
      type_check_and_build: typescript
      test_and_coverage: vitest

  go:
    stage: future
    reason: Add only after a real consuming repository defines its stable toolchain and compatibility policy, then passes create and update tests.

  rust:
    stage: future
    reason: Add only after a real consuming repository defines its stable toolchain and MSRV policy, then passes create and update tests.

compositions:
  ci:
    stage: beta
    evidence: https://github.com/Innoguard-Cyber-Arch/ai-guardrail/issues/1
    profiles: []
    release_output: github_release_source_archive

  python:
    stage: alpha
    profiles:
      - python

  python_typescript:
    stage: alpha
    profiles:
      - python
      - typescript

  typescript:
    stage: alpha
    profiles:
      - typescript

optional_modules:
  container_delivery:
    stage: alpha
    issue: https://github.com/Innoguard-Cyber-Arch/csarc-repo-template/issues/242
    pilot_repository: Innoguard-Cyber-Arch/ai-guardrail
    pilot_containerfile: evaluation/Dockerfile
    applies_to: existing_repositories_with_a_product_owned_containerfile
    modes:
      none: no_container_jobs_or_permissions
      verify: build_smoke_and_scan_without_registry_write
      ghcr: verified_release_to_ghcr_with_provenance_and_sbom
    build_context: repository_root
    platforms: [linux/amd64]
    deployment: project_specific

promotion_requirements:
  - real_consuming_repository
  - documented_owner
  - copier_create_test
  - copier_update_test
  - complete_local_and_ci_verification

promotion_evidence:
  shared:
    status: satisfied
    repository: Innoguard-Cyber-Arch/ai-guardrail
    profile: ci
    issue: https://github.com/Innoguard-Cyber-Arch/ai-guardrail/issues/1
    adoption_pull_request: https://github.com/Innoguard-Cyber-Arch/ai-guardrail/pull/2
    update_pull_request: https://github.com/Innoguard-Cyber-Arch/ai-guardrail/pull/3
  ci:
    status: satisfied
    repository: Innoguard-Cyber-Arch/ai-guardrail
    profile: ci
    result: docs/pilot-adoption.md
  python:
    status: pending_real_consuming_repository
  typescript:
    status: pending_real_consuming_repository
  python_typescript:
    status: pending_real_consuming_repository
  container_delivery:
    status: pilot_candidate_identified
    repository: Innoguard-Cyber-Arch/ai-guardrail
    containerfile: evaluation/Dockerfile
    evidence:
      - https://github.com/Innoguard-Cyber-Arch/ai-guardrail/issues/1
      - https://github.com/Innoguard-Cyber-Arch/ai-guardrail/pull/2
