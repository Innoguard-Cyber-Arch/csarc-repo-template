_min_copier_version: "9.17.0"
_subdirectory: template
_templates_suffix: .jinja
# Issue #1071: a template reference to a removed setting fails the render
# instead of silently rendering an empty value.
_envops:
  undefined: jinja2.StrictUndefined
_answers_file: .csarc/config.yml
_exclude:
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - "{% if documentation_mode == 'off' or project_mode == 'existing' %}/README.md{% else %}__keep_project_readme__{% endif %}"
  # Issue #1166: an existing repository owns its READMEs (handbook 5.1),
  # so neither language's README starter is ever added to it.
  - "{% if documentation_mode == 'off' or '+' not in documentation_languages or project_mode == 'existing' %}/README.{{ 'en' if documentation_languages.split('+')[0] == 'zh-tw' else 'zh-tw' }}.md{% else %}__keep_project_readme_secondary__{% endif %}"
  - "{% if project_mode == 'existing' %}/CHANGELOG.md{% else %}__keep_project_changelog__{% endif %}"
  - "{% if 'template-update' in scheduled_checks %}__keep_template_update_workflow__{% else %}.github/workflows/template-update.yml{% endif %}"
  - "{% if 'template-update' in scheduled_checks %}__keep_template_update_script__{% else %}.csarc/scripts/check-template-update{% endif %}"
  - "{% if 'governance-drift' in scheduled_checks %}__keep_governance_drift_workflow__{% else %}.github/workflows/governance-drift.yml{% endif %}"
  - "{% if 'governance-drift' in scheduled_checks %}__keep_governance_drift_script__{% else %}.csarc/scripts/check-governance-drift{% endif %}"
  - "{% if verification_mode == 'hosted' %}__keep_ci_workflow__{% else %}.github/workflows/ci.yml{% endif %}"
  - "{% if verification_mode == 'hosted' %}__keep_pr_policy_workflow__{% else %}.github/workflows/pr-policy.yml{% endif %}"
  - "{% if verification_mode == 'hosted' %}__keep_pr_policy_writes_workflow__{% else %}.github/workflows/pr-policy-writes.yml{% endif %}"
  - "{% if verification_mode == 'hosted' %}__keep_pr_review_workflow__{% else %}.github/workflows/pr-review.yml{% endif %}"
  - "{% if verification_mode == 'hosted' %}__keep_reviewer_assignment_workflow__{% else %}.github/workflows/governance-comment.yml{% endif %}"
  - "{% if verification_mode == 'hosted' %}__keep_spec_sync_workflow__{% else %}.github/workflows/spec-to-issue.yml{% endif %}"
  - "{% if verification_mode == 'hosted' and lifecycle %}__keep_work_item_lifecycle_workflow__{% else %}.github/workflows/work-item-lifecycle.yml{% endif %}"
  - "{% if verification_mode == 'hosted' %}__keep_osv_workflow__{% else %}.github/workflows/osv.yml{% endif %}"
  - "{% if verification_mode == 'hosted' %}__keep_dependabot_merge_workflow__{% else %}.github/workflows/dependabot-merge.yml{% endif %}"
  - "{% if verification_mode == 'hosted' %}__keep_dependabot_auto_merge_workflow__{% else %}.github/workflows/dependabot-auto-merge.yml{% endif %}"
  # Issue #1083: an existing project whose legacy template-generated
  # release writer migrated to CSARC ownership renders the same hosted
  # release workflow; the CLI passes csarc_release_workflow for it.
  - "{% if release_ownership == 'csarc-owned' and verification_mode == 'hosted' and (project_mode == 'new' or csarc_release_workflow | default(false)) %}__keep_release_workflow__{% else %}.github/workflows/release.yml{% endif %}"
  - "{% if release_ownership == 'csarc-owned' and verification_mode == 'hosted' and (project_mode == 'new' or csarc_release_workflow | default(false)) %}__keep_release_drift_workflow__{% else %}.github/workflows/release-drift.yml{% endif %}"
  - "{% if release_ownership == 'csarc-owned' and verification_mode == 'hosted' and (project_mode == 'new' or csarc_release_workflow | default(false)) %}__keep_release_drift_script__{% else %}.csarc/scripts/check-release-drift{% endif %}"
  - "{% if verification_mode == 'hosted' and documentation_mode == 'template-and-content' %}__keep_pages_workflow__{% else %}.github/workflows/pages.yml{% endif %}"
  - "{% if verification_mode == 'hosted' and enable_codeql | default(false) %}__keep_codeql__{% else %}.github/workflows/codeql.yml{% endif %}"
  - "{% if container %}__keep_dockerfile__{% else %}Dockerfile{% endif %}"
  - "{% if container %}__keep_docker_compose__{% else %}docker-compose.yml{% endif %}"
  - "{% if verification_mode == 'hosted' and container %}__keep_docker_workflow__{% else %}.github/workflows/docker-build-scan.yml{% endif %}"
  - "{% if documentation_mode == 'template-and-content' %}__keep_repo_site__{% else %}.csarc/site{% endif %}"
  - "{% if documentation_mode == 'template-and-content' %}__keep_repo_site_builder__{% else %}.csarc/scripts/build-repo-site{% endif %}"
  - "{% if documentation_mode == 'template-and-content' %}__keep_repo_site_python__{% else %}.csarc/scripts/build_repo_site.py{% endif %}"
  - "{% if documentation_mode == 'template-and-content' %}__keep_repo_site_blocks__{% else %}.csarc/scripts/repo_site_blocks.py{% endif %}"
  - "{% if documentation_mode == 'template-and-content' %}__keep_repo_site_renderer__{% else %}.csarc/scripts/render_site.py{% endif %}"
  - "{% if documentation_mode == 'template-and-content' %}__keep_repo_site_navigation_check__{% else %}.csarc/scripts/check-repo-site-navigation{% endif %}"
  - "{% if documentation_mode == 'template-and-content' %}__keep_repo_site_translation_check__{% else %}.csarc/scripts/check-repo-site-translations{% endif %}"
  - "{% if documentation_mode == 'template-and-content' %}__keep_repo_site_version_check__{% else %}.csarc/scripts/check-repo-site-versions{% endif %}"
  - "{% if documentation_mode == 'template-and-content' %}__keep_repo_site_content__{% else %}docs/site{% endif %}"
  - "{% if documentation_mode == 'template-and-content' and '+' in documentation_languages %}__keep_secondary_site_content__{% else %}docs/site/content/_index.{{ 'en' if documentation_languages.split('+')[0] == 'zh-tw' else 'zh-tw' }}.md{% endif %}"
  - "{% if documentation_mode != 'off' %}__keep_docs_map__{% else %}docs/README.md{% endif %}"
  - "{% if documentation_mode != 'off' %}__keep_docs_specs__{% else %}docs/specs{% endif %}"
  - "{% if documentation_mode != 'off' %}__keep_docs_decisions__{% else %}docs/adr{% endif %}"
  - "{% if 'go' in languages %}__keep_go_module__{% else %}go.mod{% endif %}"
  - "{% if 'go' in languages and project_mode == 'new' %}__keep_go_command__{% else %}/cmd{% endif %}"
  - "{% if 'go' in languages and project_mode == 'new' %}__keep_go_internal__{% else %}/internal{% endif %}"
  - "{% if 'python' in languages %}__keep_python_version__{% else %}.python-version{% endif %}"
  - "{% if 'python' in languages %}__keep_python_project__{% else %}pyproject.toml{% endif %}"
  - "{% if 'python' in languages %}__keep_python_source__{% else %}/src/{{package_name}}{% endif %}"
  - "{% if 'python' in languages %}__keep_python_tests__{% else %}/tests{% endif %}"
  - "{% if 'typescript' in languages %}__keep_node_version__{% else %}.node-version{% endif %}"
  - "{% if 'typescript' in languages %}__keep_node_package__{% else %}package.json{% endif %}"
  - "{% if 'typescript' in languages %}__keep_pnpm_workspace__{% else %}pnpm-workspace.yaml{% endif %}"
  - "{% if 'typescript' in languages %}__keep_biome__{% else %}biome.json{% endif %}"
  - "{% if 'typescript' in languages %}__keep_tsconfig__{% else %}tsconfig.json{% endif %}"
  - "{% if 'typescript' in languages %}__keep_tsconfig_build__{% else %}tsconfig.build.json{% endif %}"
  - "{% if 'typescript' in languages %}__keep_vitest__{% else %}vitest.config.ts{% endif %}"
  - "{% if 'typescript' in languages %}__keep_typescript_source__{% else %}/typescript{% endif %}"
  - "{% if 'rust' in languages %}__keep_rust_toolchain__{% else %}rust-toolchain.toml{% endif %}"
  - "{% if 'rust' in languages %}__keep_rust_manifest__{% else %}Cargo.toml{% endif %}"
  - "{% if 'rust' in languages %}__keep_rust_source__{% else %}/src/lib.rs{% endif %}"
  - "{% if not ('python' in languages or 'rust' in languages or 'typescript' in languages) %}__keep_ci_version__{% else %}.csarc/version.txt{% endif %}"
  - "{% if code_owner %}__keep_codeowners__{% else %}.github/CODEOWNERS{% endif %}"
  # Issue #1078: a product-owned license is never rendered by CSARC.
  - "{% if (project_license | default('')) == 'custom' %}/LICENSE{% else %}__keep_license__{% endif %}"
  # Issue #1077: every rendered script, workflow, and operations document
  # has a caller that the selected options enable. The generated-layout ADR
  # (docs/adr/generated-repository-layout.md) lists these payload rules.
  - "{% if verification_mode == 'hosted' %}__keep_reviewer_assignment_script__{% else %}.csarc/scripts/request-reviewer{% endif %}"
  - "{% if verification_mode == 'hosted' %}__keep_work_item_metadata_script__{% else %}.csarc/scripts/sync_work_item_metadata.py{% endif %}"
  - "{% if verification_mode == 'hosted' %}__keep_scope_gate_script__{% else %}.csarc/scripts/check-scope-gate{% endif %}"
  # Issue #1129: hosted-evidence readers and the open-Milestone nudge only
  # run from hosted workflows and the hosted PR policy.
  - "{% if verification_mode == 'hosted' %}__keep_trusted_verification_check__{% else %}.csarc/scripts/check-trusted-verification{% endif %}"
  - "{% if verification_mode == 'hosted' %}__keep_verification_evidence__{% else %}.csarc/scripts/verification_evidence.py{% endif %}"
  # Issue #1177: hosted-only code split from pr_lifecycle.py,
  # sync_milestone_state.py, and authenticate_dependabot_head.py; local
  # verification never calls it.
  - "{% if verification_mode == 'hosted' %}__keep_pr_lifecycle_hosted__{% else %}.csarc/scripts/pr_lifecycle_hosted.py{% endif %}"
  - "{% if verification_mode == 'hosted' %}__keep_sync_milestone_state_hosted__{% else %}.csarc/scripts/sync_milestone_state_hosted.py{% endif %}"
  - "{% if verification_mode == 'hosted' %}__keep_authenticate_dependabot_hosted__{% else %}.csarc/scripts/authenticate_dependabot_hosted.py{% endif %}"
  - "{% if verification_mode == 'hosted' %}__keep_open_milestone_detector__{% else %}.csarc/scripts/detect-open-milestone{% endif %}"
  - "{% if verification_mode == 'hosted' and 'issues' in lifecycle %}__keep_issue_policy_script__{% else %}.csarc/scripts/validate-issue-policy{% endif %}"
  - "{% if verification_mode == 'hosted' or documentation_mode != 'off' %}__keep_spec_script__{% else %}.csarc/scripts/spec_to_issue.py{% endif %}"
  # Issue #1208: Milestone approval, promotion, and delivery sync. Hosted
  # PR policy and release workflows call them on every render, so only a
  # local render without Milestones omits them; callers treat a missing
  # module as Milestones not enabled.
  - "{% if verification_mode == 'hosted' or 'milestones' in lifecycle %}__keep_sync_milestone_state__{% else %}.csarc/scripts/sync_milestone_state.py{% endif %}"
  - "{% if verification_mode == 'hosted' or 'milestones' in lifecycle %}__keep_promotion_gate__{% else %}.csarc/scripts/promotion_gate.py{% endif %}"
  - "{% if verification_mode == 'hosted' or 'milestones' in lifecycle %}__keep_delivery_sync__{% else %}.csarc/scripts/delivery_sync.py{% endif %}"
  - "{% if 'milestones' in lifecycle %}__keep_milestone_format__{% else %}.csarc/docs/milestone-description.md{% endif %}"
  - "{% if 'milestones' in lifecycle %}__keep_milestone_tracker_form__{% else %}.github/ISSUE_TEMPLATE/milestone-tracker.yml{% endif %}"
  - "{% if documentation_mode != 'off' %}__keep_documentation_policy__{% else %}.csarc/docs/documentation-policy.md{% endif %}"
  # The Chinese writing guide renders only for a Traditional Chinese project.
  - "{% if 'zh-tw' in (documentation_languages | default('')) %}__keep_chinese_writing_guide__{% else %}.csarc/docs/writing-guide.md{% endif %}"
  - "{% if release_ownership == 'csarc-owned' %}__keep_publish_release__{% else %}.csarc/scripts/publish-release{% endif %}"
  - "{% if release_ownership == 'csarc-owned' %}__keep_release_writer__{% else %}.csarc/scripts/release_writer.py{% endif %}"
  - "{% if release_ownership == 'csarc-owned' %}__keep_release_bundle__{% else %}.csarc/scripts/release_bundle.py{% endif %}"
  - "{% if release_ownership == 'csarc-owned' %}__keep_converge_release_tag__{% else %}.csarc/scripts/converge-release-tag{% endif %}"
  - "{% if release_ownership == 'csarc-owned' %}__keep_verify_release_candidate__{% else %}.csarc/scripts/verify-release-candidate{% endif %}"
  - "{% if release_ownership == 'csarc-owned' %}__keep_verify_release_consumption__{% else %}.csarc/scripts/verify_release_consumption.py{% endif %}"
  # Issue #1129: release_policy.py keeps only the capability preflight every
  # project's CLI runs; the CSARC release commands render for their owner.
  - "{% if release_ownership == 'csarc-owned' %}__keep_release_candidate__{% else %}.csarc/scripts/release_candidate.py{% endif %}"
  # An adopted repository keeps its own product starters, manifests,
  # lockfiles, and tool settings; only CSARC runtime is added (#1058 decision 25).
  - "{% if (project_mode | default('')) == 'existing' %}/src{% else %}__keep_new_src__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}/tests{% else %}__keep_new_tests__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}/cmd{% else %}__keep_new_cmd__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}/internal{% else %}__keep_new_internal__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}/typescript{% else %}__keep_new_typescript__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}go.mod{% else %}__keep_new_go_mod__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}pyproject.toml{% else %}__keep_new_pyproject_toml__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}.python-version{% else %}__keep_new__python_version__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}package.json{% else %}__keep_new_package_json__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}pnpm-workspace.yaml{% else %}__keep_new_pnpm_workspace_yaml__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}.node-version{% else %}__keep_new__node_version__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}biome.json{% else %}__keep_new_biome_json__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}tsconfig.json{% else %}__keep_new_tsconfig_json__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}tsconfig.build.json{% else %}__keep_new_tsconfig_build_json__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}vitest.config.ts{% else %}__keep_new_vitest_config_ts__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}Cargo.toml{% else %}__keep_new_Cargo_toml__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}rust-toolchain.toml{% else %}__keep_new_rust_toolchain_toml__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}Dockerfile{% else %}__keep_new_Dockerfile__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}docker-compose.yml{% else %}__keep_new_docker_compose_yml__{% endif %}"
# Copier also evaluates these patterns while it lists files the old side
# removed, before every answer is loaded; the defaults keep that internal
# pass working under StrictUndefined without changing any rendered path.
_skip_if_exists:
  - "src/**/*.py"
  - "tests/**/*.py"
  - "typescript/src/**/*.ts"
  - "typescript/tests/**/*.ts"
  - "cmd/**/*.go"
  - "internal/**/*.go"
  - "docs/specs/**/*.md"
  - "docs/adr/**/*.md"
  - "docs/site-content.md"
  - "docs/site/theme.css"
  - "docs/site/content/_index.zh-tw.md"
  - "docs/site/content/_index.en.md"
  - "docs/site/data/navigation.json"
  - "{% if (project_mode | default('')) == 'existing' %}/README.md{% else %}__overwrite_readme__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}/README.{{ 'en' if (documentation_languages | default('')).split('+')[0] == 'zh-tw' else 'zh-tw' }}.md{% else %}__overwrite_secondary_readme__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}/LICENSE{% else %}__overwrite_license__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}/SECURITY.md{% else %}__overwrite_scanner_policy__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}/.github/SECURITY.md{% else %}__overwrite_security_policy__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}go.mod{% else %}__overwrite_go_manifest__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}pyproject.toml{% else %}__overwrite_python_manifest__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}package.json{% else %}__overwrite_node_manifest__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}Cargo.toml{% else %}__overwrite_rust_manifest__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}Dockerfile{% else %}__overwrite_dockerfile__{% endif %}"
  - "{% if (project_mode | default('')) == 'existing' %}docker-compose.yml{% else %}__overwrite_docker_compose__{% endif %}"
_tasks:
  - command: "uv lock --python {{ '3.14' if python_floor == 'latest' else python_floor }}"
    when: "{{ _copier_operation == 'copy' and project_mode == 'new' and 'python' in languages }}"
  - command: "pnpm install --lockfile-only --ignore-scripts"
    when: "{{ _copier_operation == 'copy' and project_mode == 'new' and 'typescript' in languages }}"
  - command: "cargo generate-lockfile"
    when: "{{ _copier_operation == 'copy' and project_mode == 'new' and 'rust' in languages }}"
  - command: "bash .csarc/scripts/build-repo-site"
    when: "{{ documentation_mode == 'template-and-content' }}"
_migrations:
  - command:
      - python3
      - -c
      - |-
        import hashlib
        import re
        from pathlib import Path

        # The answers file can already sit at either name by this point:
        # `.copier-answers.yml` for a repository this migration has not
        # touched yet, or `.csarc/config.yml` when the CLI's own legacy
        # migration (src/csarc_cli/cli.py) already renamed it earlier in
        # this same `copier update` call, before Copier itself ran. Check
        # both instead of hardcoding the legacy name, and skip quietly if
        # neither is present rather than crashing this finalize task.
        path = Path(".copier-answers.yml")
        if not path.is_file():
            path = Path(".csarc/config.yml")
        if path.is_file():
            source = path.read_text(encoding="utf-8")
            migrated, count = re.subn(
                r"(?m)^(branch_strategy:\s*)(?:dev|'dev'|\"dev\")(\s*(?:#.*)?)$",
                r"\1main\2",
                source,
            )
            if count > 1:
                raise SystemExit(
                    "Found duplicate legacy branch_strategy answers"
                )
            migrated = re.sub(
                r"(?m)^(release_level_(?:alpha|beta|early|formal)_verification:\s*)"
                r"(?:baseline|'baseline'|\"baseline\"|docs|'docs'|\"docs\")"
                r"(\s*(?:#.*)?)$",
                r"\1fast\2",
                migrated,
            )
            if migrated != source:
                path.write_text(migrated, encoding="utf-8")

        legacy_template_tests = {
            Path("tests/fixtures/syft-v1.50.0-runtime.spdx.json"): {
