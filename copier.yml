            },
            Path("tests/test_verify_attestation.py"): {
                "d21b65e731a64cd471e5450d759a00e068d4952282ea8028cf69b0535e7c1dc8",
            },
            Path("tests/test_work_item_metadata.py"): {
                "b20b1b2928794e4d065b7359a45a039c1011640bb02ce19c3041c338c3c52385",
            },
            Path("tests/test_work_pr_closure.py"): {
                "2377a6d27e0b6895e2bf4c37ae5f6cd8cd1db4f974b0970c1ea9520530c01832",
            },
        }
        for legacy_test, known_hashes in legacy_template_tests.items():
            if (
                legacy_test.is_file()
                and not legacy_test.is_symlink()
                and hashlib.sha256(legacy_test.read_bytes()).hexdigest()
                in known_hashes
            ):
                legacy_test.unlink()
    when: "{{ _stage == 'before' }}"
  - command: "bash scripts/build-repo-site"
    when: "{{ _stage == 'after' }}"
_message_after_copy: |
  {% if project_mode == 'existing' %}Existing product files and its release workflow were preserved. Review .csarc/config.yml, merge the required tool settings described in README.md, run ./scripts/verify, then link the pull request to its Issue. Apply release settings only when the product-owned workflow requires them.{% else %}Project created with the CSARC release workflow. Confirm .csarc/config.yml, run ./scripts/verify, then open an Issue and its numbered branch before the first pull request. Before the first release, an administrator must run ./scripts/apply-repository-settings.sh plan, review it, then run apply and check so immutable Releases and the other required controls are enabled.{% endif %} GitHub template creation and Copier do not copy repository settings. See README.md for the capability and visibility matrices.

project_mode:
  type: str
  help: Create a new repository or add the public baseline to an existing codebase
  choices:
    New repository: new
    Adopt an existing repository: existing
  default: new

release_ownership:
  type: str
  help: Single owner allowed to create release tags, Releases, and assets
  choices:
    CSARC release workflow: csarc-owned
    Existing product release workflow: product-owned
    Verification without release writes: verification-only
  default: "{{ 'csarc-owned' if project_mode == 'new' else 'verification-only' }}"
  when: false

release_workflow:
  type: str
  help: Explicit repository-relative workflow selected by the release owner
  default: "{{ '.github/workflows/release.yml' if release_ownership == 'csarc-owned' else '' }}"
  when: false

release_required_inputs:
  type: yaml
  help: Required workflow_dispatch inputs declared by the selected workflow
  default: []
  when: false

release_ownership_reason:
  type: str
  help: Auditable reason for the selected release ownership
  default: "{{ 'CSARC owns the only version and GitHub Release workflow.' if release_ownership == 'csarc-owned' else 'No release workflow is selected; CSARC verifies only.' }}"
  when: false

release_settings_owner:
  type: str
  help: Owner responsible for release-related repository settings
  choices:
    CSARC bootstrap administrator: csarc-admin
    Product administrator: product-admin
    No release settings owner: none
  default: "{{ 'csarc-admin' if release_ownership == 'csarc-owned' else 'product-admin' if release_ownership == 'product-owned' else 'none' }}"
  when: false

release_immutable_releases:
  type: str
  help: Whether immutable GitHub Releases are required by this ownership mode
  choices:
    Required during CSARC bootstrap: required
    Defined by the product release contract: product-defined
    Not required for verification-only: not-required
  default: "{{ 'required' if release_ownership == 'csarc-owned' else 'product-defined' if release_ownership == 'product-owned' else 'not-required' }}"
  when: false

project_name:
  type: str
  help: Human-readable project name
  default: CSARC Project
  validator: "{% if not project_name | trim %}Enter a non-empty project name.{% endif %}"

project_slug:
  type: str
  help: Repository and distribution name
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  validator: "{% if not project_slug | regex_search('^[a-z0-9](?:[a-z0-9._-]{0,212}[a-z0-9])?$') %}Use 1-214 lowercase letters, numbers, dots, underscores, or hyphens; start and end with a letter or number.{% endif %}"

project_description:
  type: str
  help: Organization-approved one-sentence purpose for README and package metadata
  default: "Source code and delivery automation for {{ project_name }}."
  validator: "{% if not project_description | default('', true) | trim or project_description | trim | lower in ['a cyber-arch project', 'todo', 'tbd', 'placeholder'] or '<' in project_description %}Enter the approved project purpose without placeholder text.{% endif %}"

language:
  type: str
  help: Deprecated compatibility value for repositories created before language modules became multi-select
  default: python
  when: false

languages:
  type: str
  help: Select each programming language used by the project; leave all unchecked for the CI/CD baseline only
  multiselect: true
  choices:
    Python: python
    Rust: rust
    TypeScript: typescript
  default: "{{ [] if language == 'ci' else language.split('-') }}"

branch_strategy:
  type: str
  help: Choose how issue branches are integrated before promotion to main
  choices:
    Main with short-lived Milestone delivery branches: delivery
    Short branch → pull request → main: main
  default: delivery

readme_primary_language:
  type: str
  help: Which README language GitHub shows by default at README.md; the other language is generated as README.<lang>.md
  choices:
    繁體中文 (Traditional Chinese): zh-tw
    English: en
  default: zh-tw

package_name:
  type: str
  help: Python import package name
  default: "{{ project_slug | replace('-', '_') }}"
  when: "{{ 'python' in languages }}"
  validator: "{% if not package_name | regex_search('^[a-z_][a-z0-9_]*$') %}Use a lowercase Python identifier containing letters, numbers, or underscores.{% endif %}"

code_owner:
  type: str
  help: Existing GitHub team used by CODEOWNERS, for example @Innoguard-Cyber-Arch/platform
  default: "@Innoguard-Cyber-Arch/arch"
  validator: "{% if not code_owner.startswith('@Innoguard-Cyber-Arch/') %}Use an existing @Innoguard-Cyber-Arch/<team> owner.{% endif %}"

project_run_command:
  type: str
  help: Shortest command that successfully starts or invokes the product
  default: "{% if languages %}{% if 'python' in languages %}uv run python -c 'import {{ package_name }}'{% endif %}{% if 'python' in languages and ('typescript' in languages or 'rust' in languages) %} && {% endif %}{% if 'typescript' in languages %}pnpm run build{% endif %}{% if 'typescript' in languages and 'rust' in languages %} && {% endif %}{% if 'rust' in languages %}cargo test --locked{% endif %}{% else %}./scripts/verify{% endif %}"
  validator: "{% if not project_run_command | default('', true) | trim or project_run_command | trim | lower in ['todo', 'tbd', 'placeholder'] or '<' in project_run_command %}Enter a working product command without placeholder text.{% endif %}"

project_verification_hook:
  type: str
  help: Optional repository-relative executable run after the CSARC verification
  default: ""
  when: "{{ project_mode == 'existing' }}"
  validator: "{% set hook = project_verification_hook | default('', true) | trim %}{% if hook and (hook != project_verification_hook or hook.startswith('/') or '..' in hook.split('/') or not (hook | regex_search('^[A-Za-z0-9._/-]+$'))) %}Use a safe repository-relative executable path without spaces, shell syntax, or parent traversal.{% endif %}"

repository_url:
  type: str
  help: Canonical GitHub repository URL used by badges and package metadata
  default: "https://github.com/{{ code_owner.split('/')[0] | replace('@', '') }}/{{ project_slug }}"
  validator: "{% if not repository_url | default('', true) | regex_search('^https://github\\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') %}Use https://github.com/owner/repository without a trailing slash or .git suffix.{% endif %}"

security_reporting_channel:
  type: str
  help: Organization-approved vulnerability reporting instructions
  default: "Open a GitHub Issue at {{ repository_url }}/issues/new; maintainers receive notifications for new Issues."
  validator: "{% if not security_reporting_channel | default('', true) | trim or security_reporting_channel | trim | lower in ['todo', 'tbd', 'placeholder'] or '<' in security_reporting_channel %}Enter the approved reporting channel without placeholder text; do not invent an email address or SLA.{% endif %}"

reviewers:
  type: str
  help: Comma-separated GitHub usernames eligible for review assignment; assign manually until the Action is active
  default: "@jachline28"
  validator: "{% if not reviewers | regex_search('^@[A-Za-z0-9][A-Za-z0-9-]{0,38}(?:\\s*,\\s*@[A-Za-z0-9][A-Za-z0-9-]{0,38})*$') %}Use one or more @username values separated by commas.{% endif %}"

python_support_mode:
  type: str
  help: Use the reviewed latest stable Python release, or declare an older minimum supported release
  choices:
    Latest stable only (Python 3.14): latest
    Declare a minimum supported version: minimum
  default: latest
  when: "{{ 'python' in languages }}"

python_min_version:
  type: str
  help: Oldest Python feature release that this project promises to support
  choices:
    - "3.12"
    - "3.13"
    - "3.14"
  default: "3.12"
  when: "{{ 'python' in languages and python_support_mode == 'minimum' }}"

coverage_mode:
  type: str
  help: New projects use global coverage; existing projects may measure changed lines first
  choices:
    - global
    - diff
  default: global

coverage_threshold:
  type: int
  help: Minimum percentage required by the selected coverage mode
  default: 80
  validator: "{% if coverage_threshold < 1 or coverage_threshold > 100 %}Use an integer from 1 to 100.{% endif %}"

enable_precommit:
  type: bool
  help: Add optional local pre-commit hooks; CI remains authoritative
  default: false

enable_template_update_notifications:
  type: bool
  help: Check weekly for a newer Copier template release and maintain one notification Issue
  default: false

project_visibility:
  type: str
  help: GitHub repository visibility this project will use
  choices:
    Public: public
    Private: private
    Internal (GitHub Enterprise Cloud only): internal
  default: private

enable_codeql:
  type: bool
  help: Enable CodeQL SAST on public repositories or private/internal repositories licensed for GitHub Code Security
  default: "{{ project_visibility == 'public' and ('python' in languages or 'typescript' in languages) }}"
  when: "{{ 'python' in languages or 'typescript' in languages }}"

enable_docker:
  type: bool
  help: Add an optional Dockerfile, docker-compose file, and an opt-in build-and-scan CI workflow for a containerized project
  default: false

enable_governance_drift_check:
  type: bool
  help: Reserve the optional scheduled governance drift check; keep disabled until its GitHub Action is active
  default: false

policy_repository_settings:
  type: bool
  help: Apply this template's repository settings policy (merge strategies, wiki, projects, issues, delete-branch-on-merge) from policies/repository.json
  default: true

policy_actions_permissions:
  type: bool
  help: Apply this template's Actions workflow permissions policy (default token permissions and PR-approval capability) from policies/actions.json
  default: true

policy_labels:
  type: bool
  help: Create and maintain this template's governance labels (bug, enhancement, hotfix, and the rest) from policies/labels.json
  default: true

policy_branch_ruleset:
  type: bool
  help: Enforce this template's branch protection Ruleset (required review, non-fast-forward) from policies/rulesets.json where the GitHub plan allows it
  default: true

release_levels_enabled:
  type: bool
  help: Resolve each pull request's release level from its trusted Issue or Milestone declaration; when disabled, every pull request uses default_release_level
  default: true

default_release_level:
  type: str
  help: Release level used when no trusted declaration is available
  choices:
    alpha: alpha
    beta: beta
    Early release (0.y.z): early
    Formal release (1.0.0 and later): formal
  default: "{{ 'beta' if _copier_operation == 'update' or project_mode == 'existing' else 'alpha' }}"

release_level_alpha_review:
  type: str
  help: Review requirement for alpha work
  choices: &release_level_review_choices
    Self-review permitted: self
    Independent peer required: peer
  default: self

release_level_alpha_verification:
  type: str
  help: Minimum verification suite for alpha work
  choices: &release_level_verification_choices
    Baseline checks: baseline
    Baseline and fast tests: fast
    Baseline, fast tests, documentation and site: docs
    Full verification: full
  default: baseline

release_level_beta_review:
  type: str
  help: Review requirement for beta work
  choices: *release_level_review_choices
  default: peer

release_level_beta_verification:
  type: str
  help: Minimum verification suite for beta work
  choices: *release_level_verification_choices
  default: fast

release_level_early_review:
  type: str
  help: Review requirement for early-release work
  choices: *release_level_review_choices
  default: peer

release_level_early_verification:
  type: str
  help: Minimum verification suite for early-release work
  choices: *release_level_verification_choices
  default: docs

release_level_formal_review:
  type: str
  help: Review requirement for formal-release work
  choices: *release_level_review_choices
  default: peer

release_level_formal_verification:
  type: str
  help: Minimum verification suite for formal-release work
  choices: *release_level_verification_choices
  default: full

pr_review_mode:
  type: str
  help: How a pull request earns merge approval. Copilot mode auto-requests GitHub Copilot code review on every push and accepts a clean Copilot review of the exact head (a maintainer approval still works); human mode keeps the required maintainer approval. Copilot mode needs a Copilot license with code review enabled.
  choices:
    GitHub Copilot review, maintainer approval still accepted: copilot
    Maintainer approval only: human
  default: "{{ 'human' if _copier_operation == 'update' else 'copilot' }}"

copilot_review_max_level:
  type: str
  help: Highest declared release level a clean Copilot review may approve; higher levels need a maintainer approval. The release value is the formal-level alias retained for compatibility.
  choices:
    No limit: unlimited
    alpha: alpha
    beta: beta
    Early release (0.y.z): early
    Stable release (1.0.0 and later): release
  default: unlimited
  when: "{{ pr_review_mode == 'copilot' }}"
