_message_after_copy: |
  {% if project_mode == 'existing' %}Existing product files and its release workflow were preserved. Review .csarc/config.yml, merge the required tool settings described in .csarc/docs/csarc.md, run ./.csarc/scripts/verify, then link the pull request to its Issue. Apply release settings only when the product-owned workflow requires them.{% elif verification_mode == 'hosted' %}Project created with the CSARC hosted verification and release workflows. Confirm .csarc/config.yml, run ./.csarc/scripts/verify, then open an Issue and its numbered branch before the first pull request. Before the first release, an administrator must run ./.csarc/scripts/apply-repository-settings.sh plan, review it, then run apply and check so immutable Releases and the other required controls are enabled.{% else %}Project created with local verification and no hosted validation or release workflow. Initialize Git, commit the candidate, then run ./.csarc/scripts/verify-fast once to record merge evidence. Switch to verification_mode: hosted and update before the first release.{% endif %} GitHub template creation and Copier do not copy repository settings. See {% if documentation_mode == 'off' %}.csarc/docs/csarc.md{% else %}README.md{% endif %} for the remaining project guidance.

project_mode:
  type: str
  help: Create a new repository or add the public baseline to an existing codebase
  choices:
    New repository: new
    Adopt an existing repository: existing
  default: new

release_ownership:
  type: str
  help: Single owner allowed to create release tags, Releases, and assets
  choices:
    CSARC release workflow: csarc-owned
    Existing product release workflow: product-owned
    Verification without release writes: verification-only
  default: "{{ 'csarc-owned' if project_mode == 'new' else 'verification-only' }}"
  when: false

project_name:
  type: str
  help: Human-readable project name
  default: CSARC Project
  validator: "{% if not project_name | trim %}Enter a non-empty project name.{% endif %}"

project_slug:
  type: str
  help: Repository and distribution name
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  validator: "{% if not project_slug | regex_search('^[a-z0-9](?:[a-z0-9._-]{0,212}[a-z0-9])?$') %}Use 1-214 lowercase letters, numbers, dots, underscores, or hyphens; start and end with a letter or number.{% endif %}"

project_description:
  type: str
  help: Organization-approved one-sentence purpose for README and package metadata
  default: "Source code and delivery automation for {{ project_name }}."
  validator: "{% if not project_description | default('', true) | trim or project_description | trim | lower in ['a cyber-arch project', 'todo', 'tbd', 'placeholder'] or '<' in project_description %}Enter the approved project purpose without placeholder text.{% endif %}"

# SPEC-009 (Issue #1071) classifies every question below. Only persistent
# intent is saved to .csarc/config.yml (see the answers file template);
# one-time seeds, live repository facts, derived context, and the immutable
# project_mode are recorded by the pinned CLI in .csarc/provenance.json.
documentation_mode:
  type: str
  help: Apply the CSARC documentation presentation and content starter, organize project-owned content only, or leave documentation unmanaged
  choices:
    Apply documentation template and content structure: template-and-content
    Organize documentation content without the presentation template: content-only
    Do not manage documentation: 'off'
  default: "{{ 'content-only' if project_mode == 'existing' else 'template-and-content' }}"

documentation_languages:
  type: str
  help: Languages of project-owned documentation; the first is primary and a second is maintained alongside it
  choices:
    繁體中文 (Traditional Chinese): zh-tw
    English: en
    繁體中文 with English: zh-tw+en
    English with 繁體中文: en+zh-tw
  default: zh-tw+en

# Render-derived values (never saved): the primary and optional secondary
# language split from documentation_languages. Copier also evaluates
# `_exclude` while it rebuilds an older release's side of an update, where
# these new computed values do not exist, so the exclusion and skip rules
# above read documentation_languages directly.
documentation_primary_language:
  type: str
  default: "{{ documentation_languages.split('+')[0] }}"
  when: false

documentation_secondary_language:
  type: str
  default: "{{ documentation_languages.split('+')[1] if '+' in documentation_languages else '' }}"
  when: false

project_license:
  type: str
  help: Project license; proprietary is closed by default
  choices:
    Proprietary, all rights reserved: proprietary
    MIT License: MIT
    Apache License 2.0: Apache-2.0
    Product-owned license (CSARC renders no LICENSE): custom
  default: proprietary

copyright_holder:
  type: str
  help: Copyright holder written to LICENSE and package metadata
  default: "{{ '' if project_license == 'custom' else project_name }}"
  when: "{{ project_license != 'custom' }}"
  validator: "{% if project_license != 'custom' and not copyright_holder | trim %}Enter the copyright holder; it is never inferred from repository ownership.{% endif %}"

languages:
  type: str
  help: Select each programming language used by the project; leave all unchecked for the CI/CD baseline only
  multiselect: true
  choices:
    Go: go
    Python: python
    Rust: rust
    TypeScript: typescript
  default: [python]

governance_mode:
  type: str
  help: Manage supported GitHub settings, or only report the desired state
  choices:
    Apply supported repository policies: managed
    Observe and report only: observe
  default: managed

lifecycle:
  type: str
  help: Select the GitHub work-item automation this repository needs
  multiselect: true
  choices:
    Issue triage and standalone approval refresh: issues
    Milestone reconciliation and work-item closure: milestones
  default: [issues, milestones]

verification_mode:
  type: str
  help: Use self-attested local checks by default, or trusted GitHub-hosted verification when available
  choices:
    Use local verification with audited admin merge: local
    Require trusted GitHub-hosted checks: hosted
  default: local

admin_bypass:
  type: str
  help: Allow an administrator to replace human approval; required checks and release evidence remain mandatory
  choices:
    Never bypass human approval: 'off'
    Allow only beta work: beta-only
    Allow beta and stable work: always
  default: always

copilot_review:
  type: str
  help: Allow a clean GitHub Copilot review of the exact head to satisfy review when the repository is entitled to it
  choices:
    Allow when available: allowed
    Do not use Copilot review: 'off'
  default: allowed

release_trigger:
  type: str
  help: Evaluate a CSARC-owned release on each main update or only when explicitly dispatched
  choices:
    Evaluate main updates: main
    Manual dispatch only: manual
  default: main

container:
  type: bool
  help: Add the Docker starter and its build scan
  default: false

package_name:
  type: str
  help: Python import package name
  default: "{{ project_slug | replace('-', '_') }}"
  when: "{{ 'python' in languages }}"
  validator: "{% if not package_name | regex_search('^[a-z_][a-z0-9_]*$') %}Use a lowercase Python identifier containing letters, numbers, or underscores.{% endif %}"

code_owner:
  type: str
  help: Optional GitHub user or team used by CODEOWNERS
  default: ""
  validator: "{% if code_owner and not code_owner | regex_search('^@(?:(?![A-Za-z0-9-]*--)[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)$') %}Use an @user or @organization/team value, or leave it empty.{% endif %}"

project_run_command:
  type: str
  help: Shortest command that successfully starts or invokes the product
  default: >-
    {% set commands = [] -%}
    {% if 'python' in languages %}{% set _ = commands.append("uv run python -c 'import " ~ package_name ~ "'") %}{% endif -%}
    {% if 'typescript' in languages %}{% set _ = commands.append('pnpm run build') %}{% endif -%}
    {% if 'rust' in languages %}{% set _ = commands.append('cargo test --locked') %}{% endif -%}
    {% if 'go' in languages %}{% set _ = commands.append('go build ./...') %}{% endif -%}
    {{ commands | join(' && ') if commands else './.csarc/scripts/verify' }}
  validator: "{% if not project_run_command | default('', true) | trim or project_run_command | trim | lower in ['todo', 'tbd', 'placeholder'] or '<' in project_run_command %}Enter a working product command without placeholder text.{% endif %}"

project_verification_hook:
  type: str
  help: Optional repository-relative executable run after the CSARC verification
  default: ""
  when: "{{ project_mode == 'existing' }}"
  validator: "{% set hook = project_verification_hook | default('', true) | trim %}{% if hook and (hook != project_verification_hook or hook.startswith('/') or '..' in hook.split('/') or not (hook | regex_search('^[A-Za-z0-9._/-]+$'))) %}Use a safe repository-relative executable path without spaces, shell syntax, or parent traversal.{% endif %}"

# K2 (#1080): optional organization/user ProjectV2 whose Roadmap dates
# `csarc issue create` and `csarc issue sync-project` maintain. It is never
# asked (no question-count change); set it once with --data. Empty disables
# every Project API call, and repository Projects stay disabled.
github_project_url:
  type: str
  help: Optional full organization or user GitHub Project (ProjectV2) URL for Roadmap dates
  default: ""
  when: false
  validator: "{% if github_project_url and not github_project_url | regex_search('^https://github\\.com/(orgs|users)/[A-Za-z0-9-]+/projects/[1-9][0-9]*$') %}Use https://github.com/orgs/<org>/projects/<n> or https://github.com/users/<user>/projects/<n>, or leave it empty.{% endif %}"

repository_url:
  type: str
  help: Canonical GitHub repository URL used by badges and package metadata
  default: ""
  validator: "{% if not repository_url | default('', true) | regex_search('^https://github\\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') %}Use https://github.com/owner/repository without a trailing slash or .git suffix.{% endif %}"

python_floor:
  type: str
  help: Oldest Python release the project supports; latest follows the reviewed latest stable release (3.14)
  choices:
    Latest stable only (Python 3.14): latest
    Python 3.12 or later: "3.12"
    Python 3.13 or later: "3.13"
    Python 3.14 or later: "3.14"
  default: latest
  when: "{{ 'python' in languages }}"

coverage_mode:
  type: str
  help: New projects use global coverage; existing projects may measure changed lines first
  choices:
    - global
    - diff
  default: global

coverage_threshold:
  type: int
  help: Minimum percentage required by the selected coverage mode
  default: 80
  validator: "{% if coverage_threshold < 1 or coverage_threshold > 100 %}Use an integer from 1 to 100.{% endif %}"

scheduled_checks:
  type: str
  help: Scheduled checks to run; disable governance-drift only when another approved control owns drift monitoring
  multiselect: true
  choices:
    Governance drift check: governance-drift
    Weekly template update notification: template-update
  default: [governance-drift]

project_visibility:
  type: str
  help: GitHub repository visibility this project will use
  choices:
    Public: public
    Private: private
    Internal (GitHub Enterprise Cloud only): internal
  default: private

# Issue #1084: a public repository must name a maintainer-approved private
# reporting channel outside GitHub (an email address, a mailto: link, or a
# non-GitHub https:// URL); GitHub Issues, Discussions, and GitHub private
# vulnerability reporting are never assumed. The public default is empty so
# an unanswered or dropped legacy answer fails closed in
# template/.github/SECURITY.md.jinja. Private and internal repositories keep
# the Issue instructions because those Issues are not world-readable.
security_reporting_channel:
  type: str
  help: Maintainer-approved vulnerability reporting channel; a public repository needs a private channel outside GitHub (email address, mailto link, or non-GitHub https URL)
  default: "{{ '' if project_visibility == 'public' else 'Open a GitHub Issue at ' ~ repository_url ~ '/issues/new; maintainers receive notifications for new Issues.' }}"
  validator: '{% set channel = security_reporting_channel | default("", true) | trim %}{% if not channel or channel | lower in ["todo", "tbd", "placeholder"] or "<" in channel %}Enter the approved reporting channel without placeholder text; do not invent an email address or SLA.{% elif project_visibility == "public" and (channel | regex_search("(?i)^https?://(?:[^/?#]*[.@])?github[.]com(?:[:/?#]|$)") or not (channel | regex_search("^(?:mailto:)?[A-Za-z0-9._%+-]+@[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:[.][A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)*[.][A-Za-z]{2,}$") or channel | regex_search("^https://[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:[.][A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)*[.][A-Za-z]{2,}(?::[0-9]{1,5})?(?:[/?#][^ <>]*)?$"))) %}A public repository needs one maintainer-approved private reporting channel outside GitHub: an email address, a mailto: link, or a non-GitHub https:// URL. GitHub Issues, Discussions, and other github.com routes are public or unverified and are rejected.{% endif %}'

enable_codeql:
  type: bool
  help: Enable CodeQL SAST on public repositories or private/internal repositories licensed for GitHub Code Security
  default: "{{ project_visibility == 'public' and ('go' in languages or 'python' in languages or 'typescript' in languages) }}"
  when: "{{ 'go' in languages or 'python' in languages or 'typescript' in languages }}"

project_maturity:
  type: str
  help: Project maturity is independent from beta/stable release channels and changes only by an explicit stable release
  choices:
    Early (stable versions remain 0.y.z): early
    Formal (stable versions are 1.0.0 or later): formal
  default: early
