            Path("tests/test_dependency_security.py"): {
                "ec455cce680d8906c15e880037a564b8b32785456971caac7932420350ff50c4",
                "d104a1a087f963f3edcc02b00d28ddb41229b0ec2891e7e79588014b5bf3a247",
