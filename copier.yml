_min_copier_version: "9.17.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .csarc/config.yml
_exclude:
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - "{% if project_mode == 'existing' %}/README.md{% else %}__keep_project_readme__{% endif %}"
  - "{% if project_mode == 'existing' %}/CHANGELOG.md{% else %}__keep_project_changelog__{% endif %}"
  - "{% if enable_precommit %}__keep_precommit__{% else %}.pre-commit-config.yaml{% endif %}"
  - "{% if enable_template_update_notifications %}__keep_template_update_workflow__{% else %}.github/workflows/template-update.yml{% endif %}"
  - "{% if enable_template_update_notifications %}__keep_template_update_script__{% else %}scripts/check-template-update{% endif %}"
  - "{% if enable_governance_drift_check %}__keep_governance_drift_workflow__{% else %}.github/workflows/governance-drift.yml{% endif %}"
  - "{% if enable_governance_drift_check %}__keep_governance_drift_script__{% else %}scripts/check-governance-drift{% endif %}"
  - "{% if project_mode == 'new' %}__keep_release_workflow__{% else %}.github/workflows/release.yml{% endif %}"
  - "{% if enable_codeql | default(false) %}__keep_codeql__{% else %}.github/workflows/codeql.yml{% endif %}"
  - "{% if 'python' in languages %}__keep_python_version__{% else %}.python-version{% endif %}"
  - "{% if 'python' in languages %}__keep_python_project__{% else %}pyproject.toml{% endif %}"
  - "{% if 'python' in languages %}__keep_python_source__{% else %}/src/{{package_name}}{% endif %}"
  - "{% if 'python' in languages %}__keep_python_tests__{% else %}/tests{% endif %}"
  - "{% if 'typescript' in languages %}__keep_node_version__{% else %}.node-version{% endif %}"
  - "{% if 'typescript' in languages %}__keep_node_package__{% else %}package.json{% endif %}"
  - "{% if 'typescript' in languages %}__keep_pnpm_workspace__{% else %}pnpm-workspace.yaml{% endif %}"
  - "{% if 'typescript' in languages %}__keep_biome__{% else %}biome.json{% endif %}"
  - "{% if 'typescript' in languages %}__keep_tsconfig__{% else %}tsconfig.json{% endif %}"
  - "{% if 'typescript' in languages %}__keep_tsconfig_build__{% else %}tsconfig.build.json{% endif %}"
  - "{% if 'typescript' in languages %}__keep_vitest__{% else %}vitest.config.ts{% endif %}"
  - "{% if 'typescript' in languages %}__keep_typescript_source__{% else %}/typescript{% endif %}"
  - "{% if 'rust' in languages %}__keep_rust_toolchain__{% else %}rust-toolchain.toml{% endif %}"
  - "{% if 'rust' in languages %}__keep_rust_manifest__{% else %}Cargo.toml{% endif %}"
  - "{% if 'rust' in languages %}__keep_rust_source__{% else %}/src/lib.rs{% endif %}"
  - "{% if not languages %}__keep_ci_version__{% else %}version.txt{% endif %}"
_skip_if_exists:
  - "src/**/*.py"
  - "tests/**/*.py"
  - "typescript/src/**/*.ts"
  - "typescript/tests/**/*.ts"
  - "docs/specs/**/*.md"
  - "docs/adr/**/*.md"
  - "docs/site-content.js"
  - "docs/site-theme.css"
  - "{% if project_mode == 'existing' %}/README.md{% else %}__overwrite_readme__{% endif %}"
  - "{% if project_mode == 'existing' %}/SECURITY.md{% else %}__overwrite_security_policy__{% endif %}"
  - "{% if project_mode == 'existing' %}pyproject.toml{% else %}__overwrite_python_manifest__{% endif %}"
  - "{% if project_mode == 'existing' %}package.json{% else %}__overwrite_node_manifest__{% endif %}"
  - "{% if project_mode == 'existing' %}Cargo.toml{% else %}__overwrite_rust_manifest__{% endif %}"
_tasks:
  - command: "uv lock --python {{ '3.14' if (python_support_mode | default('latest')) == 'latest' else (python_min_version | default('3.12')) }}"
    when: "{{ _copier_operation == 'copy' and project_mode == 'new' and 'python' in languages }}"
  - command: "pnpm install --lockfile-only --ignore-scripts"
    when: "{{ _copier_operation == 'copy' and project_mode == 'new' and 'typescript' in languages }}"
  - command: "cargo generate-lockfile"
    when: "{{ _copier_operation == 'copy' and project_mode == 'new' and 'rust' in languages }}"
  - command: "uv run --no-project python scripts/render_site.py"
_migrations:
  - command:
      - python3
      - -c
      - |-
        import hashlib
        import re
        from pathlib import Path

        path = Path(".copier-answers.yml")
        source = path.read_text(encoding="utf-8")
        migrated, count = re.subn(
            r"(?m)^(branch_strategy:\s*)(?:dev|'dev'|\"dev\")(\s*(?:#.*)?)$",
            r"\1main\2",
            source,
        )
        if count > 1:
            raise SystemExit("Found duplicate legacy branch_strategy answers")
        if count == 1:
            path.write_text(migrated, encoding="utf-8")

        legacy_template_tests = {
            Path("tests/test_delivery_sync.py"):
                "50fc918666723264272a9268ebaf5c0b120341e588e1e1f5841686f8448abc99",
            Path("tests/test_promotion_gate.py"):
                "c09481ea74c15f679e8eea5c39516a1a77e7d941b91bc716fb225a1ac2b3b0ad",
            Path("tests/test_release_policy.py"):
                "89d35a7eafdf5ec17f607e59ea192b2676989bf2e0ec94dd76961baacdd41bf5",
        }
        for legacy_test, legacy_sha256 in legacy_template_tests.items():
            if (
                legacy_test.is_file()
                and not legacy_test.is_symlink()
                and hashlib.sha256(legacy_test.read_bytes()).hexdigest()
                == legacy_sha256
            ):
                legacy_test.unlink()
    when: "{{ _stage == 'before' }}"
  - command:
      - "{{ _copier_python }}"
      - "-c"
      - "import hashlib, pathlib, shutil, sys; target = pathlib.Path('tests/test_spec_to_issue.py'); expected = 'cb936cab1f2e239b28c1f9d59edb714a7c8758633f95cbb98989571fa3b2a5fa'; current = hashlib.sha256(target.read_bytes()).hexdigest() if target.is_file() else ''; shutil.copy2(sys.argv[1], target) if current == expected else None"
      - "{{ _copier_conf.src_path }}/template/tests/test_spec_to_issue.py"
    when: "{{ _stage == 'after' }}"
  - command: "uv run --no-project python scripts/render_site.py"
    when: "{{ _stage == 'after' }}"
_message_after_copy: |
  {% if project_mode == 'existing' %}Existing product files and its release workflow were preserved. Review .csarc/config.yml, merge the required tool settings described in README.md, run ./scripts/verify, then link the pull request to its Issue.{% else %}Project created with the CSARC release workflow. Confirm .csarc/config.yml, run ./scripts/verify, then open an Issue and its numbered branch before the first pull request.{% endif %} GitHub template creation and Copier do not copy repository settings. Administrators may run ./scripts/apply-repository-settings.sh plan, apply, and check to enable the required controls, including permission for GitHub Actions to open the reviewed version pull request. See README.md for the capability and visibility matrices.

project_mode:
  type: str
  help: Create a new repository or add the public baseline to an existing codebase
  choices:
    New repository: new
    Adopt an existing repository: existing
  default: new

release_ownership:
  type: str
  help: Single owner allowed to create release tags, Releases, and assets
  choices:
    CSARC release workflow: csarc-owned
    Existing product release workflow: product-owned
    Verification without release writes: verification-only
  default: "{{ 'csarc-owned' if project_mode == 'new' else 'verification-only' }}"
  when: false

release_workflow:
  type: str
  help: Explicit repository-relative workflow selected by the release owner
  default: "{{ '.github/workflows/release.yml' if release_ownership == 'csarc-owned' else '' }}"
  when: false

release_required_inputs:
  type: yaml
  help: Required workflow_dispatch inputs declared by the selected workflow
  default: []
  when: false

release_ownership_reason:
  type: str
  help: Auditable reason for the selected release ownership
  default: "{{ 'CSARC owns the only version and GitHub Release workflow.' if release_ownership == 'csarc-owned' else 'No release workflow is selected; CSARC verifies only.' }}"
  when: false

release_settings_owner:
  type: str
  help: Owner responsible for release-related repository settings
  choices:
    CSARC bootstrap administrator: csarc-admin
    Product administrator: product-admin
    No release settings owner: none
  default: "{{ 'csarc-admin' if release_ownership == 'csarc-owned' else 'product-admin' if release_ownership == 'product-owned' else 'none' }}"
  when: false

release_immutable_releases:
  type: str
  help: Whether immutable GitHub Releases are required by this ownership mode
  choices:
    Required during CSARC bootstrap: required
    Defined by the product release contract: product-defined
    Not required for verification-only: not-required
  default: "{{ 'required' if release_ownership == 'csarc-owned' else 'product-defined' if release_ownership == 'product-owned' else 'not-required' }}"
  when: false

project_name:
  type: str
  help: Human-readable project name
  default: CSARC Project
  validator: "{% if not project_name | trim %}Enter a non-empty project name.{% endif %}"

project_slug:
  type: str
  help: Repository and distribution name
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  validator: "{% if not project_slug | regex_search('^[a-z0-9](?:[a-z0-9._-]{0,212}[a-z0-9])?$') %}Use 1-214 lowercase letters, numbers, dots, underscores, or hyphens; start and end with a letter or number.{% endif %}"

project_description:
  type: str
  help: Organization-approved one-sentence purpose for README and package metadata
  default: "Source code and delivery automation for {{ project_name }}."
  validator: "{% if not project_description | default('', true) | trim or project_description | trim | lower in ['a cyber-arch project', 'todo', 'tbd', 'placeholder'] or '<' in project_description %}Enter the approved project purpose without placeholder text.{% endif %}"

language:
  type: str
  help: Deprecated compatibility value for repositories created before language modules became multi-select
  default: python
  when: false

languages:
  type: str
  help: Select each programming language used by the project; leave all unchecked for the CI/CD baseline only
  multiselect: true
  choices:
    Python: python
    Rust: rust
    TypeScript: typescript
  default: "{{ [] if language == 'ci' else language.split('-') }}"

container_mode:
  type: str
  help: Verify an existing container image in CI, and optionally publish it to GHCR from verified releases
  choices:
    Disabled: none
    Build, smoke-test, and scan only: verify
    Build, verify, and publish to GHCR: ghcr
  default: none
  when: "{{ project_mode == 'existing' }}"

containerfile_path:
  type: str
  help: Repository-relative Dockerfile or Containerfile used with the repository root as build context
  default: Dockerfile
  when: "{{ (container_mode | default('none')) != 'none' }}"
  validator: "{% if containerfile_path.startswith('/') or '..' in containerfile_path.split('/') or not (containerfile_path | regex_search('^[A-Za-z0-9._/-]+$')) %}Use a safe repository-relative path without spaces or parent traversal.{% endif %}"

container_smoke_command:
  type: str
  help: One-line shell command that smoke-tests the built image through the IMAGE environment variable
  default: ""
  when: "{{ (container_mode | default('none')) != 'none' }}"
  validator: "{% if not container_smoke_command.strip() or '$IMAGE' not in container_smoke_command or '\n' in container_smoke_command %}Use one non-empty line that references $IMAGE, for example docker run --rm \"$IMAGE\" --help.{% endif %}"

branch_strategy:
  type: str
  help: Choose how issue branches are integrated before promotion to main
  choices:
    Main with short-lived Milestone delivery branches: delivery
    Short branch → pull request → main: main
  default: delivery

package_name:
  type: str
  help: Python import package name
  default: "{{ project_slug | replace('-', '_') }}"
  when: "{{ 'python' in languages }}"
  validator: "{% if not package_name | regex_search('^[a-z_][a-z0-9_]*$') %}Use a lowercase Python identifier containing letters, numbers, or underscores.{% endif %}"

code_owner:
  type: str
  help: Existing GitHub team used by CODEOWNERS, for example @Innoguard-Cyber-Arch/platform
  default: "@Innoguard-Cyber-Arch/arch"
  validator: "{% if not code_owner.startswith('@Innoguard-Cyber-Arch/') %}Use an existing @Innoguard-Cyber-Arch/<team> owner.{% endif %}"

project_run_command:
  type: str
  help: Shortest command that successfully starts or invokes the product
  default: "{% if languages %}{% if 'python' in languages %}uv run python -c 'import {{ package_name }}'{% endif %}{% if 'python' in languages and ('typescript' in languages or 'rust' in languages) %} && {% endif %}{% if 'typescript' in languages %}pnpm run build{% endif %}{% if 'typescript' in languages and 'rust' in languages %} && {% endif %}{% if 'rust' in languages %}cargo test --locked{% endif %}{% else %}./scripts/verify{% endif %}"
  validator: "{% if not project_run_command | default('', true) | trim or project_run_command | trim | lower in ['todo', 'tbd', 'placeholder'] or '<' in project_run_command %}Enter a working product command without placeholder text.{% endif %}"

project_verification_hook:
  type: str
  help: Optional repository-relative executable run after the CSARC verification
  default: ""
  when: "{{ project_mode == 'existing' }}"
  validator: "{% set hook = project_verification_hook | default('', true) | trim %}{% if hook and (hook != project_verification_hook or hook.startswith('/') or '..' in hook.split('/') or not (hook | regex_search('^[A-Za-z0-9._/-]+$'))) %}Use a safe repository-relative executable path without spaces, shell syntax, or parent traversal.{% endif %}"

repository_url:
  type: str
  help: Canonical GitHub repository URL used by badges and package metadata
  default: "https://github.com/{{ code_owner.split('/')[0] | replace('@', '') }}/{{ project_slug }}"
  validator: "{% if not repository_url | default('', true) | regex_search('^https://github\\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') %}Use https://github.com/owner/repository without a trailing slash or .git suffix.{% endif %}"

security_reporting_channel:
  type: str
  help: Organization-approved vulnerability reporting instructions
  default: "Open a GitHub Issue at {{ repository_url }}/issues/new; maintainers receive notifications for new Issues."
  validator: "{% if not security_reporting_channel | default('', true) | trim or security_reporting_channel | trim | lower in ['todo', 'tbd', 'placeholder'] or '<' in security_reporting_channel %}Enter the approved reporting channel without placeholder text; do not invent an email address or SLA.{% endif %}"

reviewers:
  type: str
  help: Comma-separated GitHub usernames eligible for automatic pull request review
  default: "@jachline28"
  validator: "{% if not reviewers | regex_search('^@[A-Za-z0-9][A-Za-z0-9-]{0,38}(?:\\s*,\\s*@[A-Za-z0-9][A-Za-z0-9-]{0,38})*$') %}Use one or more @username values separated by commas.{% endif %}"

python_support_mode:
  type: str
  help: Use the reviewed latest stable Python release, or declare an older minimum supported release
  choices:
    Latest stable only (Python 3.14): latest
    Declare a minimum supported version: minimum
  default: latest
  when: "{{ 'python' in languages }}"

python_min_version:
  type: str
  help: Oldest Python feature release that this project promises to support
  choices:
    - "3.12"
    - "3.13"
    - "3.14"
  default: "3.12"
  when: "{{ 'python' in languages and python_support_mode == 'minimum' }}"

coverage_mode:
  type: str
  help: New projects use global coverage; existing projects may measure changed lines first
  choices:
    - global
    - diff
  default: global

coverage_threshold:
  type: int
  help: Minimum percentage required by the selected coverage mode
  default: 80
  validator: "{% if coverage_threshold < 1 or coverage_threshold > 100 %}Use an integer from 1 to 100.{% endif %}"

enable_precommit:
  type: bool
  help: Add optional local pre-commit hooks; CI remains authoritative
  default: false

enable_template_update_notifications:
  type: bool
  help: Check weekly for a newer Copier template release and maintain one notification Issue
  default: false

project_visibility:
  type: str
  help: GitHub repository visibility this project will use
  choices:
    Public: public
    Private: private
    Internal (GitHub Enterprise Cloud only): internal
  default: private

enable_codeql:
  type: bool
  help: Enable CodeQL SAST on public repositories or private/internal repositories licensed for GitHub Code Security
  default: "{{ project_visibility == 'public' and ('python' in languages or 'typescript' in languages) }}"
  when: "{{ 'python' in languages or 'typescript' in languages }}"

enable_governance_drift_check:
  type: bool
  help: Check daily for repository governance drift (for example, branch protection disabled between CI runs) and maintain one tracking Issue
  default: false

enable_release_attestations:
  type: bool
  help: Sign release provenance and SBOM attestations on supported GitHub plans; public projects default on, private/internal stay explicit opt-in
  default: "{{ project_visibility == 'public' }}"
  when: "{{ languages }}"

enable_pypi_publishing:
  type: bool
  help: Publish Python distributions through PyPI Trusted Publishing
  default: false
  when: "{{ 'python' in languages }}"

pypi_environment:
  type: str
  help: Protected GitHub environment configured in the PyPI trusted publisher
  default: pypi
  when: "{{ enable_pypi_publishing }}"
  validator: "{% if not pypi_environment.strip() %}Use a non-empty GitHub environment name.{% endif %}"

enable_npm_publishing:
  type: bool
  help: Publish the npm tarball through npm Trusted Publishing
  default: false
  when: "{{ 'typescript' in languages }}"

npm_environment:
  type: str
  help: Protected GitHub environment configured in the npm trusted publisher
  default: npm
  when: "{{ enable_npm_publishing }}"
  validator: "{% if not npm_environment.strip() %}Use a non-empty GitHub environment name.{% endif %}"

use_reusable_workflow:
  type: bool
  help: Call the reusable multi-language workflow from this repository
  default: false

workflow_ref:
  type: str
  help: Full commit SHA for the reusable workflow
  default: ""
  when: "{{ use_reusable_workflow }}"
  validator: "{% if not workflow_ref | regex_search('^[0-9a-fA-F]{40}$') %}Use a full 40-character hexadecimal commit SHA.{% endif %}"
