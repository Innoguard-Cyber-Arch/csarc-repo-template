name: 開發工作
description: 英文標題摘要重點，內文用簡短中文定義一個可驗證改動
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: >-
        **標題規則：**使用 12–80 個英文 ASCII 字元及至少三個詞，直接描述成果；
        不加 `[Bug]` 或 `bug:` 前綴，不以句點結尾。例如：`Add dependency policy checks`。
  - type: dropdown
    id: kind
    attributes:
      label: 類型
      description: 只選最符合這張 Issue 的一種。
      options:
        - bug
        - enhancement
        - documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 問題
      description: 一兩句話說明現況與原因。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完成條件
      description: 完成後可觀察到的結果；超出範圍另開 Issue。
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: supplement
    attributes:
      label: 補充
      description: 選填：驗證方式、風險，或導入方自訂的必填項目。
    validations:
      required: false
