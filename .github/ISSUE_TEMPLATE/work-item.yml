name: 開發工作
description: 英文標題摘要重點，內文用簡短中文定義一個可驗證改動
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: >-
        **標題規則：**使用 12–80 個英文 ASCII 字元及至少三個詞，直接描述成果；
        不加 `[Bug]` 或 `bug:` 前綴，不以句點結尾。例如：`Add dependency policy checks`。
        建立前先依 AGENTS.md 搜尋相關 open／closed Issues；在「補充」列出沿用、
        取代或駁回的既有決策與理由，若沒有候選則記錄搜尋範圍。Feature 是 SDD
        parent；可獨立交付的 Task／Bug 設為 subissue。只有真實先後限制才設 blocked by；
        Feature 內發現的 Bug 必須掛 parent，獨立 Bug 則在補充說明為何沒有 parent。
  - type: dropdown
    id: kind
    attributes:
      label: 類型
      description: Feature=成果 parent；Task/Bug=可獨立交付 subissue；documentation/duplicate 保留特殊用途。
      options:
        - feature
        - task
        - bug
        - documentation
        - duplicate
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 問題
      description: 一兩句話說明現況與原因。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完成條件
      description: >-
        完成後可觀察到的結果；超出範圍另開 Issue。Promotion Issue 只列合併前可驗證
        的 checkbox；合併後關閉與清理步驟寫在補充，不列為 acceptance checkbox。
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: supplement
    attributes:
      label: 補充
      description: 選填：parent／dependency 理由、相關決策與沿用／取代理由、驗證方式或風險。
    validations:
      required: false
