name: Feature｜共同成果
description: 定義需要多張可獨立交付工作才能完成的共同成果
title: ""
# Portable fallback; lifecycle removes it when native Issue Types work.
labels: ["enhancement"]
type: "Feature"
body:
  - type: markdown
    attributes:
      value: >-
        **標題規則：**使用 12–80 個英文 ASCII 字元及至少三個詞，直接描述成果；
        不加 `[Feature]` 或 `feature:` 前綴，不以句點結尾。例如：`Add dependency policy checks`。
        建立前先依 AGENTS.md 搜尋相關 open／closed Issues，並在「補充」記錄沿用、
        取代或駁回的既有決策。Feature 描述一項新能力；只有無法以單一完成條件收尾時，
        才另開 Task／Bug Sub-issue。UI 建立者請把自己設為 Assignee；agent／CLI 建立時
        使用 `--assignee @me`。若研究或 Feature 後來擴展為有期限的 Milestone，
        這張 Issue 直接掛入成為主 Issue，不另設 Feature parent。若這張 Issue 沒有掛 Milestone（standalone 或
        hotfix）固定走 stable；掛在 Milestone 的工作固定走 beta。是否允許 admin 以
        `Admin-approve: <理由>` 自核，由 repository 的 `admin_bypass` 設定決定。
  - type: textarea
    id: problem
    attributes:
      label: 問題
      description: 一兩句話說明要共同解決的問題與原因。
    validations:
      required: true
  - type: dropdown
    id: release_level
    attributes:
      label: Release level / 發布層級
      description: Milestone 內工作選 beta；standalone／hotfix 選 stable。early／formal 是專案成熟度，不在這裡選。
      options: [beta, stable]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完成條件
      description: 共同成果可觀察的完成條件；不要在 parent 重複 Sub-issue 的執行清單。
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: supplement
    attributes:
      label: 補充
      description: >-
        Sub-issue 分工、相關決策、驗證方式或風險；下方「風險與控制」區塊必填（SPEC-010）：每個風險一列並至少一個控制，Owner 是 Issue assignee；只改一般文件時改用 R0（不得涵蓋 AGENTS.md、SECURITY.md 或 CI policy）。PR 離開 Draft 前，在 PR 的「Requirement evidence」把每個 AC 與風險對應到 exact-head 證據。
      value: |
        #### 風險與控制

        | ID | 類別 | 等級 | 風險 | 控制 | 預計證據 | Owner |
        | --- | --- | --- | --- | --- | --- | --- |
        | R1 | TODO | TODO | TODO | TODO | TODO | TODO |
    validations:
      required: false
