name: Feature｜共同成果
description: 定義需要多張可獨立交付工作才能完成的共同成果
title: ""
labels: ["enhancement"]
type: "Feature"
body:
  - type: markdown
    attributes:
      value: >-
        **標題規則：**使用 12–80 個英文 ASCII 字元及至少三個詞，直接描述成果；
        不加 `[Feature]` 或 `feature:` 前綴，不以句點結尾。例如：`Add dependency policy checks`。
        建立前先依 AGENTS.md 搜尋相關 open／closed Issues，並在「補充」記錄沿用、
        取代或駁回的既有決策。Feature 是尚未完整達成的 parent；可獨立交付的工作
        另開 Task／Bug Sub-issue。UI 建立者請把自己設為 Assignee；agent／CLI 建立時
        明確使用 `--assignee @me`。
  - type: textarea
    id: problem
    attributes:
      label: 問題
      description: 一兩句話說明要共同解決的問題與原因。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完成條件
      description: 共同成果可觀察的完成條件；不要在 parent 重複 Sub-issue 的執行清單。
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: supplement
    attributes:
      label: 補充
      description: 選填：Sub-issue 分工、相關決策、驗證方式或風險。
    validations:
      required: false
