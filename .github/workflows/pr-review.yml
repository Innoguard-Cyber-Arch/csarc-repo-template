name: PR review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]
  merge_group:
    types: [checks_requested]

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (
        (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, 'PR lifecycle merge authorization')) ||
        (github.event_name != 'issue_comment' &&
        github.event_name != 'merge_group' &&
        github.event.pull_request.draft == false)
      ) && format('publish-{0}', github.event.pull_request.number || github.event.issue.number) ||
      format('run-{0}', github.run_id)
    }}
  cancel-in-progress: false

permissions: {}

jobs:
  merge-group-review:
    name: review
    if: ${{ github.event_name == 'merge_group' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Accept the queued pull request
        run: echo "::notice::The review check passed on the pull request head before it entered the merge queue."
  publish:
    name: publish review decision
    if: >-
      ${{
        (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, 'PR lifecycle merge authorization')) ||
        (github.event_name != 'issue_comment' &&
        github.event_name != 'merge_group' &&
        github.event.pull_request.draft == false)
      }}
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the pull request and trusted publisher commit
        id: pr
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            number="$EVENT_ISSUE_NUMBER"
            base_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq .base.sha)"
            head_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq .head.ref)"
          else
            number="$EVENT_PR_NUMBER"
            base_sha="$EVENT_BASE_SHA"
            head_ref="$EVENT_HEAD_REF"
          fi
          publisher_sha="$base_sha"
          if [[ "$head_ref" == sync/main-to-* ]]; then
            default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
            publisher_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$default_branch" --jq .object.sha)"
          fi
          echo "number=$number" >>"$GITHUB_OUTPUT"
          echo "publisher_sha=$publisher_sha" >>"$GITHUB_OUTPUT"
      - name: Check out the trusted review publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.pr.outputs.publisher_sha }}
      - name: Publish the exact-head review decision
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if [[ -f scripts/review_gate.py ]]; then
            python3 scripts/review_gate.py publish \
              --repo "$GITHUB_REPOSITORY" \
              --pr "$PR_NUMBER" \
              --details-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --run-id "$GITHUB_RUN_ID"
          else
            echo "::notice::The review gate starts after the rollout PR reaches its base branch."
          fi
