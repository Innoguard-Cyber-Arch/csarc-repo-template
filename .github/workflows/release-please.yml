name: Release please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  source:
    name: promotion source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.boundary.outputs.eligible }}
      intent: ${{ steps.boundary.outputs.intent }}
      reason: ${{ steps.boundary.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an eligible main source
        id: boundary
        env:
          CANONICAL_REPOSITORY: Innoguard-Cyber-Arch/csarc-repo-template
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pull_requests="$(
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=100"
          )"
          pull_request_count="$(
            jq --arg sha "$GITHUB_SHA" \
              '[.[][] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | length' \
              <<<"$pull_requests"
          )"
          if [[ "$pull_request_count" != "1" ]]; then
            echo "Main commit must have exactly one reviewed pull request with the same merge SHA; found $pull_request_count." >&2
            exit 1
          fi
          pull_request="$(
            jq -c --arg sha "$GITHUB_SHA" \
              '[.[][] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)][0]' \
              <<<"$pull_requests"
          )"
          head_ref="$(jq -r .head.ref <<<"$pull_request")"
          pr_number="$(jq -r .number <<<"$pull_request")"
          pr_title="$(jq -r .title <<<"$pull_request")"
          labels="$(jq -r '[.labels[].name] | join(",")' <<<"$pull_request")"
          if [[ "$head_ref" == release-please--* ]]; then
            base_sha="$(jq -r '.base.sha // empty' <<<"$pull_request")"
            head_sha="$(jq -r '.head.sha // empty' <<<"$pull_request")"
            [[ "$base_sha" =~ ^[0-9a-f]{40}$ && "$base_sha" != "$GITHUB_SHA" ]] \
              && git merge-base --is-ancestor "$base_sha" "$GITHUB_SHA" || {
              echo "Release follow-up base SHA is missing or is not an ancestor of main." >&2
              exit 1
            }
            expected_file_count="$(
              gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq .changed_files
            )"
            [[ "$expected_file_count" =~ ^[0-9]+$ ]] || {
              echo "Release follow-up changed-file count is unavailable." >&2
              exit 1
            }
            files_json="$RUNNER_TEMP/release-follow-up-files.json"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/pulls/$pr_number/files?per_page=100" \
              > "$files_json"
            actual_file_count="$(jq '[.[][]] | length' "$files_json")"
            [[ "$actual_file_count" == "$expected_file_count" ]] || {
              echo "Release follow-up file list is incomplete: expected $expected_file_count, received $actual_file_count." >&2
              exit 1
            }
            jq -r '.[][] | .filename, (.previous_filename // empty)' \
              "$files_json" > "$RUNNER_TEMP/release-follow-up-files"
            commits_json="$RUNNER_TEMP/release-follow-up-commits.json"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/pulls/$pr_number/commits?per_page=100" \
              > "$commits_json"
            trusted_root="$(mktemp -d "$RUNNER_TEMP/release-follow-up-policy.XXXXXX")"
            git archive "$base_sha" | tar -x -C "$trusted_root"
            python3 "$trusted_root/scripts/release_policy.py" verify-release-follow-up \
              --repo "$GITHUB_REPOSITORY" \
              --head "$head_ref" \
              --head-repo "$(jq -r '.head.repo.full_name // empty' <<<"$pull_request")" \
              --head-sha "$head_sha" \
              --actor "$(jq -r '.user.login // empty' <<<"$pull_request")" \
              --changed-files "$RUNNER_TEMP/release-follow-up-files" \
              --commits "$commits_json" \
              --root "$trusted_root"
          fi
          branch_strategy=main
          if [[ "$GITHUB_REPOSITORY" == "$CANONICAL_REPOSITORY" ]]; then
            branch_strategy=delivery
          elif [[ -f .csarc/profile.json ]]; then
            branch_strategy="$(jq -r '.branch_strategy // "main"' .csarc/profile.json)"
          fi
          if [[ "$branch_strategy" == "main" ]]; then
            kind=main-strategy
            if [[ "$head_ref" == release-please--* ]]; then
              kind=main-release-follow-up
            fi
            python3 scripts/release_policy.py boundary \
              --kind "$kind" \
              --main-sha "$GITHUB_SHA" \
              --title "$pr_title" \
              --pull-request "$pr_number" \
              --output main-release-source.json \
              --github-output "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$head_ref" != release-please--* && "$head_ref" != "dev" && "$head_ref" != dev/* && ",$labels," != *,hotfix,* ]]; then
            python3 scripts/release_policy.py boundary \
              --kind unexpected \
              --main-sha "$GITHUB_SHA" \
              --pull-request "$pr_number" \
              --reason "Main commit lacks promotion or hotfix evidence" \
              --output main-release-source.json \
              --github-output "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p promotion-boundaries verified-boundaries
          collect_boundary() {
            local main_sha="$1"
            local index="$2"
            local boundary_pr pr_number head_sha boundary_head boundary_labels run_id candidate_sha proof
            boundary_pr="$(
              gh api "repos/$GITHUB_REPOSITORY/commits/$main_sha/pulls" \
                --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | last // empty'
            )"
            [[ -n "$boundary_pr" ]] || {
              echo "No reviewed pull request found for $main_sha."
              return 2
            }
            boundary_head="$(jq -r .head.ref <<<"$boundary_pr")"
            boundary_labels="$(jq -r '[.labels[].name] | join(",")' <<<"$boundary_pr")"
            if [[ "$boundary_head" != "dev" && "$boundary_head" != dev/* && ",$boundary_labels," != *,hotfix,* ]]; then
              echo "Commit $main_sha predates the promotion boundary."
              return 2
            fi
            pr_number="$(jq -r .number <<<"$boundary_pr")"
            head_sha="$(jq -r .head.sha <<<"$boundary_pr")"
            run_id="$(
              gh run list --workflow promotion.yml --event pull_request \
                --commit "$head_sha" --status success --limit 20 \
                --json databaseId --jq '.[0].databaseId // empty'
            )"
            [[ -n "$run_id" ]] || {
              echo "No successful promotion run found for PR #$pr_number." >&2
              return 1
            }
            proof="promotion-boundaries/$index"
            mkdir "$proof"
            gh run download "$run_id" \
              --name "promotion-evidence-${pr_number}-${head_sha}" \
              --dir "$proof"
            candidate_sha="$(jq -r .candidate_sha "$proof/promotion-evidence.json")"
            gh api "repos/$GITHUB_REPOSITORY/commits/$candidate_sha/check-runs" \
              > "$proof/candidate-checks.json"
            python3 scripts/promotion_gate.py verify-main \
              --repo "$GITHUB_REPOSITORY" \
              --pr-number "$pr_number" \
              --head-sha "$head_sha" \
              --main-sha "$main_sha" \
              --evidence "$proof/promotion-evidence.json" \
              --checks "$proof/candidate-checks.json" \
              --output "verified-boundaries/$index.json"
          }

          source_kind=promotion
          commits=("$GITHUB_SHA")
          if [[ "$head_ref" == release-please--* ]]; then
            source_kind=release-follow-up
            previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
            revision="$GITHUB_SHA^"
            allow_initial_baseline=true
            if [[ -n "$previous_tag" ]]; then
              revision="$previous_tag..$GITHUB_SHA^"
              allow_initial_baseline=false
            fi
            commits=()
            while IFS= read -r commit; do
              commits+=("$commit")
            done < <(git rev-list --first-parent --reverse "$revision")
          fi
          [[ "${#commits[@]}" -gt 0 ]] || {
            echo "Release follow-up contains no promotion boundaries." >&2
            exit 1
          }
          index=0
          seen_boundary=false
          for commit in "${commits[@]}"; do
            index=$((index + 1))
            if collect_boundary "$commit" "$index"; then
              seen_boundary=true
              continue
            else
              status=$?
            fi
            if [[ "${allow_initial_baseline:-false}" == true && "$seen_boundary" == false && "$status" -eq 2 ]]; then
              echo "Skipping pre-policy baseline commit $commit."
              continue
            fi
            exit "$status"
          done
          python3 scripts/release_policy.py aggregate-boundary \
            --evidence-dir verified-boundaries \
            --main-sha "$GITHUB_SHA" \
            --source-kind "$source_kind" \
            --output main-release-source.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish release source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-release-source-${{ github.run_id }}
          path: main-release-source.json
          if-no-files-found: error
          retention-days: 90
      - name: Summarize release boundary
        run: |
          {
            echo "### Release boundary"
            jq -r '"- Eligible: `\(.eligible)`", "- Intent: `\(.release.intent // "none")`", "- Reason: \(.reason)"' main-release-source.json
            jq -r '.boundaries[]? | "- `\(.delivery_branch)` via PR #\(.promotion_pr), main `\(.promotion_main_sha)`, canary `\(.canary.state)/\(.canary.result)`"' main-release-source.json
            jq -r '.boundaries[]?.included_issues[]? | "  - Issue #\(.number): \(.title)"' main-release-source.json
            jq -r '.release.included_pull_requests[]? | "  - PR #\(.number): \(.title) (`\(.intent)`)"' main-release-source.json
          } >> "$GITHUB_STEP_SUMMARY"

  governance:
    name: governance
    needs: source
    if: ${{ needs.source.outputs.eligible == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require protected default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/apply-repository-settings.sh check

  capabilities:
    name: release capabilities
    needs: [source, governance]
    if: ${{ needs.source.outputs.eligible == 'true' }}
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      reason: ${{ steps.detect.outputs.reason }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect current release capabilities
        id: detect
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_workflow=release.yml
          if [[ -f .github/workflows/release-template.yml ]]; then
            artifact_workflow=release-template.yml
          fi
          python3 scripts/release_policy.py detect \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --branch "$DEFAULT_BRANCH" \
            --workflow "$artifact_workflow" \
            --output release-capabilities.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish capability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-capabilities-${{ github.run_id }}
          path: release-capabilities.json
          if-no-files-found: error
          retention-days: 30
      - name: Summarize selected mode
        env:
          RELEASE_MODE: ${{ steps.detect.outputs.mode }}
          RELEASE_REASON: ${{ steps.detect.outputs.reason }}
        run: |
          echo "### Release mode: $RELEASE_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "$RELEASE_REASON" >> "$GITHUB_STEP_SUMMARY"

  release-pr:
    name: release pull request (human-only)
    needs: [source, capabilities]
    if: >-
      ${{ needs.capabilities.outputs.mode == 'release-pr' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    outputs:
      release_created: ${{ steps.guard.outputs.release_created }}
      tag_name: ${{ steps.guard.outputs.tag_name }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail closed before an opaque release pull request write
        id: guard
        run: |
          echo "release_created=false" >> "$GITHUB_OUTPUT"
          echo "tag_name=" >> "$GITHUB_OUTPUT"
          echo "::error::Private Free degraded mode: Release Please cannot atomically bind its pre-PR Draft, label, and branch writes to an exact lifecycle lease. Automated release PR creation and updates are disabled. A human maintainer must create or update the release PR; later PR metadata and state changes must use scripts/pr_lifecycle.py."
          exit 1

  dispatch-release-pr:
    name: dispatch release pull request artifacts
    needs: release-pr
    if: ${{ needs.release-pr.outputs.release_created == 'true' }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch the artifact workflow at the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-pr.outputs.tag_name }}
        run: |
          workflow=release.yml
          if [[ -f .github/workflows/release-template.yml ]]; then
            workflow=release-template.yml
          fi
          gh workflow run "$workflow" --ref "$RELEASE_TAG" \
            -f source_run_id="$GITHUB_RUN_ID"

  direct-release:
    name: direct release after main
    needs: [source, capabilities]
    if: >-
      ${{ needs.capabilities.outputs.mode == 'direct' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck policy and allocate from the current main head
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_workflow=release.yml
          if [[ -f .github/workflows/release-template.yml ]]; then
            artifact_workflow=release-template.yml
          fi
          python3 scripts/release_policy.py release \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --branch "$DEFAULT_BRANCH" \
            --workflow "$artifact_workflow" \
            --source-run-id "$GITHUB_RUN_ID" \
            --output release-capabilities-final.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish final release decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-decision-${{ github.run_id }}
          path: release-capabilities-final.json
          if-no-files-found: error
          retention-days: 30

  verification-only:
    name: verification only
    needs: [source, capabilities]
    if: >-
      ${{ always() && (needs.source.outputs.eligible != 'true' ||
      needs.capabilities.outputs.mode == 'verification-only' ||
      github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report unavailable release automation
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          RELEASE_REASON: ${{ needs.source.outputs.reason || needs.capabilities.outputs.reason || 'Release source validation failed' }}
        run: |
          if [[ "$IS_DEFAULT_BRANCH" != true ]]; then
            RELEASE_REASON="Non-default branch run is diagnostic-only; releases use $DEFAULT_BRANCH. $RELEASE_REASON"
          fi
          echo "::warning::$RELEASE_REASON"
          echo "### Verification only" >> "$GITHUB_STEP_SUMMARY"
          echo "$RELEASE_REASON" >> "$GITHUB_STEP_SUMMARY"
