name: Release please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require protected default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/apply-repository-settings.sh check

  release:
    name: release
    if: ${{ vars.CSARC_VERSION_BOT_CLIENT_ID != '' }}
    needs: governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create release bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CSARC_VERSION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CSARC_VERSION_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update the release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
