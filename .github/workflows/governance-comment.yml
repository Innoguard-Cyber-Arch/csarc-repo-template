name: Reviewer assignment

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  record:
    name: request reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Request coworker review
        if: ${{ !github.event.pull_request.draft }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mapfile -t configured_reviewers < <(awk '!/^#/ && NF {print $1}' .github/REVIEWERS)
          eligible_reviewers=()
          for account in "${configured_reviewers[@]}"; do
            if [[ ! "$account" =~ ^@([A-Za-z0-9][A-Za-z0-9-]{0,38})$ ]]; then
              echo "Invalid reviewer in .github/REVIEWERS: $account" >&2
              exit 1
            fi
            [[ "${BASH_REMATCH[1]}" == "$PR_AUTHOR" ]] || eligible_reviewers+=("${BASH_REMATCH[1]}")
          done
          if (( ${#eligible_reviewers[@]} == 0 )); then
            echo "No configured reviewer remains after excluding the pull request author." >&2
            exit 1
          fi
          reviewer="${eligible_reviewers[$((PR_NUMBER % ${#eligible_reviewers[@]}))]}"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/requested_reviewers" \
            -f "reviewers[]=$reviewer" >/dev/null
