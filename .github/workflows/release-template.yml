name: Release template

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-template-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a release tag as the artifact source
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Select a v* tag when dispatching this workflow." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require protected default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/apply-repository-settings.sh check

  verify:
    name: verify-template
    needs: governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.22.0"
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: ./scripts/verify-template.sh

  publish-pypi:
    name: publish CLI to PyPI
    if: ${{ vars.CSARC_ENABLE_PYPI_PUBLISHING == 'true' }}
    needs: publish
    environment: pypi
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Materialize the immutable tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          uv run --no-project python scripts/release_policy.py prepare
          --tag "$RELEASE_TAG"
      - run: uv build
      - name: Publish with trusted identity
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish:
    name: publish immutable release
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Materialize the immutable tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          uv run --no-project python scripts/release_policy.py prepare
          --tag "$RELEASE_TAG"
      - name: Build CLI and prepare release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          fi
          release_state="$(
            gh release view "$RELEASE_TAG" --json isDraft,isImmutable \
              --jq '[.isImmutable, .isDraft] | @tsv'
          )"
          if [[ "$release_state" == $'true\tfalse' ]]; then
            echo "Release is already published and immutable; keeping its assets unchanged."
            exit 0
          fi
          test "$release_state" = $'false\ttrue'
          commit_sha="$(git rev-parse HEAD)"
          test "$commit_sha" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          gh release view "$RELEASE_TAG" --json body --jq .body >release-body.md
          uv build
          uv run python scripts/render_release_prompt.py \
            --tag "$RELEASE_TAG" \
            --sha "$commit_sha" \
            --body-file release-body.md \
            --output-dir release-assets
          gh release upload "$RELEASE_TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            release-assets/release-prompt.txt \
            release-assets/csarc-release-provenance.json
          gh release edit "$RELEASE_TAG" \
            --notes-file release-assets/release-notes.md \
            --draft=false
      - name: Verify published release trust chain
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isImmutable,isDraft,isPrerelease --jq '[.isImmutable, .isDraft, .isPrerelease] | @tsv')" = $'true\tfalse\tfalse'
          for attempt in {1..24}; do
            if gh release verify "$RELEASE_TAG" -R "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
