name: Release template

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Release Please workflow run containing source evidence
        required: true
        type: string

concurrency:
  group: release-template-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  source:
    name: verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify the promotion boundary
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$SOURCE_RUN_ID" ]] || {
            echo "Release artifacts require a Release Please source run." >&2
            exit 1
          }
          source_run="$(gh run view "$SOURCE_RUN_ID" --json headSha,workflowName,status)"
          test "$(jq -r .workflowName <<<"$source_run")" = "Release please"
          test "$(jq -r .headSha <<<"$source_run")" = "$GITHUB_SHA"
          mkdir release-source
          gh run download "$SOURCE_RUN_ID" \
            --name "main-release-source-${SOURCE_RUN_ID}" \
            --dir release-source
          python3 scripts/release_policy.py verify-boundary \
            --evidence release-source/main-release-source.json \
            --sha "$GITHUB_SHA"
          mv release-source/main-release-source.json release-source/release-source.json
      - name: Preserve release-source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source
          path: release-source/release-source.json
          if-no-files-found: error
          retention-days: 90

  governance:
    name: governance
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a release tag as the artifact source
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Select a v* tag when dispatching this workflow." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require protected default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/apply-repository-settings.sh check

  publish-pypi:
    name: publish CLI to PyPI
    if: ${{ vars.CSARC_ENABLE_PYPI_PUBLISHING == 'true' }}
    needs: publish
    environment: pypi
    permissions:
      attestations: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify the published Python distributions
        id: verify_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isImmutable,isDraft,isPrerelease --jq '[.isImmutable, .isDraft, .isPrerelease] | @tsv')" = $'true\tfalse\tfalse'
          mkdir pypi-dist
          gh release download "$RELEASE_TAG" \
            --pattern '*.whl' \
            --pattern '*.tar.gz' \
            --pattern SHA256SUMS \
            --dir pypi-dist
          mv pypi-dist/SHA256SUMS SHA256SUMS
          (
            cd pypi-dist
            shasum -a 256 -c ../SHA256SUMS
          )
          mapfile -t packages < <(
            find pypi-dist -maxdepth 1 -type f \
              \( -name '*.whl' -o -name '*.tar.gz' \) | sort
          )
          [[ "${#packages[@]}" -eq 2 ]]
          verification_json="$RUNNER_TEMP/release-verification.json"
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --format json > "$verification_json"
          repository_id="$(
            gh api "repos/$GITHUB_REPOSITORY" --jq '.id'
          )"
          commit_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha'
          )"
          for package in "${packages[@]}"; do
            python3 scripts/verify_release_consumption.py \
              --verification-json "$verification_json" \
              --artifact "$package" \
              --repository "$GITHUB_REPOSITORY" \
              --repository-id "$repository_id" \
              --tag "$RELEASE_TAG" \
              --commit "$commit_sha"
          done
          version="${RELEASE_TAG#v}"
          metadata="$RUNNER_TEMP/pypi-release.json"
          status="$(curl -sS -o "$metadata" -w '%{http_code}' \
            "https://pypi.org/pypi/csarc-repo-cli/${version}/json")"
          metadata_args=()
          if [[ "$status" == 200 ]]; then
            metadata_args=(--metadata "$metadata")
          elif [[ "$status" != 404 ]]; then
            echo "PyPI metadata request failed with HTTP ${status}." >&2
            exit 1
          fi
          mv pypi-dist verified-dist
          python3 scripts/prepare_pypi_upload.py \
            --verified-dir verified-dist \
            --upload-dir pypi-dist \
            --github-output "$GITHUB_OUTPUT" \
            "${metadata_args[@]}"
      - name: Publish with trusted identity
        if: steps.verify_release.outputs.publish_required == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist/
          skip-existing: true

  publish:
    name: publish immutable release
    needs: governance
    permissions:
      attestations: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-source
          path: release-source
      - name: Verify the immutable tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          uv run --no-project python scripts/release_policy.py prepare
          --tag "$RELEASE_TAG"
      - name: Inspect the release state
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          fi
          release_state="$(
            gh release view "$RELEASE_TAG" --json isDraft,isImmutable \
              --jq '[.isImmutable, .isDraft] | @tsv'
          )"
          if [[ "$release_state" == $'true\tfalse' ]]; then
            echo "Release is already published and immutable; keeping its assets unchanged."
            echo "build_required=false" >> "$GITHUB_OUTPUT"
          elif [[ "$release_state" == $'false\ttrue' ]]; then
            echo "build_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release must be either a mutable draft or published and immutable." >&2
            exit 1
          fi
      - name: Build CLI and calculate checksums
        if: steps.release_state.outputs.build_required == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          test "$commit_sha" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          uv build
          (
            cd dist
            shasum -a 256 * | sort -k 2 > ../SHA256SUMS
          )
      - name: Extract release artifacts for SBOM analysis
        if: steps.release_state.outputs.build_required == 'true'
        run: |
          set -euo pipefail
          sbom_root="${RUNNER_TEMP}/sbom-root"
          mkdir -p "$sbom_root"
          index=0
          for archive in dist/*.whl dist/*.tar.gz; do
            [[ -f "$archive" ]] || continue
            index=$((index + 1))
            destination="$sbom_root/artifact-${index}"
            mkdir -p "$destination"
            case "$archive" in
              *.whl) unzip -q "$archive" -d "$destination" ;;
              *) tar -xzf "$archive" -C "$destination" ;;
            esac
          done
          [[ "$index" -eq 2 ]]
      - name: Generate CycloneDX SBOM
        if: steps.release_state.outputs.build_required == 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ runner.temp }}/sbom-root
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: Publish the verified artifact set
        if: steps.release_state.outputs.build_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          test -s SHA256SUMS
          test -s sbom.cdx.json
          (
            cd dist
            shasum -a 256 -c ../SHA256SUMS
          )
          gh release view "$RELEASE_TAG" --json body --jq .body >release-body.md
          uv run python scripts/render_release_prompt.py \
            --tag "$RELEASE_TAG" \
            --sha "$commit_sha" \
            --body-file release-body.md \
            --output-dir release-assets
          cp release-source/release-source.json release-assets/release-source.json
          gh release upload "$RELEASE_TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            SHA256SUMS \
            sbom.cdx.json \
            release-assets/release-prompt.txt \
            release-assets/csarc-release-provenance.json \
            release-assets/release-source.json \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --notes-file release-assets/release-notes.md \
            --draft=false
      - name: Verify published release trust chain
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isImmutable,isDraft,isPrerelease --jq '[.isImmutable, .isDraft, .isPrerelease] | @tsv')" = $'true\tfalse\tfalse'
          for attempt in {1..24}; do
            if gh release verify "$RELEASE_TAG" -R "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
