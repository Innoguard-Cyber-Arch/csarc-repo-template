name: Reusable repository CI

on:
  workflow_call:
    inputs:
      language-profile:
        type: string
        default: python
      python-version:
        type: string
        default: "3.14"
      additional-python-version:
        type: string
        default: ""
      node-version:
        type: string
        default: "24"

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: contains(inputs.language-profile, 'python')
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - if: contains(inputs.language-profile, 'typescript')
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.22.0"
          run_install: false
      - if: contains(inputs.language-profile, 'typescript')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - name: Verify declared language modules
        run: ./scripts/verify
        env:
          CSARC_PYTHON_VERSION: ${{ inputs.python-version }}
          UV_PROJECT_ENVIRONMENT: .venv-primary
      - if: contains(inputs.language-profile, 'python') && inputs.additional-python-version != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.additional-python-version }}
      - if: contains(inputs.language-profile, 'python') && inputs.additional-python-version != ''
        name: Verify additional Python version
        run: ./scripts/verify
        env:
          CSARC_PYTHON_VERSION: ${{ inputs.additional-python-version }}
          UV_PROJECT_ENVIRONMENT: .venv-additional
          CSARC_VERIFY_TYPESCRIPT: "false"
