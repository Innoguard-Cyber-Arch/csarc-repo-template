name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: validate and publish
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev/m') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release route
        id: route
        run: |
          if [[ "$GITHUB_REF_NAME" == main ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "required_tier=full" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == dev/m* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "required_tier=fast" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported release branch: $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Resolve included work and release level
        id: level
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_level.py release-batch \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --base-branch "$GITHUB_REF_NAME" \
            --markdown-output "$RUNNER_TEMP/release-levels.md" \
            --github-output "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/release-levels.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve the checkpoint role of the merged work
        id: checkpoint
        if: ${{ steps.route.outputs.channel == 'beta' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_level.py checkpoint-role \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --base-branch "$GITHUB_REF_NAME" \
            --github-output "$GITHUB_OUTPUT"
      - name: Resolve a squash-merged promotion source
        id: source
        if: ${{ steps.route.outputs.channel == 'stable' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A squash merge cannot reach the delivery-branch beta tags, so a
          # promotion is planned from its exact reviewed bridge head (#1027).
          sources="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq ".[] | select(.merged_at != null and .base.ref == \"main\" and .merge_commit_sha == \"$GITHUB_SHA\" and (.head.ref | startswith(\"promote/m\"))) | .head.sha")"
          if [[ "$(grep -c . <<<"$sources")" -gt 1 ]]; then
            echo "Merged commit maps to more than one promotion source." >&2
            exit 1
          fi
          if [[ -n "$sources" ]]; then
            git fetch --no-tags origin "$sources"
          fi
          echo "sha=$sources" >> "$GITHUB_OUTPUT"
      - name: Plan the next version from repository history
        id: plan
        env:
          CHECKPOINT_ROLE: ${{ steps.checkpoint.outputs.role || 'none' }}
          RELEASE_LEVEL: ${{ steps.route.outputs.channel }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          source_args=()
          if [[ -n "$SOURCE_SHA" ]]; then
            source_args=(--source-sha "$SOURCE_SHA")
          fi
          python3 scripts/release_policy.py plan \
            --sha "$GITHUB_SHA" \
            --phase "$RELEASE_LEVEL" \
            --checkpoint-role "$CHECKPOINT_ROLE" \
            "${source_args[@]}" \
            --github-output "$GITHUB_OUTPUT"
      - name: Record deferred checkpoint work
        if: ${{ steps.plan.outputs.status == 'deferred' }}
        run: |
          echo "Checkpoint work merged without a release; the checkpoint's terminal Issue publishes the beta." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Reject an unmaterialized merged delivery
        if: ${{ steps.plan.outputs.status == 'pending' }}
        run: |
          echo "Release-worthy work must materialize its planned version before merge." >&2
          exit 1
      - name: Detect the available release path
        id: capability
        if: ${{ !contains(fromJSON('["no-release","deferred"]'), steps.plan.outputs.status) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_policy.py detect \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME" \
            --github-output "$GITHUB_OUTPUT"
      - name: Stop when GitHub publication is blocked
        if: ${{ (steps.plan.outputs.status == 'candidate' || steps.plan.outputs.status == 'released') && steps.capability.outputs.mode == 'blocked' }}
        env:
          BLOCK_REASON: ${{ steps.capability.outputs.reason }}
        run: |
          echo "Release is blocked: $BLOCK_REASON" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Reuse the source PR's trusted verification evidence
        id: verification
        if: ${{ !contains(fromJSON('["no-release","deferred"]'), steps.plan.outputs.status) }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_TIER: ${{ steps.route.outputs.required_tier }}
        run: |
          if ./scripts/check-trusted-verification "$GITHUB_SHA" \
            --resolve-merge-source --github-repo "$GITHUB_REPOSITORY" \
            --merge-branch "$GITHUB_REF_NAME" \
            --required-tier "$REQUIRED_TIER"; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !contains(fromJSON('["no-release","deferred"]'), steps.plan.outputs.status) }}
        with:
          python-version: "3.14"
      - name: Set up uv 0.12.15
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: ${{ !contains(fromJSON('["no-release","deferred"]'), steps.plan.outputs.status) }}
        with:
          enable-cache: false
          version: "0.12.15"
      - name: Set up pnpm 11.22.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ !contains(fromJSON('["no-release","deferred"]'), steps.plan.outputs.status) }}
        with:
          version: "11.22.0"
          run_install: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !contains(fromJSON('["no-release","deferred"]'), steps.plan.outputs.status) }}
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        if: ${{ !contains(fromJSON('["no-release","deferred"]'), steps.plan.outputs.status) }}
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - name: Set up Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ !contains(fromJSON('["no-release","deferred"]'), steps.plan.outputs.status) }}
        with:
          go-version: "1.27.1"
          cache: false
      - name: Re-verify the exact release tree when reuse is unavailable
        if: ${{ !contains(fromJSON('["no-release","deferred"]'), steps.plan.outputs.status) && steps.verification.outputs.reused != 'true' }}
        env:
          CSARC_CI_BASE: ${{ github.event.before }}
          CSARC_CI_SCOPES: dependency,docs,governance,shell,source,template,workflow
          CSARC_CI_TIER: ${{ steps.route.outputs.required_tier }}
          GOTOOLCHAIN: local
        run: |
          # A dispatched run has no push base; the merged commit's first parent
          # is the real pre-merge base, never the accumulated default branch.
          export CSARC_CI_BASE="${CSARC_CI_BASE:-$(git rev-parse "$GITHUB_SHA^1")}"
          if [[ "$CSARC_CI_TIER" == full ]]; then
            ./scripts/verify-template.sh
          else
            ./scripts/verify-fast
          fi
      - name: Validate and stage the merged version candidate
        id: stage
        if: ${{ (steps.plan.outputs.status == 'candidate' || steps.plan.outputs.status == 'released') && steps.plan.outputs.materialized == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          ./scripts/publish-release stage \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --tag "$RELEASE_TAG" --branch "$GITHUB_REF_NAME"
      - name: Resolve the exact release state
        id: state
        if: ${{ !contains(fromJSON('["no-release","deferred"]'), steps.plan.outputs.status) }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.stage.outputs.tag }}
        run: |
          ./scripts/publish-release resolve \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --tag "$RELEASE_TAG"
      - name: Prepare release assets
        if: ${{ steps.state.outputs.state == 'draft' }}
        env:
          RELEASE_TAG: ${{ steps.state.outputs.tag }}
        run: python3 scripts/release_bundle.py prepare --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-assets"
      - name: Record included work in the draft Release
        if: ${{ steps.state.outputs.state == 'draft' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.state.outputs.tag }}
        run: |
          python3 scripts/release_level.py annotate-release \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --body-file "$RUNNER_TEMP/release-levels.md"
      - name: Generate the SPDX SBOM
        if: ${{ steps.state.outputs.state == 'draft' }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/release-assets/sbom.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Bind, upload, and publish the release
        if: ${{ steps.state.outputs.state == 'draft' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.state.outputs.tag }}
        run: |
          ./scripts/publish-release publish \
            --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - name: Verify an already-published rerun
        if: ${{ steps.state.outputs.state == 'published' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.state.outputs.tag }}
        run: |
          ./scripts/publish-release rerun-verify \
            --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - name: Complete a no-release Milestone
        if: ${{ steps.plan.outputs.status == 'no-release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/sync_milestone_state.py complete-release \
            --repo "$GITHUB_REPOSITORY" \
            --main-sha "$GITHUB_SHA" \
            --evidence-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --outcome no-release
