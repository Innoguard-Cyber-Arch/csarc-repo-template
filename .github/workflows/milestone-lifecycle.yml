name: Milestone lifecycle

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, milestoned, demilestoned]
  issue_comment:
    types: [created, edited, deleted]
  milestone:
    types: [created, edited, opened, closed]
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: milestone-${{ github.repository }}-${{ github.event.issue.milestone.number || github.event.changes.milestone.from.number || github.event.milestone.number || github.event.pull_request.milestone.number || 'none' }}
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    if: ${{ github.event.issue.milestone.number != null || github.event.milestone.number != null }}
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reconcile lifecycle and refresh PR checks
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_NUMBER: ${{ github.event.issue.milestone.number || github.event.milestone.number }}
        run: >-
          python3 scripts/sync_milestone_state.py reconcile
          --repo "$GITHUB_REPOSITORY"
          --milestone "$MILESTONE_NUMBER"
  sync-previous:
    name: sync previous
    if: ${{ github.event.changes.milestone.from.number != null && github.event.changes.milestone.from.number != github.event.issue.milestone.number }}
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reconcile the previous Milestone
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_NUMBER: ${{ github.event.changes.milestone.from.number }}
        run: >-
          python3 scripts/sync_milestone_state.py reconcile
          --repo "$GITHUB_REPOSITORY"
          --milestone "$MILESTONE_NUMBER"
  record-promotion-evidence:
    name: record promotion evidence
    if: >-
      ${{ github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'promote/m') }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the tracker Issue this promotion closes
        id: tracker
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          tracker_number="$(python3 -c '
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY") or ""
          match = re.search(
              r"(?<!\w)(?:Closes|Fixes|Resolves)[ \t]+#([0-9]+)(?!\w)", body
          )
          if match is None:
              sys.exit("No closing Issue reference found in the pull request body")
          print(match.group(1))
          ')"
          echo "number=$tracker_number" >> "$GITHUB_OUTPUT"
      - name: Record the merge commit as delivery evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKER_NUMBER: ${{ steps.tracker.outputs.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: >-
          python3 scripts/sync_milestone_state.py record-promotion-evidence
          --repo "$GITHUB_REPOSITORY"
          --tracker "$TRACKER_NUMBER"
          --evidence-url "https://github.com/$GITHUB_REPOSITORY/commit/$MERGE_SHA"
