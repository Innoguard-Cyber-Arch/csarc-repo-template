name: Promotion gate

on:
  pull_request:
    branches: [main, "dev/m*"]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

concurrency:
  group: promotion-${{ github.repository }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  preflight:
    name: promotion preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.prepare.outputs.candidate_sha }}
      canary_environment: ${{ steps.prepare.outputs.canary_environment }}
      canary_state: ${{ steps.prepare.outputs.canary_state }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      kind: ${{ steps.prepare.outputs.kind }}
      pr_number: ${{ steps.prepare.outputs.pr_number }}
      relevant: ${{ steps.prepare.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate promotion prerequisites and bundle the candidate
        id: prepare
        env:
          CANONICAL_REPOSITORY: Innoguard-Cyber-Arch/csarc-repo-template
          CANARY_COMMAND: ${{ vars.CSARC_CANARY_COMMAND }}
          CANARY_ENVIRONMENT: ${{ vars.CSARC_CANARY_ENVIRONMENT }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch_strategy=main
          if [[ "$GITHUB_REPOSITORY" == "$CANONICAL_REPOSITORY" ]]; then
            branch_strategy=delivery
          elif [[ -n "${{ github.event.pull_request.base.sha || '' }}" ]]; then
            profile="$(git show "${{ github.event.pull_request.base.sha }}:.csarc/profile.json" 2>/dev/null || true)"
            if [[ -n "$profile" ]]; then
              branch_strategy="$(jq -r '.branch_strategy // "main"' <<<"$profile")"
            fi
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$PR_HEAD" == release-please--* ]]; then
            trusted_root="$(mktemp -d "$RUNNER_TEMP/release-follow-up-policy.XXXXXX")"
            git archive "$PR_BASE_SHA" | tar -x -C "$trusted_root"
            git diff --no-renames --name-only \
              "$PR_BASE_SHA" \
              "$PR_HEAD_SHA" \
              > "$RUNNER_TEMP/release-follow-up-files"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" \
              > "$RUNNER_TEMP/release-follow-up-commits.json"
            actor_permission=""
            if [[ "$PR_AUTHOR" != "github-actions[bot]" ]]; then
              encoded_actor="$(jq -rn --arg value "$PR_AUTHOR" '$value | @uri')"
              actor_permission="$(
                gh api "repos/$GITHUB_REPOSITORY/collaborators/$encoded_actor/permission" \
                  --jq '.permission // empty'
              )"
            fi
            python3 "$trusted_root/scripts/release_policy.py" verify-release-follow-up \
              --repo "$GITHUB_REPOSITORY" \
              --head "$PR_HEAD" \
              --head-repo "$PR_HEAD_REPOSITORY" \
              --head-sha "$PR_HEAD_SHA" \
              --actor "$PR_AUTHOR" \
              --actor-permission "$actor_permission" \
              --changed-files "$RUNNER_TEMP/release-follow-up-files" \
              --commits "$RUNNER_TEMP/release-follow-up-commits.json" \
              --root "$trusted_root"
          fi
          python3 scripts/promotion_gate.py prepare \
            --event "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --branch-strategy "$branch_strategy" \
            --candidate-sha "$CANDIDATE_SHA" \
            --workflow-run "$RUN_URL" \
            --canary-command "$CANARY_COMMAND" \
            --canary-environment "$CANARY_ENVIRONMENT" \
            --archive promotion-candidate.tar.gz \
            --output promotion-preflight.json \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload candidate and preflight evidence
        if: ${{ steps.prepare.outputs.relevant == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-candidate-${{ github.run_id }}
          path: |
            promotion-candidate.tar.gz
            promotion-preflight.json
          if-no-files-found: error
          retention-days: 90

  canary:
    name: external canary
    needs: preflight
    if: ${{ needs.preflight.outputs.relevant == 'true' && needs.preflight.outputs.canary_state == 'allowed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ needs.preflight.outputs.canary_environment }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promotion-candidate-${{ github.run_id }}
          path: candidate
      - name: Run the configured canary smoke
        env:
          CANARY_COMMAND: ${{ vars.CSARC_CANARY_COMMAND }}
          CSARC_CANARY_TOKEN: ${{ secrets.CSARC_CANARY_TOKEN }}
          CSARC_CANDIDATE_ARCHIVE: ${{ github.workspace }}/candidate/promotion-candidate.tar.gz
          CSARC_CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
        run: bash -euo pipefail -c "$CANARY_COMMAND"

  gate:
    name: promotion
    if: ${{ always() }}
    needs: [preflight, canary]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful preflight
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
        run: test "$PREFLIGHT_RESULT" = success
      - if: ${{ needs.preflight.outputs.relevant == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ needs.preflight.outputs.relevant == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promotion-candidate-${{ github.run_id }}
          path: candidate
      - name: Finalize promotion evidence
        if: ${{ needs.preflight.outputs.relevant == 'true' }}
        env:
          CANARY_RESULT: ${{ needs.canary.result }}
        run: >-
          python3 scripts/promotion_gate.py finalize
          --input candidate/promotion-preflight.json
          --output promotion-evidence.json
          --canary-result "$CANARY_RESULT"
      - name: Upload promotion evidence
        if: ${{ needs.preflight.outputs.relevant == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-evidence-${{ needs.preflight.outputs.pr_number }}-${{ needs.preflight.outputs.head_sha }}
          path: promotion-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Report non-applicable route
        if: ${{ needs.preflight.outputs.relevant != 'true' }}
        run: echo "Promotion gate is not applicable to this pull request."
