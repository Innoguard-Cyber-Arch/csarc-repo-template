name: PR policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: title
    runs-on: ubuntu-latest
    steps:
      - name: Validate conventional title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|refactor|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?(!)?:\ .+ ]]; then
            echo "Use: type(scope): short English summary"
            echo "Allowed types: feat, fix, docs, refactor, test, build, ci, chore, revert"
            echo "Scope is optional and must use lowercase letters, numbers, '.', '_', '/', or '-'."
            exit 1
          fi
          if printf '%s' "$PR_TITLE" | LC_ALL=C grep -q '[^ -~]'; then
            echo "PR title must use ASCII characters only."
            echo "The PR body may be written in Chinese."
            exit 1
          fi
