name: PR policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, assigned, unassigned, labeled, unlabeled, milestoned, demilestoned]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  title:
    name: title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the queued target branch
        if: ${{ github.event_name == 'merge_group' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.merge_group.base_sha }}
      - name: Revalidate the queued promotion
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_BASE_REF: ${{ github.event.merge_group.base_ref }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: >-
          python3 scripts/delivery_sync.py merge-group-gate
          --repo "$GITHUB_REPOSITORY"
          --base "$QUEUE_BASE_REF"
          --base-sha "$QUEUE_BASE_SHA"
          --queue-ref "$QUEUE_HEAD_REF"
          --queue-sha "$QUEUE_HEAD_SHA"
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Synchronize pull request metadata
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -f scripts/sync_work_item_metadata.py ]]; then
            python3 scripts/sync_work_item_metadata.py \
              --repo "$GITHUB_REPOSITORY" \
              --pr "$PR_NUMBER"
          else
            echo "::notice::Metadata synchronization starts after the rollout PR reaches its base branch."
          fi
      - name: Validate pull request policy
        id: policy
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_BRANCH_STRATEGY: ${{ github.repository == 'Innoguard-Cyber-Arch/csarc-repo-template' && 'delivery' || '' }}
          PR_DELIVERY_CUTOVER_ISSUE: ${{ github.repository == 'Innoguard-Cyber-Arch/csarc-repo-template' && '185' || '0' }}
          PR_DEVELOPMENT_CUTOVER_PR: ${{ github.repository == 'Innoguard-Cyber-Arch/csarc-repo-template' && '306' || '1' }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/validate-pr-policy
      - name: Require the proposed head to contain current main
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_DELIVERY_BASE: ${{ steps.policy.outputs.delivery_base }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python3 scripts/delivery_sync.py gate
          --repo "$GITHUB_REPOSITORY"
          --base "$PR_BASE"
          --delivery-base "$PR_DELIVERY_BASE"
          --head-ref "$PR_HEAD"
          --head-sha "$PR_HEAD_SHA"
          --pr-number "$PR_NUMBER"
