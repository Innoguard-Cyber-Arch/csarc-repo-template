name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'dev') && !startsWith(github.event.pull_request.head.ref, 'release-please--') && !contains(github.event.pull_request.labels.*.name, 'promotion') && !contains(github.event.pull_request.labels.*.name, 'hotfix') && !contains(github.event.pull_request.labels.*.name, 'release-recovery') }}

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  fast:
    name: route and fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      stage: ${{ steps.plan.outputs.stage }}
      reason: ${{ steps.plan.outputs.reason }}
      review_state: ${{ steps.plan.outputs.review_state }}
      scopes: ${{ steps.plan.outputs.scopes }}
      risks: ${{ steps.plan.outputs.risks }}
      run_governance: ${{ steps.plan.outputs.run_governance }}
      run_osv: ${{ steps.plan.outputs.run_osv }}
      run_zizmor: ${{ steps.plan.outputs.run_zizmor }}
      run_deep: ${{ steps.plan.outputs.run_deep }}
      run_adoption_macos: ${{ steps.plan.outputs.run_adoption_macos }}
    steps:
      - name: Start timing
        id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select verification tier
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BASE: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || '' }}
          PR_HEAD: ${{ github.event.pull_request.head.ref || github.event.merge_group.head_ref || '' }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          files="$RUNNER_TEMP/changed-files"
          if [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
            git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$files"
          else
            git ls-files -z > "$files"
          fi
          args=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            args+=(--force-full)
          fi
          if [[ "$EVENT_NAME" == "pull_request" && "$PR_DRAFT" == "true" ]]; then
            args+=(--draft)
          fi
          python3 scripts/ci_tier.py \
            --event "$EVENT_NAME" \
            --base "${PR_BASE#refs/heads/}" \
            --head "${PR_HEAD#refs/heads/}" \
            --labels "$LABELS" \
            --files-from "$files" \
            --output-json ci-plan.json \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" \
            "${args[@]}"
      - if: ${{ steps.plan.outputs.tier == 'fast' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - if: ${{ steps.plan.outputs.tier == 'fast' }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run change-aware checks
        if: ${{ steps.plan.outputs.tier == 'docs' || steps.plan.outputs.tier == 'fast' }}
        env:
          CSARC_CI_RISKS: ${{ steps.plan.outputs.risks }}
          CSARC_CI_SCOPES: ${{ steps.plan.outputs.scopes }}
          CSARC_CI_TIER: ${{ steps.plan.outputs.tier }}
          CSARC_PYTHON_VERSION: "3.14"
        run: ./scripts/verify-fast
      - name: Verify portable decision site
        run: python3 scripts/render_site.py --check
      - name: Upload portable decision site
        if: ${{ steps.plan.outputs.upload_site == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-decision-site
          path: docs/index.html
          if-no-files-found: error
          retention-days: 14
      - name: Record routing duration
        if: ${{ always() }}
        env:
          STARTED_AT: ${{ steps.started.outputs.epoch }}
        run: |
          duration=$(( $(date +%s) - STARTED_AT ))
          if [[ -f ci-plan.json ]]; then
            python3 - "$duration" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("ci-plan.json")
          plan = json.loads(path.read_text(encoding="utf-8"))
          plan["fast_job_seconds"] = int(sys.argv[1])
          path.write_text(json.dumps(plan, indent=2) + "\n", encoding="utf-8")
          PY
          fi
          echo "- Fast job duration: \`${duration}s\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish CI routing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-plan.json
          if-no-files-found: warn
          retention-days: 90

  canonical-full:
    name: canonical full (Python 3.14 + Node 24)
    needs: fast
    if: ${{ needs.fast.outputs.tier == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.22.0"
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: ./scripts/verify-template.sh
        env:
          CSARC_PYTHON_VERSION: "3.14"
      - name: Record canonical evidence
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: echo "- Canonical full (Python 3.14 + Node 24) — $RESULT" >> "$GITHUB_STEP_SUMMARY"

  python-compatibility:
    name: Python compatibility (3.14.0)
    needs: fast
    if: ${{ needs.fast.outputs.run_deep == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.0"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run runtime-sensitive tests
        env:
          UV_PROJECT_ENVIRONMENT: .venv-3.14.0
          UV_PYTHON: "3.14.0"
        run: |
          uv sync --locked --python "$UV_PYTHON"
          uv run pytest -m "runtime and not large"
          uv build --clear
          uv run --isolated --no-project --with ./dist/*.whl \
            python -c "import csarc_cli"
          uvx --from "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)" \
            csarc --help >/dev/null
      - name: Record Python compatibility evidence
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: echo "- Python compatibility 3.14.0 — $RESULT" >> "$GITHUB_STEP_SUMMARY"

  adoption-macos:
    name: adoption e2e macOS
    needs: fast
    if: ${{ needs.fast.outputs.run_adoption_macos == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --python 3.14
      - run: >-
          uv run pytest -q -m large
          tests/test_cli.py::test_real_existing_adoption_uses_fixed_ownership_policies

  governance:
    name: remote governance
    needs: fast
    if: ${{ needs.fast.outputs.run_governance == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - name: Check effective repository governance
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/apply-repository-settings.sh check

  osv:
    name: dependency vulnerability scan
    needs: fast
    if: ${{ needs.fast.outputs.run_osv == 'true' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
      upload-sarif: false
      fail-on-vuln: true

  zizmor:
    name: workflow audit
    needs: fast
    if: ${{ needs.fast.outputs.run_zizmor == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Audit workflow definitions
        env:
          CSARC_ZIZMOR_TOKEN: ${{ github.repository == 'Innoguard-Cyber-Arch/csarc-repo-template' && github.token || '' }}
        run: |
          if [[ -n "$CSARC_ZIZMOR_TOKEN" ]]; then
            GH_TOKEN="$CSARC_ZIZMOR_TOKEN" \
              uvx --from zizmor==1.29.0 zizmor . --format plain
          else
            uvx --from zizmor==1.29.0 zizmor . --format plain
          fi

  verify:
    name: verify
    if: ${{ always() }}
    needs: [fast, canonical-full, python-compatibility, adoption-macos, governance, osv, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every applicable check
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          TIER: ${{ needs.fast.outputs.tier }}
          RUN_DEEP: ${{ needs.fast.outputs.run_deep }}
          RUN_ADOPTION_MACOS: ${{ needs.fast.outputs.run_adoption_macos }}
          RUN_GOVERNANCE: ${{ needs.fast.outputs.run_governance }}
          RUN_OSV: ${{ needs.fast.outputs.run_osv }}
          RUN_ZIZMOR: ${{ needs.fast.outputs.run_zizmor }}
          REVIEW_STATE: ${{ needs.fast.outputs.review_state }}
          CANONICAL_RESULT: ${{ needs.canonical-full.result }}
          ADOPTION_MACOS_RESULT: ${{ needs.adoption-macos.result }}
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          OSV_RESULT: ${{ needs.osv.result }}
          PYTHON_COMPATIBILITY_RESULT: ${{ needs.python-compatibility.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
        run: |
          require_boolean() {
            value="$1"
            name="$2"
            case "$value" in
              true|false) ;;
              *)
                echo "$name must be true or false; got ${value:-<empty>}" >&2
                return 1
                ;;
            esac
          }
          require_routed() {
            expected="$1"
            actual="$2"
            name="$3"
            require_boolean "$expected" "$name route"
            if [[ "$expected" == true ]]; then
              [[ "$actual" == success ]] || {
                echo "$name must succeed when routed; got $actual" >&2
                return 1
              }
            else
              [[ "$actual" == skipped ]] || {
                echo "$name must be skipped when not routed; got $actual" >&2
                return 1
              }
            fi
          }
          require_boolean "$RUN_DEEP" run_deep
          require_boolean "$RUN_ADOPTION_MACOS" run_adoption_macos
          require_boolean "$RUN_GOVERNANCE" run_governance
          require_boolean "$RUN_OSV" run_osv
          require_boolean "$RUN_ZIZMOR" run_zizmor
          case "$REVIEW_STATE" in
            draft|ready|not-applicable) ;;
            *)
              echo "review state is invalid: ${REVIEW_STATE:-<empty>}" >&2
              exit 1
              ;;
          esac
          if [[ "$REVIEW_STATE" == "draft" ]]; then
            echo "::notice::Draft WIP targeted checks passed; full verification remains pending until Ready."
          fi
          test "$FAST_RESULT" = success
          case "$TIER" in
            full) test "$CANONICAL_RESULT" = success ;;
            docs|fast|post-merge) test "$CANONICAL_RESULT" = skipped ;;
            *)
              echo "verification tier is invalid: ${TIER:-<empty>}" >&2
              exit 1
              ;;
          esac
          require_routed "$RUN_DEEP" "$PYTHON_COMPATIBILITY_RESULT" python-compatibility
          require_routed "$RUN_ADOPTION_MACOS" "$ADOPTION_MACOS_RESULT" adoption-macos
          require_routed "$RUN_GOVERNANCE" "$GOVERNANCE_RESULT" governance
          require_routed "$RUN_OSV" "$OSV_RESULT" osv
          require_routed "$RUN_ZIZMOR" "$ZIZMOR_RESULT" zizmor
