name: CI

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify:
    name: >-
      ${{
        github.event_name == 'pull_request_target' &&
        (github.event.action == 'labeled' ||
        github.event.action == 'unlabeled') &&
        github.event.label.name != '' &&
        !contains(fromJSON('["promotion","hotfix","release-recovery"]'), github.event.label.name) &&
        'ignored non-tier label' ||
        'verify'
      }}
    if: >-
      ${{
        github.event_name != 'pull_request_target' ||
        github.event.action == 'ready_for_review' ||
        (github.event.action != 'converted_to_draft' &&
        github.event.pull_request.draft != true &&
        ((github.event.action != 'labeled' &&
        github.event.action != 'unlabeled') ||
        github.event.label.name == '' ||
        contains(fromJSON('["promotion","hotfix","release-recovery"]'), github.event.label.name)))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the trusted verification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
      - name: Preserve the trusted verification policy
        run: |
          mkdir -p "$RUNNER_TEMP/trusted-verification"
          cp scripts/*.py scripts/check-trusted-verification \
            "$RUNNER_TEMP/trusted-verification/"
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - name: Read release ownership
        id: release
        run: echo "ownership=$(python3 "$RUNNER_TEMP/trusted-verification/csarc_config.py" release_ownership)" >> "$GITHUB_OUTPUT"
      - name: Validate synchronization structure before verification
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.ref || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD: ${{ github.event.pull_request.head.ref || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          {
            echo "route=ordinary"
            echo "clean=false"
          } >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" != "pull_request_target" || "$PR_HEAD" != sync/main-to-* ]]; then
            exit 0
          fi
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          sync_result="$(python3 "$RUNNER_TEMP/trusted-verification/delivery_sync.py" verify-sync \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --base "$PR_BASE" \
            --base-sha "$PR_BASE_SHA" \
            --head-ref "$PR_HEAD" \
            --head-sha "$PR_HEAD_SHA" \
            --main-sha "$main_sha" \
            --github-output "$GITHUB_OUTPUT")"
          if [[ "$sync_result" != "clean" ]]; then
            echo "route=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          evidence="$RUNNER_TEMP/main-verification.json"
          python3 "$RUNNER_TEMP/trusted-verification/check-trusted-verification" \
            "$main_sha" \
            --github-repo "$GITHUB_REPOSITORY" \
            --resolve-merge-source \
            --required-tier full > "$evidence"
          source_run="$(jq -r 'if .reused then .source_run_id else .run_id end' "$evidence")"
          source_job="$(jq -r 'if .reused then .source_job_id else .job_id end' "$evidence")"
          source_check="$(jq -r 'if .reused then .source_check_run_id else .check_run_id end' "$evidence")"
          {
            echo "route=clean"
            echo "main_sha=$main_sha"
            echo "source_run=$source_run"
            echo "source_job=$source_job"
            echo "source_check=$source_check"
          } >> "$GITHUB_OUTPUT"
      - name: Select trusted verification plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          EVENT_NAME: ${{ github.event_name == 'pull_request_target' && 'pull_request' || github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_BASE: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || '' }}
          PR_HEAD: ${{ github.event.pull_request.head.ref || github.event.merge_group.head_ref || '' }}
          SYNC_CLEAN: ${{ steps.sync.outputs.clean }}
        run: |
          files="$RUNNER_TEMP/changed-files"
          if [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
            merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            git diff --no-renames --name-only -z "$merge_base" "$HEAD_SHA" > "$files"
          else
            git ls-files -z > "$files"
          fi
          args=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            args+=(--force-full)
          fi
          sync_args=()
          if [[ "$SYNC_CLEAN" == "true" ]]; then
            sync_args+=(--verified-sync)
          fi
          python3 "$RUNNER_TEMP/trusted-verification/ci_tier.py" \
            --event "$EVENT_NAME" \
            --base "${PR_BASE#refs/heads/}" \
            --head "${PR_HEAD#refs/heads/}" \
            --labels "$LABELS" \
            --draft "$PR_DRAFT" \
            --files-from "$files" \
            --output-json ci-plan.json \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" \
            "${args[@]}" \
            "${sync_args[@]}"
      - name: Resolve release-level verification suite
        id: level
        env:
          GH_TOKEN: ${{ github.token }}
          PATH_TIER: ${{ steps.plan.outputs.tier }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            python3 "$RUNNER_TEMP/trusted-verification/release_level.py" resolve-pr \
              --repo "$GITHUB_REPOSITORY" \
              --pr "$PR_NUMBER" \
              --path-tier "$PATH_TIER" \
              --github-output "$GITHUB_OUTPUT"
          else
            echo "suite=$PATH_TIER" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate same-PR release materialization
        if: ${{ github.event_name == 'pull_request_target' && steps.sync.outputs.route == 'ordinary' && !startsWith(github.event.pull_request.head.ref, 'promote/m') && steps.release.outputs.ownership == 'csarc-owned' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECKPOINT_ROLE: ${{ steps.level.outputs.checkpoint || 'none' }}
          RELEASE_LEVEL: ${{ steps.level.outputs.level }}
        run: |
          python3 "$RUNNER_TEMP/trusted-verification/release_policy.py" \
            verify-delivery-version \
            --root "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --phase "$RELEASE_LEVEL" \
            --checkpoint-role "$CHECKPOINT_ROLE"
      - name: Validate Milestone promotion version materialization
        if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'promote/m') && steps.release.outputs.ownership == 'csarc-owned' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_LEVEL: ${{ steps.level.outputs.level }}
        run: |
          source_sha="$(git rev-parse "$HEAD_SHA^1")"
          python3 "$RUNNER_TEMP/trusted-verification/release_policy.py" \
            verify-promotion-version \
            --root "$GITHUB_WORKSPACE" \
            --source-sha "$source_sha" \
            --head-sha "$HEAD_SHA" \
            --phase "$RELEASE_LEVEL"
      - name: Resolve effective verification suite
        id: effective
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          RESOLVED_SUITE: ${{ steps.level.outputs.suite }}
          SYNC_ROUTE: ${{ steps.sync.outputs.route }}
        run: |
          suite="$RESOLVED_SUITE"
          if [[ "$suite" == "full" && ( "$PR_DRAFT" == "true" || "$SYNC_ROUTE" != "ordinary" ) ]]; then
            suite=fast
          fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
      - name: Bind trusted verification identity
        id: identity
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || 'none' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          RELEASE_LEVEL: ${{ steps.level.outputs.level || 'none' }}
          TIER: ${{ steps.effective.outputs.suite }}
        run: |
          tree="$(git rev-parse "$HEAD_SHA^{tree}")"
          # Only labels that change the verification tier belong in evidence identity.
          labels="$(jq -c '[.pull_request.labels[].name | select(. == "promotion" or . == "hotfix" or . == "release-recovery")] | sort' "$GITHUB_EVENT_PATH" 2>/dev/null || printf '[]')"
          labels_sha="$(printf '%s' "$labels" | sha256sum | cut -d' ' -f1)"
          if [[ "$TIER" == "full" ]]; then
            command="./scripts/verify-template.sh"
          else
            command="./scripts/verify-fast"
          fi
          {
            echo "tree=$tree"
            echo "command=$command"
            echo "base=$PR_BASE"
            echo "base_sha=$PR_BASE_SHA"
            echo "labels=$labels_sha"
            echo "release=$RELEASE_LEVEL"
          } >> "$GITHUB_OUTPUT"
      - name: Find reusable trusted verification
        id: reuse
        env:
          BASE: ${{ steps.identity.outputs.base }}
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          COMMAND: ${{ steps.identity.outputs.command }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          LABELS_SHA: ${{ steps.identity.outputs.labels }}
          RELEASE_LEVEL: ${{ steps.identity.outputs.release }}
          SCOPES: ${{ steps.plan.outputs.scopes }}
          SYNC_ROUTE: ${{ steps.sync.outputs.route }}
          TIER: ${{ steps.effective.outputs.suite }}
        run: |
          echo "reuse=false" >> "$GITHUB_OUTPUT"
          case "$EVENT_ACTION" in
            edited|labeled|unlabeled|ready_for_review|converted_to_draft) ;;
            *) exit 0 ;;
          esac
          if [[ "$SYNC_ROUTE" != "ordinary" ]]; then
            exit 0
          fi
          if ! python3 "$RUNNER_TEMP/trusted-verification/check-trusted-verification" \
            "$HEAD_SHA" \
            --github-repo "$GITHUB_REPOSITORY" \
            --find-reusable \
            --tier "$TIER" \
            --scopes "$SCOPES" \
            --command "$COMMAND" \
            --base "$BASE" \
            --base-sha "$BASE_SHA" \
            --labels "$LABELS_SHA" \
            --release-level "$RELEASE_LEVEL" \
            --exclude-run-id "$GITHUB_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"; then
            echo "::notice::Reusable verification is unavailable; running the exact candidate instead."
          fi
      - name: Validate trusted clean sync
        if: ${{ steps.sync.outputs.clean == 'true' }}
        env:
          BASE: ${{ steps.identity.outputs.base }}
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          LABELS_SHA: ${{ steps.identity.outputs.labels }}
          MAIN_SHA: ${{ steps.sync.outputs.main_sha }}
          RELEASE_LEVEL: ${{ steps.identity.outputs.release }}
          SCOPES: ${{ steps.plan.outputs.scopes }}
          SOURCE_CHECK: ${{ steps.sync.outputs.source_check }}
          SOURCE_JOB: ${{ steps.sync.outputs.source_job }}
          SOURCE_RUN: ${{ steps.sync.outputs.source_run }}
          TREE: ${{ steps.identity.outputs.tree }}
        run: |
          evidence="$(jq -cn \
            --arg scopes "$SCOPES" \
            --arg tree "$TREE" \
            --arg base "$BASE" \
            --arg base_sha "$BASE_SHA" \
            --arg labels "$LABELS_SHA" \
            --arg release "$RELEASE_LEVEL" \
            --arg main "$MAIN_SHA" \
            --argjson source_run "$SOURCE_RUN" \
            --argjson source_job "$SOURCE_JOB" \
            --argjson source_check "$SOURCE_CHECK" \
            '{schema_version: 1, kind: "sync", tier: "fast", scopes: $scopes, tree: $tree, command: "./scripts/verify-fast", base: $base, base_sha: $base_sha, labels: $labels, release: $release, main: $main, source_run: $source_run, source_job: $source_job, source_check: $source_check}')"
          evidence="${evidence//'%'/'%25'}"
          printf '::notice title=Trusted verification route evidence::%s\n' "$evidence"
      - name: Reuse trusted verification
        if: ${{ steps.reuse.outputs.reuse == 'true' }}
        env:
          BASE: ${{ steps.identity.outputs.base }}
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          COMMAND: ${{ steps.identity.outputs.command }}
          LABELS_SHA: ${{ steps.identity.outputs.labels }}
          RELEASE_LEVEL: ${{ steps.identity.outputs.release }}
          SCOPES: ${{ steps.plan.outputs.scopes }}
          SOURCE_CHECK: ${{ steps.reuse.outputs.source_check }}
          SOURCE_JOB: ${{ steps.reuse.outputs.source_job }}
          SOURCE_RUN: ${{ steps.reuse.outputs.source_run }}
          TIER: ${{ steps.effective.outputs.suite }}
          TREE: ${{ steps.identity.outputs.tree }}
        run: |
          evidence="$(jq -cn \
            --arg tier "$TIER" \
            --arg scopes "$SCOPES" \
            --arg tree "$TREE" \
            --arg command "$COMMAND" \
            --arg base "$BASE" \
            --arg base_sha "$BASE_SHA" \
            --arg labels "$LABELS_SHA" \
            --arg release "$RELEASE_LEVEL" \
            --argjson source_run "$SOURCE_RUN" \
            --argjson source_job "$SOURCE_JOB" \
            --argjson source_check "$SOURCE_CHECK" \
            '{schema_version: 1, kind: "reuse", tier: $tier, scopes: $scopes, tree: $tree, command: $command, base: $base, base_sha: $base_sha, labels: $labels, release: $release, source_run: $source_run, source_job: $source_job, source_check: $source_check}')"
          evidence="${evidence//'%'/'%25'}"
          printf '::notice title=Trusted verification route evidence::%s\n' "$evidence"
      - name: Set up Python 3.14
        if: ${{ steps.sync.outputs.clean != 'true' && (steps.reuse.outputs.reuse != 'true' || (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/v') && steps.release.outputs.ownership == 'csarc-owned')) }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv 0.12.15
        if: ${{ steps.sync.outputs.clean != 'true' && (steps.reuse.outputs.reuse != 'true' || (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/v') && steps.release.outputs.ownership == 'csarc-owned')) }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
      - name: Set up pnpm 11.22.0
        if: ${{ steps.reuse.outputs.reuse != 'true' && steps.sync.outputs.clean != 'true' && steps.effective.outputs.suite == 'full' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.22.0"
          run_install: false
      - name: Set up Node.js 24
        if: ${{ steps.reuse.outputs.reuse != 'true' && steps.sync.outputs.clean != 'true' && steps.effective.outputs.suite == 'full' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Set up Rust 1.98.0
        if: ${{ steps.reuse.outputs.reuse != 'true' && steps.sync.outputs.clean != 'true' && steps.effective.outputs.suite == 'full' }}
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - name: Execute trusted verification tier=${{ steps.effective.outputs.suite }} scopes=${{ steps.plan.outputs.scopes }} tree=${{ steps.identity.outputs.tree }} command=${{ steps.identity.outputs.command }} base=${{ steps.identity.outputs.base }} base-sha=${{ steps.identity.outputs.base_sha }} labels=${{ steps.identity.outputs.labels }} release=${{ steps.identity.outputs.release }}
        if: ${{ steps.reuse.outputs.reuse != 'true' && steps.sync.outputs.clean != 'true' }}
        env:
          CSARC_CI_SCOPES: ${{ steps.plan.outputs.scopes }}
          CSARC_CI_TIER: ${{ steps.effective.outputs.suite }}
          CSARC_CI_BASE: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || '' }}
          CSARC_CI_DRAFT: ${{ github.event.pull_request.draft || false }}
          CSARC_VERIFICATION_SUITE: ${{ steps.effective.outputs.suite }}
        run: |
          if [[ "$CSARC_CI_TIER" == "full" ]]; then
            ./scripts/verify-template.sh
          else
            ./scripts/verify-fast
          fi
      - name: Validate the guided release candidate
        if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/v') && steps.release.outputs.ownership == 'csarc-owned' }}
        env:
          CSARC_PUBLISH_CANDIDATE_STATUS: "false"
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          jq -n \
            --argjson number "$PR_NUMBER" \
            --arg sha "$PR_HEAD_SHA" \
            --arg head "$PR_HEAD" \
            --arg base "$PR_BASE" \
            '{number: $number, sha: $sha, headBranchName: $head, baseBranchName: $base}' \
            >"$RUNNER_TEMP/release-pr.json"
          ./scripts/verify-release-candidate "$RUNNER_TEMP/release-pr.json"
      - name: Record result
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: echo "- Verification — $RESULT" >> "$GITHUB_STEP_SUMMARY"
