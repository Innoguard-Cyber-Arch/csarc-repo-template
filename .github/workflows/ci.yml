name: CI

on:
  pull_request:
  push:
    branches: [main, "dev/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require protected default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/apply-repository-settings.sh check

  python-runtime:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.0", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.22.0"
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: ./scripts/verify-template.sh
        env:
          CSARC_PYTHON_VERSION: ${{ matrix.python-version }}

  verify:
    name: verify
    if: ${{ always() }}
    needs: python-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every Python runtime
        env:
          RUNTIME_RESULT: ${{ needs.python-runtime.result }}
        run: test "$RUNTIME_RESULT" = success
