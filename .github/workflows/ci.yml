name: CI

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the trusted verification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
      - name: Preserve the trusted verification router
        run: cp scripts/ci_tier.py "$RUNNER_TEMP/ci_tier.py"
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - name: Read release ownership
        id: release
        run: echo "ownership=$(python3 scripts/csarc_config.py release_ownership)" >> "$GITHUB_OUTPUT"
      - name: Select trusted verification plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          EVENT_NAME: ${{ github.event_name == 'pull_request_target' && 'pull_request' || github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BASE: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || '' }}
          PR_HEAD: ${{ github.event.pull_request.head.ref || github.event.merge_group.head_ref || '' }}
        run: |
          files="$RUNNER_TEMP/changed-files"
          if [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$files"
          else
            git ls-files -z > "$files"
          fi
          args=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            args+=(--force-full)
          fi
          python3 "$RUNNER_TEMP/ci_tier.py" \
            --event "$EVENT_NAME" \
            --base "${PR_BASE#refs/heads/}" \
            --head "${PR_HEAD#refs/heads/}" \
            --labels "$LABELS" \
            --files-from "$files" \
            --output-json ci-plan.json \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" \
            "${args[@]}"
      - name: Bind trusted verification identity
        id: identity
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          TIER: ${{ steps.plan.outputs.tier }}
        run: |
          tree="$(git rev-parse "$HEAD_SHA^{tree}")"
          if [[ "$TIER" == "full" ]]; then
            command="./scripts/verify-template.sh"
          else
            command="./scripts/verify-fast"
          fi
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "command=$command" >> "$GITHUB_OUTPUT"
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv 0.12.15
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
      - name: Set up pnpm 11.22.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.22.0"
          run_install: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Set up Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - name: Execute trusted verification tier=${{ steps.plan.outputs.tier }} scopes=${{ steps.plan.outputs.scopes }} tree=${{ steps.identity.outputs.tree }} command=${{ steps.identity.outputs.command }}
        env:
          CSARC_CI_SCOPES: ${{ steps.plan.outputs.scopes }}
          CSARC_CI_TIER: ${{ steps.plan.outputs.tier }}
        run: |
          if [[ "$CSARC_CI_TIER" == "full" ]]; then
            ./scripts/verify-template.sh
          else
            ./scripts/verify-fast
          fi
      - name: Validate the guided release candidate
        if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/v') && steps.release.outputs.ownership == 'csarc-owned' }}
        env:
          CSARC_PUBLISH_CANDIDATE_STATUS: "false"
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          jq -n \
            --argjson number "$PR_NUMBER" \
            --arg sha "$PR_HEAD_SHA" \
            --arg head "$PR_HEAD" \
            --arg base "$PR_BASE" \
            '{number: $number, sha: $sha, headBranchName: $head, baseBranchName: $base}' \
            >"$RUNNER_TEMP/release-pr.json"
          ./scripts/verify-release-candidate "$RUNNER_TEMP/release-pr.json"
      - name: Record result
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: echo "- Verification — $RESULT" >> "$GITHUB_STEP_SUMMARY"
