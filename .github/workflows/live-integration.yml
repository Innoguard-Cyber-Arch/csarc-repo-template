name: Live integration smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-integration-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: resolve immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve latest published immutable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json="$(
            gh release view --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease,isImmutable,url
          )"
          test "$(jq -r '[.isDraft, .isPrerelease, .isImmutable] | @tsv' \
            <<<"$release_json")" = $'false\tfalse\ttrue'
          jq -r '"tag=\(.tagName)"' <<<"$release_json" >> "$GITHUB_OUTPUT"

  probe:
    name: ${{ matrix.capability }}
    needs: release
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: osv
            capability: OSV
            workflow: osv.yml
            release_ref: false
            failure_layer: reusable workflow permissions
          - id: release-please
            capability: Release Please
            workflow: release-please.yml
            release_ref: false
            failure_layer: repository Actions setting or token permissions
          - id: release-handoff
            capability: Release handoff
            workflow: release-template.yml
            release_ref: true
            failure_layer: workflow event/ref or token permissions
          - id: governance-drift
            capability: Governance drift
            workflow: governance-drift.yml
            release_ref: false
            failure_layer: repository setting or issues token permissions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch and observe live workflow
        env:
          CAPABILITY: ${{ matrix.capability }}
          FAILURE_LAYER: ${{ matrix.failure_layer }}
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ matrix.release_ref && needs.release.outputs.tag || github.event.repository.default_branch }}
          WORKFLOW: ${{ matrix.workflow }}
        run: >-
          ./scripts/run-live-workflow-probe
          "$CAPABILITY"
          "$WORKFLOW"
          "$TARGET_REF"
          "live-evidence/${{ matrix.id }}.json"
          "$FAILURE_LAYER"
      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-${{ matrix.id }}-${{ github.run_id }}
          path: live-evidence/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 30
