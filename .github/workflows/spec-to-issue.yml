name: Spec to Issue

on:
  push:
    branches: [main, "dev/m*"]
    paths:
      - docs/specs/*.md
      - scripts/spec_to_issue.py
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: spec-to-issue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Find changed specifications
        id: specs
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            find docs/specs -maxdepth 1 -type f -name '*.md' -print | sort > "$RUNNER_TEMP/specs.txt"
          else
            git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$CURRENT_SHA" -- 'docs/specs/*.md' > "$RUNNER_TEMP/specs.txt"
          fi
          cat "$RUNNER_TEMP/specs.txt"
          if [[ -s "$RUNNER_TEMP/specs.txt" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update Issues
        if: steps.specs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t spec_files < "$RUNNER_TEMP/specs.txt"
          uv run --no-project python scripts/spec_to_issue.py sync \
            --repo "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_SHA" \
            "${spec_files[@]}"
