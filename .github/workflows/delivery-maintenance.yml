name: Delivery maintenance

on: # zizmor: ignore[dangerous-triggers] trusted default-branch workflow
  workflow_dispatch:
    inputs:
      delivery_branch:
        description: Exact short-lived dev/m* branch
        required: true
        type: string
      reason:
        description: Final promotion or an explicit Issue dependency
        required: true
        type: choice
        options: [promotion, explicit-dependency]
      pr_number:
        description: Owner PR proving the requested sync reason
        required: true
        type: number

concurrency:
  group: delivery-maintenance-${{ github.repository }}-${{ inputs.delivery_branch }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Configure authenticated Git transport for lifecycle leases
        env:
          GH_TOKEN: ${{ secrets.CSARC_SYNC_TOKEN || github.token }}
        run: gh auth setup-git
      - name: Reconcile one authorized delivery branch
        env:
          BRANCH_STRATEGY: ${{ github.repository == 'Innoguard-Cyber-Arch/csarc-repo-template' && 'delivery' || '' }}
          GH_TOKEN: ${{ secrets.CSARC_SYNC_TOKEN || github.token }}
          DELIVERY_BRANCH: ${{ inputs.delivery_branch }}
          REQUEST_PR: ${{ inputs.pr_number }}
          REQUESTER: ${{ github.actor }}
          SYNC_REASON: ${{ inputs.reason }}
          SYNC_AUTO: ${{ vars.CSARC_AUTO_SYNC == 'true' && 'true' || 'false' }}
          SYNC_TOKEN_KIND: ${{ secrets.CSARC_SYNC_TOKEN != '' && 'external' || 'github-token' }}
        run: |
          branch_strategy="$BRANCH_STRATEGY"
          if [[ -z "$branch_strategy" ]]; then
            branch_strategy="$(jq -er '.branch_strategy | select(. == "main" or . == "delivery")' .csarc/profile.json)"
          fi
          python3 scripts/delivery_sync.py reconcile \
            --repo "$GITHUB_REPOSITORY" \
            --delivery-branch "$DELIVERY_BRANCH" \
            --reason "$SYNC_REASON" \
            --request-pr "$REQUEST_PR" \
            --requester "$REQUESTER" \
            --auto "$SYNC_AUTO" \
            --branch-strategy "$branch_strategy" \
            --token-kind "$SYNC_TOKEN_KIND" | tee -a "$GITHUB_STEP_SUMMARY"
