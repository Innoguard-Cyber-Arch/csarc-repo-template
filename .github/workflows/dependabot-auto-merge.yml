name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  auto-merge:
    name: auto-merge
    # `pull_request` (not `pull_request_target`) is deliberate. Dependabot
    # pushes its update branch to this repository directly, never a fork, so
    # this run is never a fork PR needing the base-branch execution context
    # that `pull_request_target` provides. GitHub downgrades the default
    # GITHUB_TOKEN to read-only for Dependabot-triggered pull_request runs,
    # but has honored an explicit `permissions:` override since 2021-10-11
    # (see GitHub Actions changelog "Workflows triggered by Dependabot PRs
    # will respect permissions key in workflows"), so the job-level grant
    # below is sufficient and keeps this workflow on the same trigger and
    # trust boundary as every other PR in this repository.
    #
    # The gate reads github.event.pull_request.user.login, not
    # github.actor: github.actor reflects the most recent actor to act on
    # the run, which is not necessarily the pull request's opener, while
    # pull_request.user.login is fixed at PR-open time and cannot be
    # relabeled by a later push (zizmor bot-conditions audit).
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents: write is required by `gh pr merge --auto`, which enables
      # GitHub's native auto-merge queue; it does not perform an immediate
      # merge. The actual merge still only happens later, and only once the
      # required `title`/`promotion`/`verify` checks and the branch
      # protection review requirement in policies/rulesets.json are
      # satisfied, at which point GitHub performs the merge itself.
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      - name: Enable auto-merge for minor and patch updates
        if: >-
          ${{ steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # This repository is squash-merge-only; --squash matches that policy.
        run: gh pr merge --auto --squash "$PR_URL"
      - name: Flag major updates for manual review
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-major' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit "$PR_URL" --add-label needs-manual-review
          gh pr comment "$PR_URL" --body "This is a major version update, which may include breaking changes. Auto-merge is intentionally skipped; please review and merge manually."

  sync-template:
    name: sync-template
    # Issue #755: Dependabot only ever bumps root's copy of a paired file
    # (scripts/sync-paired-files.sh) -- it does not know template/ holds a
    # required byte-identical copy of some of them, so a bump to e.g.
    # .github/workflows/pr-policy.yml leaves template's copy stale and
    # fails the verify job's paired-file check. Same gate, trigger, and
    # trust reasoning as the auto-merge job above: pull_request (not
    # _target) because Dependabot pushes to this repository directly,
    # never a fork.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents: write pushes the sync commit onto Dependabot's own
      # branch. This step only ever runs scripts/sync-paired-files.sh's
      # own byte-for-byte copy logic against paths that script already
      # declares paired -- it never executes anything else from the
      # checked-out PR content, and a Dependabot bump changes a version
      # string or action SHA inside a paired file, never that script
      # itself.
      contents: write
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Sync paired template files and push if this bump drifted them
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          ./scripts/sync-paired-files.sh
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "::notice::No paired-file drift from this bump; nothing to sync."
            exit 0
          fi
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add -A
          # Issue #755, completion condition 5: a `fix` commit here (not
          # `chore`) is what lets this reach a release -- it only fires
          # when scripts/sync-paired-files.sh actually found drift, i.e.
          # exactly when this bump changed template/ content that
          # `copier update` distributes downstream, not on every
          # Dependabot commit regardless of what it touched.
          git commit -m "fix(deps): sync template copies of this dependency bump (#755)"
          git push origin "HEAD:refs/heads/$HEAD_REF"
