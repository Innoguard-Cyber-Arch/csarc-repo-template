version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [enhancement]
  - package-ecosystem: uv
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [enhancement]
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: [minor, patch]
