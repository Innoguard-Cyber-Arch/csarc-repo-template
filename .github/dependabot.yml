version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      # Dependabot exempts security updates; only version updates wait.
      default-days: 3
    labels: [enhancement]
  - package-ecosystem: uv
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      # Dependabot exempts security updates; only version updates wait.
      default-days: 3
    labels: [enhancement]
