name: PR policy writes

# This workflow is loaded from the default branch after the read-only PR
# policy run completes. It never checks out or executes pull-request content.
on:
  workflow_run:
    workflows: ["PR policy"]
    types: [completed]

permissions: {}

concurrency:
  group: >-
    pr-policy-writes-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  process:
    name: process
    if: >-
      ${{
        github.event.workflow_run.conclusion != 'cancelled' &&
        (github.event.workflow_run.event == 'pull_request_target' ||
        github.event.workflow_run.event == 'merge_group')
      }}
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the trusted default-branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Resolve the unique triggering pull request
        id: resolve
        if: ${{ github.event.workflow_run.event == 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number="$(
            python3 .csarc/scripts/sync_work_item_metadata.py \
              --repo "$GITHUB_REPOSITORY" \
              --resolve-head-sha "$HEAD_SHA" \
              --head-repository "$HEAD_REPOSITORY" \
              --head-branch "$HEAD_BRANCH"
          )"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
      - name: Synchronize pull request metadata
        if: >-
          ${{
            !cancelled() &&
            github.event.workflow_run.event == 'pull_request_target' &&
            steps.resolve.outcome == 'success'
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.number }}
        run: >-
          python3 .csarc/scripts/sync_work_item_metadata.py
          --repo "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
      - name: Publish the pull request approval decision
        if: >-
          ${{
            !cancelled() &&
            github.event.workflow_run.event == 'pull_request_target' &&
            steps.resolve.outcome == 'success'
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.number }}
        run: >-
          python3 .csarc/scripts/sync_milestone_state.py check-pr
          --repo "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
      - name: Publish the merge queue approval decision
        if: >-
          ${{
            !cancelled() &&
            github.event.workflow_run.event == 'merge_group'
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python3 .csarc/scripts/sync_milestone_state.py check-merge-group
          --repo "$GITHUB_REPOSITORY"
          --head-sha "$MERGE_GROUP_HEAD_SHA"
