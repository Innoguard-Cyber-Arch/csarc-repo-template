name: PR policy

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, assigned, unassigned, labeled, unlabeled, milestoned, demilestoned]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  title:
    name: title
    if: ${{ github.event_name == 'merge_group' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the queued target branch
        if: ${{ github.event_name == 'merge_group' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.merge_group.base_sha }}
      - name: Revalidate the queued promotion
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_BASE_REF: ${{ github.event.merge_group.base_ref }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: >-
          python3 .csarc/scripts/delivery_sync.py merge-group-gate
          --repo "$GITHUB_REPOSITORY"
          --base "$QUEUE_BASE_REF"
          --base-sha "$QUEUE_BASE_SHA"
          --queue-ref "$QUEUE_HEAD_REF"
          --queue-sha "$QUEUE_HEAD_SHA"
      - if: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Classify the delivery-promotion route
        env:
          EVENT_NAME: ${{ github.event_name == 'pull_request_target' && 'pull_request' || github.event_name }}
        run: |
          if python3 .csarc/scripts/promotion_gate.py --help | grep -q check-route; then
            python3 .csarc/scripts/promotion_gate.py check-route \
              --event "$EVENT_NAME" \
              --event-path "$GITHUB_EVENT_PATH" \
              --branch-strategy delivery \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Promotion route classification starts after this pull request reaches its base branch."
          fi
      - name: Validate pull request policy
        id: policy
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_DELIVERY_CUTOVER_ISSUE: ${{ github.repository == 'Innoguard-Cyber-Arch/csarc-repo-template' && '185' || '0' }}
          PR_DEVELOPMENT_CUTOVER_PR: ${{ github.repository == 'Innoguard-Cyber-Arch/csarc-repo-template' && '306' || '1' }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_POLICY_READ_ONLY: "true"
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./.csarc/scripts/validate-pr-policy
      - name: Validate Milestone approval
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if python3 .csarc/scripts/sync_milestone_state.py check-pr --help | grep -q -- --read-only; then
            python3 .csarc/scripts/sync_milestone_state.py check-pr \
              --repo "$GITHUB_REPOSITORY" \
              --pr "$PR_NUMBER" \
              --read-only
          else
            echo "::notice::Read-only Milestone approval starts after this pull request reaches its base branch."
          fi
      - name: Validate the scope-drift gate
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ -x ./.csarc/scripts/check-scope-gate ]]; then
            ./.csarc/scripts/check-scope-gate
          else
            echo "::notice::Scope-drift gate starts after the rollout PR reaches its base branch."
          fi
      - name: Revalidate queued Milestone approval
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if python3 .csarc/scripts/sync_milestone_state.py check-merge-group --help | grep -q -- --read-only; then
            python3 .csarc/scripts/sync_milestone_state.py check-merge-group \
              --repo "$GITHUB_REPOSITORY" \
              --head-sha "$MERGE_GROUP_HEAD_SHA" \
              --read-only
          else
            echo "::notice::Read-only Milestone approval starts after this pull request reaches its base branch."
          fi
      - name: Require the proposed head to contain current main
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python3 .csarc/scripts/delivery_sync.py gate
          --repo "$GITHUB_REPOSITORY"
          --base "$PR_BASE"
          --head-ref "$PR_HEAD"
          --head-sha "$PR_HEAD_SHA"
          --pr-number "$PR_NUMBER"
