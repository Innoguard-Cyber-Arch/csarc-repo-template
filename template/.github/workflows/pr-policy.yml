name: PR policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, assigned, unassigned, labeled, unlabeled, milestoned, demilestoned]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  title:
    name: title
    runs-on: ubuntu-latest
    steps:
      - name: Check out the queued target branch
        if: ${{ github.event_name == 'merge_group' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.merge_group.base_sha }}
      - name: Revalidate the queued promotion
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_BASE_REF: ${{ github.event.merge_group.base_ref }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: >-
          python3 scripts/delivery_sync.py merge-group-gate
          --repo "$GITHUB_REPOSITORY"
          --base "$QUEUE_BASE_REF"
          --base-sha "$QUEUE_BASE_SHA"
          --queue-ref "$QUEUE_HEAD_REF"
          --queue-sha "$QUEUE_HEAD_SHA"
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Synchronize pull request metadata
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -f scripts/sync_work_item_metadata.py ]]; then
            python3 scripts/sync_work_item_metadata.py \
              --repo "$GITHUB_REPOSITORY" \
              --pr "$PR_NUMBER"
          else
            echo "::notice::Metadata synchronization starts after the rollout PR reaches its base branch."
          fi
      - name: Validate pull request policy
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_BRANCH_STRATEGY: ${{ github.repository == 'Innoguard-Cyber-Arch/csarc-repo-template' && 'delivery' || '' }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if [[ "${PR_DRAFT:-false}" == "true" ]]; then
            review_state="draft"
          elif [[ "${PR_DRAFT:-false}" == "false" ]]; then
            review_state="ready"
          else
            echo "PR_DRAFT must be true or false."
            exit 1
          fi
          echo "PR review state: ${review_state}"

          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|refactor|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?(!)?:\ .+ ]]; then
            echo "Use: type(scope): short English summary"
            echo "Allowed types: feat, fix, docs, refactor, test, build, ci, chore, revert"
            echo "Scope is optional and must use lowercase letters, numbers, '.', '_', '/', or '-'."
            exit 1
          fi
          pr_title_type="${BASH_REMATCH[1]}"
          if printf '%s' "$PR_TITLE" | LC_ALL=C grep -q '[^ -~]'; then
            echo "PR title must use ASCII characters only."
            echo "The PR body may be written in Chinese."
            exit 1
          fi

          if [[ "${PR_POLICY_FIXTURE:-false}" == "true" ]]; then
            pr_assignees="${PR_ASSIGNEES:-${PR_AUTHOR:-}}"
            pr_milestone_number="${PR_MILESTONE_NUMBER:-${PR_ISSUE_MILESTONE_NUMBER:-0}}"
          else
            if ! pr_payload="$(${GH_BINARY:-gh} api --method GET \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER")" || \
              [[ -z "$pr_payload" ]]; then
              echo "Cannot read live pull request metadata."
              exit 1
            fi
            if ! jq -e '
              type == "object" and
              (.labels | type) == "array" and (.labels | length) > 0 and
              all(.labels[]; type == "object" and (.name | type) == "string" and (.name | length) > 0) and
              (.assignees | type) == "array" and
              all(.assignees[]; type == "object" and (.login | type) == "string" and (.login | length) > 0) and
              has("milestone") and
              (.milestone == null or ((.milestone | type) == "object" and (.milestone.number | type) == "number" and .milestone.number > 0 and .milestone.number == (.milestone.number | floor))) and
              has("body") and (.body == null or (.body | type) == "string")
            ' <<<"$pr_payload" >/dev/null; then
              echo "Live pull request metadata is incomplete or malformed."
              exit 1
            fi
            PR_LABELS="$(jq -r '[.labels[].name] | join(",")' <<<"$pr_payload")"
            pr_assignees="$(jq -r '[.assignees[].login] | join(",")' <<<"$pr_payload")"
            pr_milestone_number="$(jq -r '.milestone.number // 0' <<<"$pr_payload")"
            PR_BODY="$(jq -r '.body // ""' <<<"$pr_payload")"
          fi

          release_intent="no-release"
          if [[ "$PR_TITLE" =~ ^[^:]+!:\  ]]; then
            release_intent="major"
          elif [[ "$pr_title_type" == "feat" ]]; then
            release_intent="minor"
          elif [[ "$pr_title_type" == "fix" || "$pr_title_type" == "revert" ]]; then
            release_intent="patch"
          fi
          release_message="Release intent: ${release_intent}; exact version is allocated only after main."
          echo "$release_message"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            echo "$release_message" >> "$GITHUB_STEP_SUMMARY"
          fi

          selected_label=""
          selected_count=0
          for label in bug enhancement documentation; do
            if [[ ",${PR_LABELS:-}," == *",${label},"* ]]; then
              selected_label="$label"
              selected_count=$((selected_count + 1))
            fi
          done
          if (( selected_count != 1 )); then
            echo "Select exactly one PR label: bug, enhancement, or documentation."
            exit 1
          fi
          if [[ ",${PR_LABELS:-}," == *,duplicate,* ]]; then
            echo "The duplicate label is an Issue disposition and cannot classify a pull request."
            exit 1
          fi

          branch_strategy="${PR_BRANCH_STRATEGY:-}"
          if [[ -z "$branch_strategy" ]]; then
            branch_strategy="main"
            if [[ -f .csarc/profile.json ]]; then
              branch_strategy="$(
                python3 -c 'import json; print(json.load(open(".csarc/profile.json")).get("branch_strategy", "main"))'
              )"
            fi
          fi

          if [[ "$branch_strategy" != "main" && "$branch_strategy" != "delivery" ]]; then
            echo "branch_strategy must be main or delivery."
            exit 1
          fi

          if [[ ",${PR_LABELS:-}," == *,hotfix,* && ( "$pr_title_type" != "fix" || "$PR_HEAD" != fix/* || "$PR_BASE" != "main" ) ]]; then
            echo "A hotfix must be a fix/* branch targeting main with a fix title."
            exit 1
          fi

          release_recovery=false
          if [[ ",${PR_LABELS:-}," == *,release-recovery,* ]]; then
            if [[ "$pr_title_type" != "fix" || "$PR_HEAD" != fix/* || "$PR_BASE" != "main" || ",${PR_LABELS:-}," == *,hotfix,* ]]; then
              echo "A release recovery must be a fix/* branch targeting main with a fix title, and cannot also be a hotfix."
              exit 1
            fi
            release_recovery=true
          fi

          if [[ "$PR_BASE" == "main" && "$PR_HEAD" == release-please--* ]]; then
            release_files="${RUNNER_TEMP:-/tmp}/release-follow-up-files-${GITHUB_RUN_ID:-$$}.txt"
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)' \
              > "$release_files"
            release_commits="${RUNNER_TEMP:-/tmp}/release-follow-up-commits-${GITHUB_RUN_ID:-$$}.json"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" \
              > "$release_commits"
            actor_permission=""
            if [[ "$PR_AUTHOR" != "github-actions[bot]" ]]; then
              encoded_actor="$(jq -rn --arg value "$PR_AUTHOR" '$value | @uri')"
              actor_permission="$(
                gh api "repos/$GITHUB_REPOSITORY/collaborators/$encoded_actor/permission" \
                  --jq '.permission // empty'
              )"
            fi
            python3 scripts/release_policy.py verify-release-follow-up \
              --repo "$GITHUB_REPOSITORY" \
              --head "$PR_HEAD" \
              --head-repo "$PR_HEAD_REPOSITORY" \
              --head-sha "$PR_HEAD_SHA" \
              --actor "$PR_AUTHOR" \
              --actor-permission "$actor_permission" \
              --changed-files "$release_files" \
              --commits "$release_commits"
            rm "$release_files" "$release_commits"
            exit 0
          fi
          if [[ "$branch_strategy" == "delivery" ]]; then
            if [[ "$PR_HEAD" =~ ^sync/main-to-(m[0-9]+-[a-z0-9][a-z0-9-]*)-[0-9a-f]{7,40}$ ]]; then
              if [[ "$PR_BASE" == "dev/${BASH_REMATCH[1]}" ]]; then
                exit 0
              fi
              echo "A main sync branch must target its matching delivery branch."
              exit 1
            fi

            if [[ "$PR_HEAD" == dependabot/* || "$PR_HEAD" == automation/* ]]; then
              if [[ "$PR_BASE" == "main" ]]; then
                exit 0
              fi
              echo "Automated maintenance must target main."
              exit 1
            fi

            promotion_milestone=""
            promotion=false
            if [[ "$PR_BASE" == "main" && "$PR_HEAD" =~ ^dev/m([0-9]+)-[a-z0-9][a-z0-9-]*$ ]]; then
              promotion=true
              promotion_milestone="${BASH_REMATCH[1]}"
            elif [[ "$PR_BASE" == "main" && "$PR_HEAD" =~ ^promote/m([0-9]+)-[a-z0-9][a-z0-9-]*$ ]]; then
              promotion=true
              promotion_milestone="${BASH_REMATCH[1]}"
            fi
            if [[ "$promotion" == "true" && ",${PR_LABELS:-}," != *,promotion,* ]]; then
              echo "A delivery promotion must use the promotion label."
              exit 1
            fi
          elif [[ "$PR_HEAD" == dependabot/* || "$PR_HEAD" == automation/* ]]; then
            exit 0
          fi

          branch_pattern='^(feat|fix|docs|refactor|test|build|ci|chore|revert)/([0-9]+)-[a-z0-9][a-z0-9-]*$'
          link_verb_pattern='(Closes|Fixes|Resolves)'
          if [[ "$review_state" == "draft" ]]; then
            link_verb_pattern='(Closes|Fixes|Resolves|Refs)'
          fi
          if [[ "${promotion:-false}" == "true" ]]; then
            issue_link_pattern="${link_verb_pattern}[[:space:]]+#([0-9]+)([^[:alnum:]_]|$)"
            if [[ ! "${PR_BODY:-}" =~ $issue_link_pattern ]]; then
              echo "A delivery promotion must reference its Issue; Ready requires a closing keyword."
              exit 1
            fi
            issue_number="${BASH_REMATCH[2]}"
          else
            if [[ ! "$PR_HEAD" =~ $branch_pattern ]]; then
              echo "Use branch: type/<issue-number>-short-slug"
              exit 1
            fi
            issue_number="${BASH_REMATCH[2]}"
            issue_link_pattern="${link_verb_pattern}[[:space:]]+#${issue_number}([^[:alnum:]_]|$)"
            if [[ ! "${PR_BODY:-}" =~ $issue_link_pattern ]]; then
              echo "PR body must reference #${issue_number}; Ready requires a closing keyword."
              exit 1
            fi
          fi

          if [[ "$review_state" == "draft" ]]; then
            for field in "Scope" "Completed verification" "Pending verification" "Known risks" "Dependencies / non-parallel work"; do
              field_pattern="^[[:space:]]*-[[:space:]]+${field}:[[:space:]]+[^[:space:]]"
              if ! grep -Eq "$field_pattern" <<<"${PR_BODY:-}"; then
                echo "Draft PR body must provide: ${field}."
                exit 1
              fi
            done
          fi

          closing_count=0
          closing_issue_number=""
          unexpected_closing=false
          while IFS= read -r body_closing_issue; do
            if [[ -n "$body_closing_issue" ]]; then
              closing_count=$((closing_count + 1))
              closing_issue_number="$body_closing_issue"
              if [[ "$body_closing_issue" != "$issue_number" ]]; then
                unexpected_closing=true
              fi
            fi
          done < <(
            python3 -c 'import re, sys; sys.stdout.writelines(f"{match}\n" for match in re.findall(r"(?<!\w)(?:Closes|Fixes|Resolves)[ \t]+#([0-9]+)(?!\w)", sys.stdin.read()))' \
              <<<"${PR_BODY:-}"
          )
          if [[ "${promotion:-false}" != "true" && ( "$unexpected_closing" == "true" || "$closing_count" -gt 1 ) ]]; then
            echo "A routine pull request may close only its single primary Issue."
            exit 1
          fi
          require_complete=false
          if [[ "$review_state" == "ready" || "$closing_count" -gt 0 ]]; then
            require_complete=true
          fi
          unchecked_task_pattern='^[[:space:]]*-[[:space:]]+\[[[:space:]]*\]'
          if [[ "$require_complete" == "true" ]] && grep -Eq "$unchecked_task_pattern" <<<"${PR_BODY:-}"; then
            echo "Complete every pull request checklist item before using a closing keyword or marking Ready."
            exit 1
          fi

          if [[ "${PR_ISSUE_STATE+x}" == "x" ]]; then
            issue_state="$PR_ISSUE_STATE"
            issue_title="${PR_ISSUE_TITLE:-}"
            issue_body="${PR_ISSUE_BODY:-}"
            issue_milestone_number="${PR_ISSUE_MILESTONE_NUMBER:-0}"
            issue_labels="${PR_ISSUE_LABELS:-$PR_LABELS}"
            issue_has_unchecked=false
            if grep -Eq "$unchecked_task_pattern" <<<"$issue_body"; then
              issue_has_unchecked=true
            fi
          else
            issue_payload="$(
              gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number" \
                --jq 'select(.pull_request | not) | [.state, .title, ((.body // "") | test("(?m)^\\s*-\\s+\\[\\s*\\]")), (.milestone.number // 0), ([.labels[].name] | join(","))] | @tsv' \
                2>/dev/null || true
            )"
            IFS=$'\t' read -r issue_state issue_title issue_has_unchecked \
              issue_milestone_number issue_labels \
              <<<"$issue_payload"
          fi
          if [[ "$issue_state" != "open" ]]; then
            echo "Issue #${issue_number} must exist and remain open until merge."
            exit 1
          fi
          if [[ -z "$pr_assignees" ]]; then
            echo "Assign the pull request to its human author."
            exit 1
          fi
          if [[ -n "${PR_AUTHOR:-}" && ",${pr_assignees}," != *",${PR_AUTHOR},"* ]]; then
            echo "The pull request author must be an assignee."
            exit 1
          fi
          if [[ "$pr_milestone_number" != "$issue_milestone_number" ]]; then
            echo "The pull request Milestone must match Issue #${issue_number}."
            exit 1
          fi
          issue_selected_label=""
          issue_selected_count=0
          for label in bug enhancement documentation; do
            if [[ ",${issue_labels:-}," == *",${label},"* ]]; then
              issue_selected_label="$label"
              issue_selected_count=$((issue_selected_count + 1))
            fi
          done
          if (( issue_selected_count != 1 )) || [[ "$selected_label" != "$issue_selected_label" ]]; then
            echo "The pull request classification label must match Issue #${issue_number}."
            exit 1
          fi
          development_cutover_pr="${PR_DEVELOPMENT_CUTOVER_PR:-1}"
          if [[ ! "$development_cutover_pr" =~ ^[0-9]+$ || ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "PR_DEVELOPMENT_CUTOVER_PR and PR_NUMBER must be non-negative integers."
            exit 1
          fi
          if [[ "${promotion:-false}" != "true" && "$require_complete" == "true" ]] && (( PR_NUMBER >= development_cutover_pr )); then
            if [[ "$PR_BASE" == "main" ]]; then
              if [[ "${PR_POLICY_FIXTURE:-false}" == "true" ]]; then
                if [[ "${PR_CLOSING_ISSUES_JSON+x}" == "x" ]]; then
                  closing_issues="$PR_CLOSING_ISSUES_JSON"
                else
                  closing_issues="$(
                    jq -cn \
                      --arg repo "$GITHUB_REPOSITORY" \
                      --argjson pr "$PR_NUMBER" \
                      --argjson issue "$issue_number" \
                      '{data: {repository: {pullRequest: {number: $pr, closingIssuesReferences: {nodes: [{number: $issue, repository: {nameWithOwner: $repo}}], pageInfo: {hasNextPage: false}}}}}}'
                  )"
                fi
              else
                repo_owner="${GITHUB_REPOSITORY%%/*}"
                repo_name="${GITHUB_REPOSITORY#*/}"
                if ! closing_issues="$(
                  # shellcheck disable=SC2016 # GraphQL variables must remain literal.
                  gh api graphql \
                    -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){number closingIssuesReferences(first:100){nodes{number repository{nameWithOwner}} pageInfo{hasNextPage}}}}}' \
                    -f owner="$repo_owner" -f name="$repo_name" -F number="$PR_NUMBER"
                )" || [[ -z "$closing_issues" ]]; then
                  echo "Cannot read the live pull request closing Issue relationship."
                  exit 1
                fi
              fi
              if ! jq -e \
                --arg repo "$GITHUB_REPOSITORY" \
                --argjson pr "$PR_NUMBER" \
                --argjson issue "$issue_number" '
                  .data.repository.pullRequest as $pull |
                  ($pull | type == "object") and
                  ($pull.number == $pr) and
                  ($pull.closingIssuesReferences | type == "object") and
                  ($pull.closingIssuesReferences.nodes | type == "array") and
                  ($pull.closingIssuesReferences.nodes | length == 1) and
                  ($pull.closingIssuesReferences.pageInfo.hasNextPage == false) and
                  ($pull.closingIssuesReferences.nodes[0] |
                    type == "object" and
                    .number == $issue and
                    (.repository | type == "object") and
                    (.repository.nameWithOwner | type == "string") and
                    ((.repository.nameWithOwner | ascii_downcase) == ($repo | ascii_downcase)))
                ' <<<"$closing_issues" >/dev/null; then
                echo "PR #${PR_NUMBER} must have exactly one authoritative closing Issue relationship to ${GITHUB_REPOSITORY}#${issue_number}."
                exit 1
              fi
            else
              if (( closing_count != 1 )) || [[ "$closing_issue_number" != "$issue_number" ]]; then
                echo "A non-default routine pull request must have exactly one live closing keyword for Issue #${issue_number}."
                exit 1
              fi
            fi
          fi
          if [[ "$require_complete" == "true" && "$issue_has_unchecked" == "true" ]]; then
            echo "Issue #${issue_number} still has unchecked acceptance tasks; closing keywords and Ready are blocked."
            exit 1
          fi
          if [[ -x ./scripts/validate-issue-title ]]; then
            ./scripts/validate-issue-title "$issue_title"
          fi

          if [[ "$branch_strategy" == "delivery" ]]; then
            if [[ "${promotion:-false}" == "true" ]]; then
              if [[ ",${issue_labels:-}," != *,promotion,* ]]; then
                echo "A delivery promotion must close an Issue labeled promotion."
                exit 1
              fi
              if [[ -n "${promotion_milestone:-}" && "$issue_milestone_number" != "$promotion_milestone" ]]; then
                echo "The promotion Issue Milestone must match the delivery branch number."
                exit 1
              fi
              exit 0
            fi

            if [[ "$release_recovery" == "true" ]]; then
              exit 0
            fi

            if [[ "$issue_milestone_number" == "0" ]]; then
              expected_base_kind="exact"
              expected_base="main"
            else
              expected_base_kind="milestone"
              expected_base="dev/m${issue_milestone_number}-"
            fi
          else
            expected_base_kind="exact"
            expected_base="$branch_strategy"
          fi

          base_branch="$PR_BASE"
          seen_bases="|"
          while true; do
            if [[ "$base_branch" == "dev/next" ]]; then
              echo "Legacy dev/next cannot be used as a pull request base or stack route."
              exit 1
            fi
            if [[ "$expected_base_kind" == "exact" && "$base_branch" == "$expected_base" ]]; then
              break
            fi
            if [[ "$expected_base_kind" == "milestone" && "$base_branch" =~ ^${expected_base}[a-z0-9][a-z0-9-]*$ ]]; then
              break
            fi
            if [[ "$seen_bases" == *"|${base_branch}|"* ]]; then
              echo "Pull request base chain contains a cycle at ${base_branch}."
              exit 1
            fi
            seen_bases+="${base_branch}|"

            if ! parent_output="$(
              gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/pulls" \
                -f state=open \
                -f head="${GITHUB_REPOSITORY%%/*}:${base_branch}" \
                --jq '.[].base.ref'
            )"; then
              echo "Cannot inspect the open pull request for base branch ${base_branch}."
              exit 1
            fi
            parent_bases=()
            while IFS= read -r parent_base; do
              [[ -n "$parent_base" ]] && parent_bases+=("$parent_base")
            done <<<"$parent_output"
            if (( ${#parent_bases[@]} != 1 )); then
              echo "Base branch ${base_branch} must have exactly one open pull request."
              exit 1
            fi
            base_branch="${parent_bases[0]}"
          done
      - name: Require final promotion to contain current main
        if: >-
          ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python3 scripts/delivery_sync.py gate
          --repo "$GITHUB_REPOSITORY"
          --base "$PR_BASE"
          --head-ref "$PR_HEAD"
          --head-sha "$PR_HEAD_SHA"
          --pr-number "$PR_NUMBER"
