name: OSV scheduled scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: osv-scheduled-${{ github.repository }}
  cancel-in-progress: false

jobs:
  scan:
    name: dependency vulnerability scan
    permissions:
      actions: read
      contents: read
      # The pinned reusable workflow declares this permission even when SARIF upload is disabled.
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
      upload-sarif: false
      fail-on-vuln: true
