name: Issue triage

on:
  issues:
    types: [opened, edited, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  classify:
    name: classify
    if: github.event.issue.user.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assign author and apply issue classification
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_STATE_REASON: ${{ github.event.issue.state_reason }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_TYPE: ${{ github.event.issue.type.name }}
        run: ./scripts/validate-issue-policy
