name: Delivery sync

on:
  pull_request:
    branches: [main, dev, "dev/**"]
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]

concurrency:
  group: delivery-sync-${{ github.repository }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  gate:
    name: delivery-sync
    if: >-
      ${{ github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the trusted target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      - name: Require the proposed head to contain current main
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python3 scripts/delivery_sync.py gate
          --repo "$GITHUB_REPOSITORY"
          --base "$PR_BASE"
          --head-ref "$PR_HEAD"
          --head-sha "$PR_HEAD_SHA"
          --pr-number "$PR_NUMBER"
      - name: Revalidate the queued promotion
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_BASE_REF: ${{ github.event.merge_group.base_ref }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: >-
          python3 scripts/delivery_sync.py merge-group-gate
          --repo "$GITHUB_REPOSITORY"
          --base "$QUEUE_BASE_REF"
          --base-sha "$QUEUE_BASE_SHA"
          --queue-ref "$QUEUE_HEAD_REF"
          --queue-sha "$QUEUE_HEAD_SHA"
