name: Delivery sync

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: delivery-sync-${{ github.repository }}-main
  cancel-in-progress: true

jobs:
  reconcile:
    name: reconcile
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reconcile active delivery branches
        env:
          GH_TOKEN: ${{ secrets.CSARC_SYNC_TOKEN || github.token }}
          MAIN_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          SYNC_AUTO: ${{ vars.CSARC_AUTO_SYNC == 'true' && 'true' || 'false' }}
          SYNC_TOKEN_KIND: ${{ secrets.CSARC_SYNC_TOKEN != '' && 'external' || 'github-token' }}
        run: |
          python3 scripts/delivery_sync.py reconcile \
            --repo "$GITHUB_REPOSITORY" \
            --main-sha "$MAIN_SHA" \
            --auto "$SYNC_AUTO" \
            --token-kind "$SYNC_TOKEN_KIND" | tee -a "$GITHUB_STEP_SUMMARY"
