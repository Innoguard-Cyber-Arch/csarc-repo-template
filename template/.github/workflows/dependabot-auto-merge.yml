name: Dependabot auto-merge

on:
  # The privileged jobs must use the workflow from the trusted base branch.
  # They authenticate the current head before doing any write.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  # Serialize every head transition for one PR without cancelling a sync run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  authenticate:
    name: authenticate-dependabot-head
    if: >-
      ${{
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        github.event.pull_request.base.ref == 'main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      snapshot_valid: ${{ steps.authenticate.outputs.snapshot_valid }}
      eligible: ${{ steps.authenticate.outputs.eligible }}
      base_sha: ${{ steps.authenticate.outputs.base_sha }}
      head_ref: ${{ steps.authenticate.outputs.head_ref }}
      head_sha: ${{ steps.authenticate.outputs.head_sha }}
    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Classify the current Dependabot head
        id: classify
        env:
          BASE_REPO: ${{ github.repository }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$BASE_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pull-request.json"
          head_sha="$(jq -r '.head.sha // empty' "$RUNNER_TEMP/pull-request.json")"
          base_sha="$(jq -r '.base.sha // empty' "$RUNNER_TEMP/pull-request.json")"
          if [[ -z "$head_sha" || -z "$base_sha" ]]; then
            echo "Pull request head or base SHA is missing." >&2
            exit 1
          fi
          gh api "repos/$BASE_REPO/commits/$head_sha" > "$RUNNER_TEMP/head-commit.json"
          gh api "repos/$BASE_REPO/compare/$base_sha...$head_sha" > "$RUNNER_TEMP/comparison.json"
          parent_sha="$(jq -r 'if (.parents | length) == 1 then .parents[0].sha else empty end' "$RUNNER_TEMP/head-commit.json")"
          if [[ "$parent_sha" =~ ^[0-9a-f]{40}$ ]]; then
            gh api "repos/$BASE_REPO/commits/$parent_sha" > "$RUNNER_TEMP/parent-commit.json"
            gh api "repos/$BASE_REPO/compare/$base_sha...$parent_sha" > "$RUNNER_TEMP/parent-comparison.json"
          else
            echo '{}' > "$RUNNER_TEMP/parent-commit.json"
            echo '{}' > "$RUNNER_TEMP/parent-comparison.json"
          fi
          python3 .csarc/scripts/authenticate_dependabot_head.py \
            --base-repo "$BASE_REPO" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --pull-request-json "$RUNNER_TEMP/pull-request.json" \
            --commit-json "$RUNNER_TEMP/head-commit.json" \
            --comparison-json "$RUNNER_TEMP/comparison.json" \
            --parent-commit-json "$RUNNER_TEMP/parent-commit.json" \
            --parent-comparison-json "$RUNNER_TEMP/parent-comparison.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish authenticated head
        id: authenticate
        if: ${{ always() }}
        env:
          SNAPSHOT_VALID: ${{ steps.classify.outputs.snapshot_valid }}
          DIRECT_ELIGIBLE: ${{ steps.classify.outputs.eligible }}
          BASE_SHA: ${{ steps.classify.outputs.base_sha }}
          HEAD_REF: ${{ steps.classify.outputs.head_ref }}
          HEAD_SHA: ${{ steps.classify.outputs.head_sha }}
        run: |
          eligible=false
          if [[ "$DIRECT_ELIGIBLE" == "true" ]]; then
            eligible=true
          fi
          {
            echo "snapshot_valid=$SNAPSHOT_VALID"
            echo "eligible=$eligible"
            echo "base_sha=$BASE_SHA"
            echo "head_ref=$HEAD_REF"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

  classify-update:
    name: classify Dependabot update
    needs: authenticate
    if: >-
      ${{
        needs.authenticate.result == 'success' &&
        needs.authenticate.outputs.eligible == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      update_type: ${{ steps.metadata.outputs.update-type }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      - name: Flag major updates for manual review
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-major' }}
        env:
          BASE_REPO: ${{ github.repository }}
          BASE_SHA: ${{ needs.authenticate.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ needs.authenticate.outputs.head_ref }}
          HEAD_SHA: ${{ needs.authenticate.outputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh api "repos/$BASE_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/current-pr.json"
          jq -e \
            --arg repo "$BASE_REPO" \
            --arg base_sha "$BASE_SHA" \
            --arg head_ref "$HEAD_REF" \
            --arg head_sha "$HEAD_SHA" \
            '.state == "open" and
             .base.ref == "main" and
             .base.repo.full_name == $repo and
             .base.sha == $base_sha and
             .head.ref == $head_ref and
             .head.repo.full_name == $repo and
             .head.sha == $head_sha' \
            "$RUNNER_TEMP/current-pr.json" > /dev/null
          gh pr edit "$PR_URL" --add-label needs-manual-review
          gh pr comment "$PR_URL" --body "This is a major version update, which may include breaking changes. Auto-merge is intentionally skipped; please review and merge manually."

  merge-eligible:
    name: dependabot-merge-eligible
    needs: classify-update
    if: >-
      ${{
        needs.classify-update.outputs.update_type == 'version-update:semver-patch' ||
        needs.classify-update.outputs.update_type == 'version-update:semver-minor'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Publish exact-head merge eligibility
        run: echo "This exact authenticated head is eligible for lifecycle merge."
