name: Milestone lifecycle

on:
  issues:
    types: [closed, reopened, milestoned]

permissions:
  contents: read
  issues: write

concurrency:
  group: milestone-${{ github.repository }}-${{ github.event.issue.milestone.number || 'none' }}
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    if: ${{ github.event.issue.milestone.number != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Reconcile Milestone from current GitHub state
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_NUMBER: ${{ github.event.issue.milestone.number }}
        run: >-
          uv run --no-project python scripts/sync_milestone_state.py
          --repo "$GITHUB_REPOSITORY"
          --milestone "$MILESTONE_NUMBER"
