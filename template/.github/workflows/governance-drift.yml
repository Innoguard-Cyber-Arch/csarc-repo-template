name: Governance drift check

on:
  schedule:
    - cron: "13 4 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: governance-drift-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository governance
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-governance-drift
