name: Zizmor scheduled audit

on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * 1"

concurrency:
  group: zizmor-scheduled-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Audit workflow definitions
        env:
          CSARC_ZIZMOR_TOKEN: ${{ github.repository == 'Innoguard-Cyber-Arch/csarc-repo-template' && github.token || '' }}
        run: |
          if [[ -n "$CSARC_ZIZMOR_TOKEN" ]]; then
            GH_TOKEN="$CSARC_ZIZMOR_TOKEN" \
              uvx --from zizmor==1.29.0 zizmor . --format plain
          else
            uvx --from zizmor==1.29.0 zizmor . --format plain
          fi
