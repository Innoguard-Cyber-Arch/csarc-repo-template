name: Release publish drift check

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Drift threshold in hours (default 24; see .csarc/docs/ci-policy.md)"
        required: false
        type: string

concurrency:
  group: release-drift-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release publish drift
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRIFT_HOURS: ${{ inputs.hours }}
        run: ./.csarc/scripts/check-release-drift
