name: Feature｜共同成果
description: 定義需要多張可獨立交付工作才能完成的共同成果
title: ""
labels: ["enhancement"]
type: "Feature"
body:
  - type: markdown
    attributes:
      value: >-
        **標題規則：**使用 12–80 個英文 ASCII 字元及至少三個詞，直接描述成果；
        不加 `[Feature]` 或 `feature:` 前綴，不以句點結尾。例如：`Add dependency policy checks`。
        建立前先依 AGENTS.md 搜尋相關 open／closed Issues，並在「補充」記錄沿用、
        取代或駁回的既有決策。Feature 是尚未完整達成的 parent；可獨立交付的工作
        另開 Task／Bug Sub-issue。UI 建立者請把自己設為 Assignee；agent／CLI 建立時
        明確使用 `--assignee @me`。若這張 Issue 沒有掛 Milestone（standalone 或
        hotfix），核准方式依發布層級決定：alpha 可由 admin 留
        `Admin-approve: <理由>` 自核，beta 以上須由另一位協作者留言 `Approve`。有掛
        Milestone 則沿用 tracker 的層級與核准，不得另選衝突值。
  - type: textarea
    id: problem
    attributes:
      label: 問題
      description: 一兩句話說明要共同解決的問題與原因。
    validations:
      required: true
  - type: dropdown
    id: release_level
    attributes:
      label: Release level / 發布層級
      description: Milestone 內工作須與 tracker 相同；沒有權限的建立者所選值會改用 repository 預設。
      options: [alpha, beta, early, formal]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完成條件
      description: 共同成果可觀察的完成條件；不要在 parent 重複 Sub-issue 的執行清單。
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: supplement
    attributes:
      label: 補充
      description: 選填：Sub-issue 分工、相關決策、驗證方式或風險。
    validations:
      required: false
