name: Documentation｜文件工作
description: 修改文件、範例或使用說明，不改產品行為
title: ""
# Documentation remains an orthogonal label for the native Task Type.
labels: ["documentation"]
type: "Task"
body:
  - type: markdown
    attributes:
      value: >-
        **標題規則：**使用 12–80 個英文 ASCII 字元及至少三個詞，直接描述成果；
        不加 `[Docs]` 或 `docs:` 前綴，不以句點結尾。例如：`Clarify repository setup guide`。
        Documentation 是純文件工作，原生 Type 使用 Task，並以 documentation Label
        與其他 Task 區分。建立前先依 AGENTS.md 搜尋相關 open／closed Issues，並在
        「補充」記錄既有決策。UI 建立者請把自己設為 Assignee；agent／CLI 建立時
        使用 `--assignee @me`。若這張 Issue 沒有掛 Milestone（standalone 或
        hotfix）固定走 stable；掛在 Milestone 的工作固定走 beta。是否允許 admin 以
        `Admin-approve: <理由>` 自核，由 repository 的 `admin_bypass` 設定決定。
  - type: textarea
    id: problem
    attributes:
      label: 問題
      description: 一兩句話說明讀者目前遇到的資訊缺口。
    validations:
      required: true
  - type: dropdown
    id: release_level
    attributes:
      label: Release level / 發布層級
      description: Milestone 內工作選 beta；standalone／hotfix 選 stable。early／formal 是專案成熟度，不在這裡選。
      options: [beta, stable]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完成條件
      description: 說明哪些文件內容與讀者結果會改變。
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: supplement
    attributes:
      label: 補充
      description: >-
        相關頁面、既有決策、驗證方式或影響範圍；下方「風險與控制」區塊必填（SPEC-010）：每個風險一列並至少一個控制，Owner 是 Issue assignee；R0 只適用 docs，不得涵蓋 AGENTS.md、SECURITY.md、.github/SECURITY.md 或 CI policy；有實質風險時改寫成 R1 起的風險列。PR 離開 Draft 前，在 PR 的「Requirement evidence」把每個 AC 與風險對應到 exact-head 證據。
      value: |
        #### 風險與控制

        | ID | 類別 | 等級 | 風險 | 控制 | 預計證據 | Owner |
        | --- | --- | --- | --- | --- | --- | --- |
        | R0 | none | — | TODO | TODO | scope:docs | TODO |
    validations:
      required: false
