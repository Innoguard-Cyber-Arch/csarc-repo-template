name: Task｜獨立工作
description: 定義一項能獨立完成、驗證與交付的預定工作
title: ""
# Portable fallback; lifecycle removes it when native Issue Types work.
labels: ["enhancement"]
type: "Task"
body:
  - type: markdown
    attributes:
      value: >-
        **標題規則：**使用 12–80 個英文 ASCII 字元及至少三個詞，直接描述成果；
        不加 `[Task]` 或 `task:` 前綴，不以句點結尾。例如：`Add dependency policy checks`。
        建立前先依 AGENTS.md 搜尋相關 open／closed Issues，並在「補充」記錄沿用、
        取代或駁回的既有決策。Milestone 工作直接掛入 Milestone，不另設 Feature parent；
        只有本工作是從某張主 Issue 必要拆出的部分時，才把它設為 parent；
        只有真實先後限制才設定 blocked by。UI 建立者請把自己設為 Assignee；
        agent／CLI 建立時明確使用 `--assignee @me`。若這張 Issue 沒有掛 Milestone
        （standalone 或 hotfix）固定走 stable；掛在 Milestone 的工作固定走 beta。是否允許
        admin 以 `Admin-approve: <理由>` 自核，由 repository 的 `admin_bypass` 設定決定。
  - type: textarea
    id: problem
    attributes:
      label: 問題
      description: 一兩句話說明現況與原因。
    validations:
      required: true
  - type: dropdown
    id: release_level
    attributes:
      label: Release level / 發布層級
      description: Milestone 內工作選 beta；standalone／hotfix 選 stable。early／formal 是專案成熟度，不在這裡選。
      options: [beta, stable]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完成條件
      description: 完成後可觀察到的結果；超出範圍另開 Issue。
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: supplement
    attributes:
      label: 補充
      description: >-
        parent／dependency 理由、相關決策、驗證方式或風險；下方「風險與控制」區塊必填（SPEC-010）：每個風險一列並至少一個控制，Owner 是 Issue assignee；只改一般文件時改用 R0（不得涵蓋 AGENTS.md、SECURITY.md 或 CI policy）。PR 離開 Draft 前，在 PR 的「Requirement evidence」把每個 AC 與風險對應到 exact-head 證據。
      value: |
        #### 風險與控制

        | ID | 類別 | 等級 | 風險 | 控制 | 預計證據 | Owner |
        | --- | --- | --- | --- | --- | --- | --- |
        | R1 | TODO | TODO | TODO | TODO | TODO | TODO |
    validations:
      required: false
