name: 開發工作
description: 英文標題摘要重點，內文用簡短中文定義一個可驗證改動
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: >-
        **標題規則：**使用 12–80 個英文 ASCII 字元及至少三個詞，直接描述成果；
        不加 `[Bug]` 或 `bug:` 前綴，不以句點結尾。例如：`Add dependency policy checks`。
  - type: dropdown
    id: kind
    attributes:
      label: 類型
      description: 只選最符合這張 Issue 的一種。
      options:
        - bug
        - enhancement
        - documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 問題與原因
      description: 誰遇到什麼問題？為什麼現在要處理？
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完成條件
      description: 完成後可以觀察到什麼結果？若新增需求超出這些條件，請另開 Issue。
      placeholder: "- [ ] 可由同事確認的結果"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 驗證方式
      description: 列出要執行的指令、測試或人工檢查。
      placeholder: "- 指令或檢查結果"
    validations:
      required: true
