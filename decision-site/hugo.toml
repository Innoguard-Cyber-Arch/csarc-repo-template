baseURL = "/"
title = "CSARC Repo Template｜AI 輔助 SDLC 團隊公版"
disableKinds = ["taxonomy", "term", "rss", "sitemap", "robotsTXT"]
defaultContentLanguage = "zh-tw"
defaultContentLanguageInSubdir = false

[languages]
  [languages.zh-tw]
  languageCode = "zh-Hant-TW"
  languageName = "繁體中文"
  title = "CSARC Repo Template｜AI 輔助 SDLC 團隊公版"
  weight = 1

  [languages.en]
  languageCode = "en"
  languageName = "English"
  title = "CSARC Repo Template | AI-assisted SDLC foundation"
  weight = 2

[outputs]
home = ["candidate", "llms"]

[outputFormats.candidate]
mediaType = "text/html"
baseName = "index"
isHTML = true
notAlternative = true

[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[markup.goldmark.renderer]
unsafe = true

[module]
  [module.hugoVersion]
  min = "0.165.0"
  max = "0.166.0"

  [[module.mounts]]
  source = "decision-site/content"
  target = "content"

  [[module.mounts]]
  source = "decision-site/layouts"
  target = "layouts"

  [[module.mounts]]
  source = "decision-site/data"
  target = "data"

  [[module.mounts]]
  source = "decision-site/static"
  target = "static"

  [[module.mounts]]
  source = "site/styles.css"
  target = "static/styles.css"
