# CSARC settings for the template repository itself (SPEC-009 schema 2).
# Copier source metadata belongs only to repositories generated from this source.
# The project name, description, license, and copyright holder are read from
# pyproject.toml and LICENSE; visibility and the repository URL are live facts.
schema_version: 2
admin_bypass: always
code_owner: '@Innoguard-Cyber-Arch/arch'
container: false
copilot_review: allowed
coverage_mode: global
coverage_threshold: 80
documentation_languages: zh-tw+en
documentation_mode: template-and-content
enable_codeql: false
github_project_url: ''
governance_mode: managed
languages:
- python
lifecycle:
- issues
- milestones
package_name: csarc_cli
project_maturity: early
project_run_command: uv run csarc --help
project_verification_hook: ''
python_floor: latest
release_ownership: csarc-owned
release_trigger: manual
scheduled_checks: []
security_reporting_channel: justyn.jt.chen@tw.ey.com
verification_mode: hosted
