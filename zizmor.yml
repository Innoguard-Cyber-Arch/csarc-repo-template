rules:
  dependabot-cooldown:
    ignore:
      # Team policy deliberately uses a three-day observation window.
      - dependabot.yml
  artipacked:
    ignore:
      # Issues #755/#830: the authenticated head checkout retains credentials
      # only to push the deterministic sync commit back with an exact-SHA
      # lease. The workflow never uploads artifacts or executes head code.
      - dependabot-auto-merge.yml
  dangerous-triggers:
    ignore:
      # Issue #830: this target trigger is the security boundary. A read-only
      # job authenticates the current GitHub-signed Dependabot head and exact
      # workflow-only diff before either writer starts. The sync job executes
      # only the base SHA's synchronizer and its push uses an exact-SHA lease.
      - dependabot-auto-merge.yml
      # pull_request_target is required to request a reviewer without granting
      # a fork PR write access to secrets. The job only checks out
      # `pull_request.base.sha` (never the untrusted head), sets
      # persist-credentials: false, and scripts/request-reviewer validates
      # PR_AUTHOR/PR_NUMBER against strict allowlist regexes before using them
      # in a `gh api` call, so untrusted PR content is never executed or
      # interpolated unsanitized.
      - governance-comment.yml
      # workflow_run keeps governance writes in a default-branch workflow
      # after the PR-controlled policy run. The jobs checkout only github.sha,
      # never checkout the triggering head or download its artifacts, and use
      # only GitHub-supplied PR numbers and head SHAs as data.
      - pr-policy-writes.yml
      # Issue #830: workflow_run only wakes a default-branch checkout. The
      # resolver binds one live same-repo Dependabot PR to the completed run;
      # no triggering artifact or code is consumed. Before writing, lifecycle
      # reauthenticates the exact head, trusted eligibility producer, required
      # checks, authorization, Rulesets, and remote lease.
      - dependabot-merge.yml
      # Issue #835: required check names must be produced by workflow
      # definitions loaded from the trusted base. PR policy and review only
      # checkout that base with read-only permissions. CI has contents:read,
      # no secrets or write permissions, and checks the proposed commit;
      # trusted execution evidence is separately owned by Issue #834.
      - ci.yml
      - pr-policy.yml
      - pr-review.yml
